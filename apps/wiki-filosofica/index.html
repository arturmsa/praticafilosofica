<title>Wiki Filosófica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: índice fixo à esquerda, verbete ao centro, painel de ligações à direita; no celular, tudo empilha e o índice vira gaveta */
:root{
  --bg:#eef1ee; --paper:#f8faf7; --ink:#1c2420; --muted:#5b6862; --line:#d3dbd5;
  --link:#24675f; --link-bg:#dcebe7; --thinker:#8a5a12; --thinker-bg:#f1e6d1; --hl:#fff3b8;
  --f-display:"Gloock",Georgia,"Times New Roman",serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --paper:#171d1a; --ink:#e3e9e5; --muted:#93a19a; --line:#2b3530;
  --link:#7cc7bb; --link-bg:#1d3532; --thinker:#e2b468; --thinker-bg:#352a17; --hl:#4b4319; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --paper:#171d1a; --ink:#e3e9e5; --muted:#93a19a; --line:#2b3530;
  --link:#7cc7bb; --link-bg:#1d3532; --thinker:#e2b468; --thinker-bg:#352a17; --hl:#4b4319; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:3px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);height:100%}
/* ÍNDICE */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.brand{padding:18px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand a{font-family:var(--f-display);font-size:1.5rem;color:var(--ink);text-decoration:none;line-height:1}
.brand small{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.search{padding:0 14px 10px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:.95rem}
.letters{display:flex;flex-wrap:wrap;gap:2px;padding:0 12px 10px}
.letters button{border:0;background:none;font-family:var(--f-ui);font-size:.82rem;width:24px;height:24px;border-radius:4px;cursor:pointer;color:var(--muted)}
.letters button:hover{background:var(--link-bg);color:var(--link)}
.letters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{list-style:none;margin:0;padding:0 6px 12px;overflow-y:auto;flex:1;border-top:1px solid var(--line)}
.list li.sep{font-family:var(--f-display);font-size:1.1rem;padding:10px 10px 2px;color:var(--muted)}
.list button{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;border:0;background:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.93rem}
.list button:hover{background:var(--link-bg)}
.list button.cur{background:var(--ink);color:var(--paper)}
.list button span.n{font-family:var(--f-ui);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.list button.cur span.n{color:inherit;opacity:.7}
.list .hit{font-family:var(--f-ui);font-size:.75rem;color:var(--muted);display:block;padding:0 10px 4px;line-height:1.3}
.sidefoot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.sidefoot button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 4px;cursor:pointer;font-family:var(--f-ui);font-size:.82rem}
.sidefoot button:hover{border-color:var(--link);color:var(--link)}

/* PRINCIPAL */
.main{overflow-y:auto;min-width:0}
.topbar{display:none}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:12px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);font-family:var(--f-ui);font-size:.8rem;color:var(--muted);min-height:44px}
.trail b{font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;margin-right:4px}
.trail button{border:0;background:none;cursor:pointer;padding:1px 4px;border-radius:3px;color:var(--link)}
.trail button:hover{background:var(--link-bg)}
.trail .arr{opacity:.5}
.trail .clear{margin-left:auto;color:var(--muted)}
.page{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(24px,4vw,56px);padding:clamp(20px,4vw,48px);padding-top:28px;max-width:1180px}
article{min-width:0;max-width:66ch}
.kicker{font-family:var(--f-ui);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.3rem,5vw,3.6rem);line-height:1.02;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
.etym{font-style:italic;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 1.2em}
.etym::before{content:"etimologia";display:block;font-style:normal;font-family:var(--f-ui);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.def{font-size:1.18rem;line-height:1.7}
.def a.l{color:var(--link);text-decoration:none;border-bottom:1px solid currentColor;padding:0 1px}
.def a.l:hover{background:var(--link-bg)}
.def a.p{color:var(--thinker);text-decoration:none;font-variant:small-caps;letter-spacing:.02em;padding:0 1px;border-radius:2px}
.def a.p:hover{background:var(--thinker-bg)}
.def mark{background:var(--hl);color:inherit;border-radius:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:1.6em}
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:6px;cursor:pointer;font-family:var(--f-ui);font-size:.85rem}
.btn:hover{border-color:var(--link);color:var(--link)}
.btn[aria-pressed="true"]{background:var(--thinker-bg);border-color:var(--thinker);color:var(--thinker)}
.legend{margin-top:2em;font-family:var(--f-ui);font-size:.8rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .lc::before{background:var(--link)}
.legend .tc::before{background:var(--thinker)}

/* PAINEL DE LIGAÇÕES */
aside.rel{min-width:0;display:flex;flex-direction:column;gap:22px}
.box h2{font-family:var(--f-ui);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.box h2 span{font-variant-numeric:tabular-nums;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.88rem}
.chip:hover{border-color:var(--link);color:var(--link)}
.chip.see{border-color:var(--link);color:var(--link);background:var(--link-bg)}
.chip.th{color:var(--thinker);border-color:var(--thinker-bg);background:var(--thinker-bg)}
.empty{font-size:.88rem;color:var(--muted);font-style:italic;margin:0}
.graph{border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.graph svg{display:block;width:100%;height:auto}
.graph text{font-family:var(--f-ui);font-size:11px;fill:var(--ink);pointer-events:none}
.graph .n circle{fill:var(--paper);stroke:var(--link);stroke-width:1.5;cursor:pointer;transition:r .15s}
.graph .n.in circle{stroke:var(--muted);stroke-dasharray:3 2}
.graph .n:hover circle{fill:var(--link-bg)}
.graph .n.c circle{fill:var(--ink);stroke:var(--ink)}
.graph .n.c text{fill:var(--paper);font-weight:600}
.graph line{stroke:var(--line);stroke-width:1}
.graph .cap{font-family:var(--f-ui);font-size:.72rem;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}

/* INÍCIO */
.home h1{font-size:clamp(2.6rem,6vw,4.4rem)}
.lede{font-size:1.15rem;color:var(--muted);max-width:56ch}
.quote{font-family:var(--f-display);font-size:1.4rem;line-height:1.3;margin:1.2em 0;padding-left:16px;border-left:3px solid var(--link)}
.quote cite{display:block;font-family:var(--f-ui);font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;margin-top:2em}
.homegrid h2{font-family:var(--f-ui);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.day h3{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0 0 .2em}
.day p{margin:0 0 .6em;font-size:.95rem}
.rank{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.rank li{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.rank button{border:0;background:none;cursor:pointer;padding:0;color:var(--link);font-size:.95rem;text-align:left}
.rank .bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--link)}
.rank small{font-family:var(--f-ui);color:var(--muted);width:2.2em;text-align:right}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--f-ui);color:var(--muted);font-size:.85rem;margin-top:1em}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.9rem;color:var(--ink);line-height:1}

/* PENSADORES */
.thlist{columns:3 200px;column-gap:28px;margin-top:1em;padding:0;list-style:none}
.thlist li{break-inside:avoid;padding:2px 0}
.thlist button{border:0;background:none;cursor:pointer;color:var(--thinker);font-variant:small-caps;font-size:1rem;padding:0}
.thlist small{font-family:var(--f-ui);color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.thentries{list-style:none;padding:0;margin:1em 0 0;display:flex;flex-direction:column;gap:14px}
.thentries li{border-left:2px solid var(--thinker-bg);padding-left:14px}
.thentries button{border:0;background:none;cursor:pointer;font-family:var(--f-display);font-size:1.3rem;color:var(--ink);padding:0}
.thentries p{margin:.2em 0 0;font-size:.95rem;color:var(--muted)}

/* PRÉVIA */
.peek{position:fixed;z-index:20;max-width:340px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 10px 30px rgb(0 0 0 / .18);pointer-events:none;font-size:.9rem;line-height:1.5}
.peek strong{font-family:var(--f-display);font-weight:400;font-size:1.2rem;display:block}
.peek em{display:block;color:var(--muted);font-size:.8rem;margin-bottom:4px}

@media (max-width:1000px){ .page{grid-template-columns:minmax(0,1fr)} aside.rel{max-width:66ch} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .topbar{display:flex;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px}
  .topbar a{font-family:var(--f-display);font-size:1.2rem;color:var(--ink);text-decoration:none;flex:1}
  .closeidx{display:block!important}
}
.closeidx{display:none;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:var(--f-ui);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="side" id="side" aria-label="Índice de verbetes">
    <div class="brand"><a href="#inicio" data-go="inicio">Wiki Filosófica</a><small id="count"></small><button class="closeidx" id="closeidx">Fechar</button></div>
    <div class="search"><input id="q" type="search" placeholder="Buscar conceito ou palavra…" aria-label="Buscar" autocomplete="off"></div>
    <div class="letters" id="letters"></div>
    <ul class="list" id="list"></ul>
    <div class="sidefoot">
      <button id="rnd" title="Abrir um verbete ao acaso">Ao acaso</button>
      <button id="ths">Pensadores</button>
      <button id="favs">Favoritos</button>
    </div>
  </nav>
  <main class="main" id="main">
    <div class="topbar"><a href="#inicio" data-go="inicio">Wiki Filosófica</a><button class="btn" id="openidx">Índice</button></div>
    <div class="trail" id="trail"></div>
    <div id="view"></div>
  </main>
</div>
<div class="peek" id="peek" hidden></div>

<script>
const DATA = [{"id":"a-posteriori","t":"A posteriori","e":"lat. \"a partir do que vem depois\"","a":"[[conhecimento|Conhecimento]] que depende da [[experiencia|experiência]]. Só sabemos que \"a água ferve a 100 °C ao nível do mar\" porque observamos. Opõe-se ao [[a-priori|a priori]]. A distinção é central em {{Kant|Kant}}.","see":[],"p":["Kant"]},{"id":"a-priori","t":"A priori","e":"lat. \"a partir do que vem antes\"","a":"[[conhecimento|Conhecimento]] que não depende da [[experiencia|experiência]] e vale de modo [[universal|universal]] e necessário, como \"todo triângulo tem três lados\". Para {{Kant|Kant}}, o [[espaco|espaço]], o [[tempo|tempo]] e as [[categoria|categorias]] são formas a priori que organizam toda experiência.","see":[],"p":["Kant"]},{"id":"alienacao","t":"Alienação","e":"lat. alienatio, de alienus: \"o que pertence a outro\"; al. Entfremdung","a":"Condição em que o ser humano se torna estranho àquilo que ele mesmo produz, faz ou é. No [[direito|direito]], é a transferência de um bem. Em {{Hegel|Hegel}}, é o [[movimento|movimento]] do [[espirito|espírito]] que sai de si e se reconhece no mundo. Em {{Feuerbach|Feuerbach}}, é a projeção das [[qualidade|qualidades]] humanas em [[deus|Deus]]. Em {{Marx|Marx}}, é o trabalhador separado do produto, do processo, de si mesmo e dos outros.","see":[],"p":["Hegel","Feuerbach","Marx"]},{"id":"alma","t":"Alma","e":"lat. anima; gr. psyché: \"sopro\", \"princípio vital\"","a":"[[principio|Princípio]] que dá [[vida|vida]], [[movimento|movimento]] e [[pensamento|pensamento]] ao [[corpo|corpo]]. Para {{Platão|Platão}}, é imortal e dividida em [[razao|razão]], ânimo e [[desejo|desejo]]. Para {{Aristóteles|Aristóteles}}, é a forma do corpo vivo e não existe separada dele. {{Descartes|Descartes}} a identifica com a [[substancia|substância]] pensante.","see":[],"p":["Platão","Aristóteles","Descartes"]},{"id":"alteridade","t":"Alteridade","e":"lat. alteritas, de alter: \"o outro\"","a":"Caráter daquilo que é outro, diferente de mim. Na [[etica|ética]], é reconhecer e respeitar o outro em sua [[diferenca|diferença]]. Para {{Levinas|Levinas}}, o rosto do outro me interpela e me torna responsável por ele: a ética nasce desse encontro.","see":[],"p":["Levinas"]},{"id":"amizade","t":"Amizade","e":"gr. philía; lat. amicitia","a":"Vínculo de afeto, confiança e [[reciprocidade|reciprocidade]] entre pessoas. {{Aristóteles|Aristóteles}} distingue a amizade por utilidade, por [[prazer|prazer]] e a amizade verdadeira, baseada no bem, que é rara e duradoura. Para {{Epicuro|Epicuro}}, a amizade é um dos maiores bens da [[vida|vida]] feliz.","see":[],"p":["Aristóteles","Epicuro"]},{"id":"amor","t":"Amor","e":"gr. éros, philía, agápe; lat. amor","a":"Afeto que nos liga a alguém ou a algo. Os gregos distinguiam o éros ([[desejo|desejo]]), a philía ([[amizade|amizade]]) e o agápe (amor desinteressado, que o cristianismo valorizou). No Banquete de {{Platão|Platão}}, o amor nos eleva da [[beleza|beleza]] dos [[corpo|corpos]] até a beleza em si.","see":[],"p":["Platão"]},{"id":"amor-fati","t":"Amor fati","e":"lat. \"amor ao destino\"","a":"Expressão de {{Nietzsche|Nietzsche}}: aceitar e amar tudo o que acontece, inclusive a dor, sem desejar que a [[vida|vida]] fosse diferente. Retoma ideias [[estoicismo|estoicas]], mas como afirmação alegre da [[existencia|existência]].","see":[],"p":["Nietzsche"]},{"id":"anarquismo","t":"Anarquismo","e":"gr. an-: \"sem\" + arché: \"governo\", \"princípio\"","a":"Corrente [[politica|política]] que defende uma [[sociedade|sociedade]] sem [[estado|Estado]] e sem hierarquias impostas, organizada pela [[cooperacao|cooperação]] [[liberdade|livre]]. {{Proudhon|Proudhon}}, {{Bakunin|Bakunin}} e {{Kropotkin|Kropotkin}} são seus principais pensadores. Não significa desordem, mas ausência de dominação.","see":[],"p":["Proudhon","Bakunin","Kropotkin"]},{"id":"angustia","t":"Angústia","e":"lat. angustia: \"estreiteza\", \"aperto\"","a":"[[sentimento|Sentimento]] de inquietação diante do indeterminado. Para {{Kierkegaard|Kierkegaard}}, é a \"vertigem da [[liberdade|liberdade]]\" diante das possibilidades. Para {{Heidegger|Heidegger}}, revela a finitude e a [[morte|morte]]. Para {{Sartre|Sartre}}, nasce da [[consciencia|consciência]] de que somos responsáveis por nossas escolhas.","see":[],"p":["Kierkegaard","Heidegger","Sartre"]},{"id":"antitese","t":"Antítese","e":"gr. antíthesis: \"posição contrária\"","a":"Afirmação que se opõe a outra (a [[tese|tese]]). Na [[dialetica|dialética]] de {{Hegel|Hegel}}, o conflito entre tese e antítese produz uma [[sintese|síntese]], que conserva e supera ambas. Ver Tese e Síntese.","see":["tese","sintese"],"p":["Hegel"]},{"id":"aparencia","t":"Aparência","e":"lat. apparentia: \"o que se mostra\"","a":"Aquilo que se mostra aos sentidos, que pode corresponder ou não ao que a coisa realmente é. {{Platão|Platão}} opõe aparência e essência na alegoria da caverna. {{Kant|Kant}} distingue o [[fenomeno|fenômeno]] (o que aparece) da coisa em si.","see":[],"p":["Platão","Kant"]},{"id":"apatia","t":"Apatia","e":"gr. apátheia: \"ausência de paixão\"","a":"Para os [[estoicismo|estoicos]], é o estado do [[sabio|sábio]] que não se deixa dominar pelas [[paixao|paixões]] e mantém a serenidade. No uso comum, passou a significar indiferença ou falta de ânimo.","see":[],"p":[]},{"id":"apolineo","t":"Apolíneo","e":"de Apolo, deus grego da luz e da forma","a":"Em {{Nietzsche|Nietzsche}}, [[principio|princípio]] da medida, da ordem, da forma clara e da [[razao|razão]], expresso na escultura e na [[arte|arte]] equilibrada. Opõe-se e complementa o [[dionisiaco|dionisíaco]]. A [[tragico|tragédia]] grega nasceria do encontro dos dois.","see":[],"p":["Nietzsche"]},{"id":"aporia","t":"Aporia","e":"gr. aporía: \"sem passagem\", \"sem saída\"","a":"Dificuldade de raciocínio que parece não ter solução, quando dois [[argumento|argumentos]] igualmente fortes levam a conclusões opostas. Muitos diálogos de {{Platão|Platão}} terminam em aporia, convidando o leitor a continuar pensando.","see":[],"p":["Platão"]},{"id":"argumento","t":"Argumento","e":"lat. argumentum, de arguere: \"tornar claro\", \"provar\"","a":"Conjunto de afirmações (premissas) organizadas para justificar outra (conclusão). Pode ser dedutivo, quando a conclusão segue necessariamente das premissas, ou indutivo, quando é apenas provável. Argumentar é dar [[razao|razões]], e não apenas [[opiniao|opiniões]].","see":[],"p":[]},{"id":"aristocracia","t":"Aristocracia","e":"gr. áristos: \"os melhores\" + krátos: \"poder\"","a":"Governo dos melhores. Para {{Platão|Platão}} e {{Aristóteles|Aristóteles}}, é uma forma boa de governo quando os mais virtuosos governam para o [[bem-comum|bem comum]]. Sua forma corrompida é a [[oligarquia|oligarquia]]. Depois, o termo passou a designar a nobreza hereditária.","see":[],"p":["Platão","Aristóteles"]},{"id":"arquetipo","t":"Arquétipo","e":"gr. archétypon: \"modelo original\"","a":"Modelo primeiro do qual as coisas são cópias. Em {{Platão|Platão}}, as [[ideia|Ideias]] são arquétipos. Em {{Jung|Jung}}, são imagens [[universal|universais]] do [[inconsciente|inconsciente]] coletivo, como a mãe, o herói e a sombra, presentes em [[mito|mitos]] de todos os povos.","see":[],"p":["Platão","Jung"]},{"id":"arte","t":"Arte","e":"lat. ars; gr. téchne: \"saber fazer\"","a":"Atividade humana de criar obras que expressam sentidos, [[emocao|emoções]] e visões de mundo. Para os gregos, incluía todo saber técnico. {{Platão|Platão}} via a arte como imitação da imitação. {{Aristóteles|Aristóteles}} valorizou a catarse da [[tragico|tragédia]]. A [[estetica|estética]] estuda a arte e o belo.","see":[],"p":["Platão","Aristóteles"]},{"id":"assentimento","t":"Assentimento","e":"lat. assensus: \"concordância\"","a":"Ato de aceitar algo como verdadeiro. Para os [[estoicismo|estoicos]], o [[sabio|sábio]] só dá assentimento às [[representacao|representações]] claras e seguras. Os [[ceticismo|céticos]] recomendavam suspender o assentimento (epoché).","see":[],"p":[]},{"id":"ataraxia","t":"Ataraxia","e":"gr. ataraxía: \"ausência de perturbação\"","a":"Tranquilidade da [[alma|alma]], [[liberdade|livre]] de medos e inquietações. Para {{Epicuro|Epicuro}}, é, junto com a ausência de dor no [[corpo|corpo]], a condição da [[felicidade|felicidade]]. Para os [[ceticismo|céticos]], nasce da suspensão do [[juizo|juízo]].","see":[],"p":["Epicuro"]},{"id":"ateismo","t":"Ateísmo","e":"gr. a-: \"sem\" + theós: \"deus\"","a":"Posição de quem nega a [[existencia|existência]] de [[deus|Deus]] ou de deuses. Pensadores como {{Feuerbach|Feuerbach}}, {{Marx|Marx}}, {{Nietzsche|Nietzsche}} e {{Sartre|Sartre}} desenvolveram [[critica|críticas]] à [[religiao|religião]]. Diferente do agnosticismo, que afirma não ser possível saber.","see":[],"p":["Feuerbach","Marx","Nietzsche","Sartre"]},{"id":"ativismo","t":"Ativismo","e":"lat. activus: \"ativo\"","a":"Atitude de engajamento prático na transformação da [[sociedade|sociedade]], por meio de campanhas, protestos e organização coletiva. {{Marx|Marx}} afirmou que os filósofos apenas interpretaram o mundo, e o importante é transformá-lo.","see":[],"p":["Marx"]},{"id":"ato","t":"Ato","e":"lat. actus; gr. enérgeia","a":"Em {{Aristóteles|Aristóteles}}, é a realização de uma possibilidade. A semente é árvore em [[potencia|potência]]; a árvore crescida é árvore em ato. O par ato e potência explica o [[movimento|movimento]] e a mudança. Ver Potência.","see":["potencia"],"p":["Aristóteles"]},{"id":"atomismo","t":"Atomismo","e":"gr. átomos: \"indivisível\"","a":"Doutrina de {{Leucipo|Leucipo}} e {{Demócrito|Demócrito}}, retomada por {{Epicuro|Epicuro}} e {{Lucrécio|Lucrécio}}: tudo é composto de partículas indivisíveis que se movem no vazio. Foi a primeira explicação [[materialismo|materialista]] da natureza.","see":[],"p":["Leucipo","Demócrito","Epicuro","Lucrécio"]},{"id":"autonomia","t":"Autonomia","e":"gr. autós: \"si mesmo\" + nómos: \"lei\"","a":"Capacidade de dar a si mesmo as próprias regras e agir por decisão própria. Opõe-se à [[heteronomia|heteronomia]]. Para {{Kant|Kant}}, a [[vontade|vontade]] é autônoma quando segue a [[lei|lei]] que a própria [[razao|razão]] estabelece. Para {{Paulo Freire|Paulo Freire}}, a [[educacao|educação]] deve formar [[sujeito|sujeitos]] autônomos.","see":[],"p":["Kant","Paulo Freire"]},{"id":"autoridade","t":"Autoridade","e":"lat. auctoritas, de auctor: \"autor\", \"fundador\"","a":"[[poder|Poder]] reconhecido como legítimo, aceito sem necessidade de força. {{Max Weber|Weber}} distingue a autoridade tradicional ([[costume|costume]]), a racional-legal ([[lei|leis]] e cargos) e a carismática ([[qualidade|qualidades]] pessoais). {{Hannah Arendt|Hannah Arendt}} mostra que autoridade não é violência nem persuasão.","see":[],"p":["Max Weber","Hannah Arendt"]},{"id":"autossuficiencia","t":"Autossuficiência","e":"gr. autárkeia: \"bastar a si mesmo\"","a":"Condição de quem não depende de nada exterior. Para {{Aristóteles|Aristóteles}}, a [[felicidade|felicidade]] é autossuficiente, e a cidade é a comunidade capaz de bastar a si mesma. [[estoicismo|Estoicos]] e [[cinismo|cínicos]] viam na autossuficiência a [[liberdade|liberdade]] do [[sabio|sábio]].","see":[],"p":["Aristóteles"]},{"id":"axioma","t":"Axioma","e":"gr. axíoma: \"o que é digno\", \"o que se impõe\"","a":"[[proposicao|Proposição]] aceita como evidente, sem necessidade de [[demonstracao|demonstração]], que serve de ponto de partida para outras. Exemplo de {{Euclides|Euclides}}: \"o todo é maior que a parte\".","see":[],"p":["Euclides"]},{"id":"barbarie","t":"Barbárie","e":"lat. barbaries","a":"[[estado|Estado]] de violência, crueldade e destruição dos [[valor|valores]] humanos. {{Adorno|Adorno}} afirmou que a [[educacao|educação]] deve impedir que Auschwitz se repita, isto é, combater a barbárie dentro da própria [[civilizacao|civilização]].","see":[],"p":["Adorno"]},{"id":"barbaro","t":"Bárbaro","e":"gr. bárbaros: \"o que balbucia\", \"estrangeiro\"","a":"Para os gregos, era quem não falava grego. Depois passou a significar o \"não civilizado\". {{Montaigne|Montaigne}} e {{Lévi-Strauss|Lévi-Strauss}} criticaram esse uso: \"bárbaro é quem acredita na [[barbarie|barbárie]]\" do outro.","see":[],"p":["Montaigne","Lévi-Strauss"]},{"id":"behaviorismo","t":"Behaviorismo","e":"ingl. behavior: \"comportamento\"","a":"Corrente da [[psicologia|psicologia]] ({{Watson|Watson}}, {{Skinner|Skinner}}) que estuda apenas o comportamento observável, explicado por estímulos, respostas e reforços, deixando de lado a [[consciencia|consciência]] e a introspecção.","see":[],"p":["Watson","Skinner"]},{"id":"beleza","t":"Beleza","e":"lat. bellus; gr. kalón","a":"[[qualidade|Qualidade]] daquilo que agrada ao ser contemplado. Para {{Platão|Platão}}, o belo está ligado ao bem e à [[verdade|verdade]]. Para {{Kant|Kant}}, o belo agrada universalmente e sem interesse. Hoje se discute se a beleza está no [[objeto|objeto]] ou no olhar de quem contempla.","see":[],"p":["Platão","Kant"]},{"id":"bem","t":"Bem","e":"lat. bonum; gr. agathón","a":"Aquilo que é desejável, valioso ou correto. Para {{Platão|Platão}}, a [[ideia|Ideia]] do Bem é a mais alta de todas, como o sol que ilumina. Para {{Aristóteles|Aristóteles}}, o bem é aquilo a que todas as coisas tendem. Na [[etica|ética]], o bem é o critério do agir correto.","see":[],"p":["Platão","Aristóteles"]},{"id":"bem-comum","t":"Bem comum","e":"lat. bonum commune","a":"Conjunto de condições que permitem a todos os membros de uma comunidade viver bem. Para {{Aristóteles|Aristóteles}}, é o fim da [[politica|política]]. Para {{Tomás de Aquino|Tomás de Aquino}}, as [[lei|leis]] só são justas quando ordenadas a ele. Para {{Rousseau|Rousseau}}, é o [[objeto|objeto]] da [[vontade|vontade]] geral.","see":[],"p":["Aristóteles","Tomás de Aquino","Rousseau"]},{"id":"boa-vontade","t":"Boa vontade","e":"al. guter Wille","a":"Em {{Kant|Kant}}, a única coisa boa em si mesma, sem restrição. A boa [[vontade|vontade]] age por [[dever|dever]], e seu [[valor|valor]] não depende dos resultados. Inteligência e [[coragem|coragem]] podem servir ao mal; a boa vontade, não.","see":[],"p":["Kant"]},{"id":"burocracia","t":"Burocracia","e":"fr. bureau: \"escritório\" + gr. krátos: \"poder\"","a":"Organização baseada em regras escritas, hierarquia de cargos e procedimentos impessoais. Para {{Max Weber|Weber}}, é a forma mais racional de administrar, mas pode se tornar uma \"jaula de ferro\" que aprisiona a [[vida|vida]] em regras.","see":[],"p":["Max Weber"]},{"id":"calculo-hedonistico","t":"Cálculo hedonístico","e":"gr. hedoné: \"prazer\"","a":"Método proposto por {{Bentham|Bentham}} para avaliar ações medindo o [[prazer|prazer]] e a dor que produzem, segundo critérios como intensidade, duração, certeza e número de pessoas afetadas. É a base do [[utilitarismo|utilitarismo]] clássico.","see":[],"p":["Bentham"]},{"id":"canon","t":"Cânon","e":"gr. kanón: \"régua\", \"medida\"","a":"Regra ou modelo que serve de padrão. Na [[arte|arte]], conjunto de proporções ideais (o cânon de {{Policleto|Policleto}}). Na [[cultura|cultura]], lista de obras consideradas clássicas. Na [[religiao|religião]], conjunto de livros [[sagrado|sagrados]] reconhecidos.","see":[],"p":["Policleto"]},{"id":"caos","t":"Caos","e":"gr. cháos: \"abismo\", \"vazio\"","a":"Para os antigos [[mito|mitos]] gregos, como em {{Hesíodo|Hesíodo}}, o estado primeiro e informe do qual nasce o cosmos (a ordem). Hoje designa desordem total ou, na ciência, [[sistema|sistemas]] cujo comportamento é imprevisível.","see":[],"p":["Hesíodo"]},{"id":"capital","t":"Capital","e":"lat. capitalis, de caput: \"cabeça\" (de gado, como riqueza)","a":"Riqueza investida para produzir mais riqueza. Para {{Adam Smith|Adam Smith}}, permite a divisão do [[trabalho|trabalho]]. Para {{Marx|Marx}}, é uma relação social entre donos dos meios de [[producao|produção]] e trabalhadores. {{Bourdieu|Bourdieu}} fala também em capital cultural e social.","see":[],"p":["Adam Smith","Marx","Bourdieu"]},{"id":"capitalismo","t":"Capitalismo","e":"","a":"[[sistema|Sistema]] econômico baseado na [[propriedade|propriedade]] privada dos meios de [[producao|produção]], no [[trabalho|trabalho]] assalariado, no [[mercado|mercado]] e na busca do [[lucro|lucro]]. {{Adam Smith|Adam Smith}} o defendeu pela eficiência; {{Max Weber|Weber}} estudou sua relação com a [[etica|ética]] protestante; {{Marx|Marx}} o criticou pela exploração.","see":[],"p":["Adam Smith","Max Weber","Marx"]},{"id":"categoria","t":"Categoria","e":"gr. kategoría: \"o que se diz de algo\"","a":"Conceito mais geral pelo qual pensamos as coisas. {{Aristóteles|Aristóteles}} listou dez ([[substancia|substância]], [[quantidade|quantidade]], [[qualidade|qualidade]], relação, lugar, [[tempo|tempo]] etc.). Para {{Kant|Kant}}, as categorias são [[conceito|conceitos]] puros do [[entendimento|entendimento]], como [[causalidade|causalidade]] e [[unidade|unidade]].","see":[],"p":["Aristóteles","Kant"]},{"id":"causalidade","t":"Causalidade","e":"lat. causa","a":"Relação entre causa e efeito. {{Aristóteles|Aristóteles}} distinguiu quatro causas: material, formal, eficiente e final. {{Hume|Hume}} mostrou que só vemos sucessão de fatos, e que a ligação necessária vem do [[habito|hábito]]. Para {{Kant|Kant}}, é uma [[categoria|categoria]] do [[entendimento|entendimento]].","see":[],"p":["Aristóteles","Hume","Kant"]},{"id":"ceticismo","t":"Ceticismo","e":"gr. sképsis: \"exame\", \"investigação\"","a":"Atitude filosófica de duvidar da possibilidade de conhecer a [[verdade|verdade]] com certeza. {{Pirro|Pirro}} e {{Sexto Empírico|Sexto Empírico}} recomendavam suspender o [[juizo|juízo]] para alcançar a tranquilidade. Na modernidade, {{Montaigne|Montaigne}} e {{Hume|Hume}} renovaram o ceticismo.","see":[],"p":["Pirro","Sexto Empírico","Montaigne","Hume"]},{"id":"cidadania","t":"Cidadania","e":"lat. civitas: \"cidade\", \"conjunto de cidadãos\"","a":"Condição de quem pertence a uma comunidade política, com [[direito|direitos]] e [[dever|deveres]]. Em Atenas, excluía mulheres, escravos e estrangeiros. {{T. H. Marshall|T. H. Marshall}} distingue direitos civis, [[politica|políticos]] e sociais como dimensões da cidadania moderna.","see":[],"p":["T. H. Marshall"]},{"id":"cinismo","t":"Cinismo","e":"gr. kyon: \"cão\"","a":"Escola de {{Antístenes|Antístenes}} e {{Diógenes de Sinope|Diógenes de Sinope}}, que defendia viver segundo a natureza, com o mínimo, desprezando convenções, riqueza e fama. {{Diógenes de Sinope|Diógenes}} vivia num barril. Hoje \"cínico\" indica quem age com desfaçatez, sentido bem diferente.","see":[],"p":["Antístenes","Diógenes de Sinope"]},{"id":"civilizacao","t":"Civilização","e":"lat. civis: \"cidadão\"","a":"[[estado|Estado]] de desenvolvimento de uma [[sociedade|sociedade]], com cidades, [[lei|leis]], [[tecnica|técnicas]] e [[cultura|cultura]]. {{Freud|Freud}} viu nela a renúncia aos instintos e a origem do mal-estar. Pensadores críticos denunciam o uso do termo para justificar a dominação de outros povos.","see":[],"p":["Freud"]},{"id":"classe","t":"Classe","e":"lat. classis: \"grupo\", \"divisão\"","a":"Grupo social definido pela posição na [[producao|produção]] e na distribuição da riqueza. Para {{Marx|Marx}}, a [[historia|história]] é a história da luta de classes, como burguesia e proletariado. {{Max Weber|Weber}} acrescenta critérios como status e [[poder|poder]].","see":[],"p":["Marx","Max Weber"]},{"id":"coisa","t":"Coisa","e":"lat. causa; res","a":"Aquilo que existe, real ou pensado, especialmente o [[objeto|objeto]] concreto. {{Kant|Kant}} distingue a coisa como aparece para nós ([[fenomeno|fenômeno]]) da coisa em si, que não podemos conhecer. Coisificar é tratar uma pessoa como coisa.","see":[],"p":["Kant"]},{"id":"competicao","t":"Competição","e":"lat. competere: \"disputar a mesma coisa\"","a":"Disputa entre pessoas ou grupos que buscam o mesmo objetivo. Para {{Hobbes|Hobbes}}, a competição por recursos leva à guerra de todos contra todos. O [[liberalismo|liberalismo]] a vê como motor da eficiência; críticos apontam seus efeitos sobre a [[desigualdade|desigualdade]] e o individualismo.","see":[],"p":["Hobbes"]},{"id":"compreensao","t":"Compreensão","e":"lat. comprehendere: \"abarcar\", \"prender junto\"","a":"Ato de apreender o sentido de algo. {{Dilthey|Dilthey}} distingue explicar (próprio das ciências naturais) e compreender (próprio das ciências humanas, que interpretam ações e [[intencao|intenções]]). A hermenêutica é a [[teoria|teoria]] da compreensão.","see":[],"p":["Dilthey"]},{"id":"comunismo","t":"Comunismo","e":"lat. communis: \"comum\"","a":"Doutrina e projeto de [[sociedade|sociedade]] sem [[classe|classes]], sem [[propriedade|propriedade]] privada dos meios de [[producao|produção]] e sem [[estado|Estado]], na qual os bens seriam distribuídos \"de cada um segundo sua capacidade, a cada um segundo suas necessidades\". Formulado por {{Marx|Marx}} e {{Engels|Engels}}.","see":[],"p":["Marx","Engels"]},{"id":"conceito","t":"Conceito","e":"lat. conceptus: \"o que é concebido\"","a":"[[representacao|Representação]] mental geral que reúne as características comuns de um conjunto de coisas. O conceito de \"árvore\" vale para todas as árvores. Para {{Sócrates|Sócrates}}, filosofar é buscar o conceito, a definição [[universal|universal]]. {{Deleuze|Deleuze}} vê a [[filosofia|filosofia]] como criação de conceitos.","see":[],"p":["Sócrates","Deleuze"]},{"id":"conduta","t":"Conduta","e":"lat. conducere: \"conduzir\"","a":"Modo de agir de uma pessoa, considerado do ponto de vista [[moral|moral]] ou social. A [[etica|ética]] avalia condutas; a [[psicologia|psicologia]] as estuda como comportamento.","see":[],"p":[]},{"id":"conhecimento","t":"Conhecimento","e":"lat. cognoscere; gr. epistéme","a":"Relação entre um [[sujeito|sujeito]] que conhece e um [[objeto|objeto]] conhecido. Tradicionalmente, é a [[crenca|crença]] verdadeira e justificada. {{Platão|Platão}} o distingue da [[opiniao|opinião]] (dóxa). [[racionalismo|Racionalistas]] o fundam na [[razao|razão]]; [[empirismo|empiristas]], na [[experiencia|experiência]]; {{Kant|Kant}} une as duas fontes.","see":[],"p":["Platão","Kant"]},{"id":"conjectura","t":"Conjectura","e":"lat. coniectura: \"suposição\"","a":"[[hipotese|Hipótese]] ou suposição ainda não comprovada. Para {{Karl Popper|Karl Popper}}, a ciência avança por conjecturas ousadas e tentativas de [[refutacao|refutação]].","see":[],"p":["Karl Popper"]},{"id":"consciencia","t":"Consciência","e":"lat. conscientia: \"saber junto\", \"saber de si\"","a":"Capacidade de perceber o mundo e a si mesmo. Em {{Descartes|Descartes}}, \"penso, logo existo\" é a primeira certeza. A consciência [[moral|moral]] é o [[juizo|juízo]] interior sobre o certo e o errado. Para {{Marx|Marx}}, a [[vida|vida]] material determina a consciência. {{Husserl|Husserl}} mostra que toda consciência é consciência de algo.","see":[],"p":["Descartes","Marx","Husserl"]},{"id":"consequencia","t":"Consequência","e":"lat. consequentia: \"o que segue\"","a":"Aquilo que resulta de uma ação ou que se deduz de uma afirmação. Na [[etica|ética]], o consequencialismo, como o [[utilitarismo|utilitarismo]], julga as ações por seus resultados, e não pelas [[intencao|intenções]].","see":[],"p":[]},{"id":"construtivismo","t":"Construtivismo","e":"lat. construere: \"construir\"","a":"[[teoria|Teoria]] segundo a qual o [[conhecimento|conhecimento]] não é cópia da realidade, mas construído pelo [[sujeito|sujeito]] em interação com o meio. Na [[educacao|educação]], {{Piaget|Piaget}} e {{Vygotsky|Vygotsky}} são suas referências. Na [[politica|política]] e na ciência, indica que muitas realidades são construções sociais.","see":[],"p":["Piaget","Vygotsky"]},{"id":"consumo","t":"Consumo","e":"lat. consumere: \"gastar\", \"esgotar\"","a":"Uso de bens e serviços para satisfazer necessidades e [[desejo|desejos]]. {{Epicuro|Epicuro}} distinguia desejos naturais e vazios. {{Marx|Marx}} falou do [[fetichismo|fetichismo]] da mercadoria. {{Baudrillard|Baudrillard}} e {{Bauman|Bauman}} mostram que, na [[sociedade|sociedade]] de consumo, compramos símbolos e status.","see":[],"p":["Epicuro","Marx","Baudrillard","Bauman"]},{"id":"contrato-social","t":"Contrato social","e":"","a":"Acordo pelo qual os indivíduos abrem mão de parte da [[liberdade|liberdade]] natural em troca de segurança e [[direito|direitos]]. Para {{Hobbes|Hobbes}}, cria um soberano forte. Para {{Locke|Locke}}, protege [[vida|vida]], liberdade e [[propriedade|propriedade]]. Para {{Rousseau|Rousseau}}, funda a [[vontade|vontade]] geral.","see":[],"p":["Hobbes","Locke","Rousseau"]},{"id":"contratualismo","t":"Contratualismo","e":"lat. contractus: \"acordo\"","a":"Conjunto de [[teoria|teorias]] [[politica|políticas]] ({{Hobbes|Hobbes}}, {{Locke|Locke}}, {{Rousseau|Rousseau}}) segundo as quais a [[sociedade|sociedade]] e o [[estado|Estado]] nascem de um pacto entre indivíduos que viviam em estado de natureza. {{Rawls|Rawls}} renovou essa [[tradicao|tradição]] no século XX.","see":[],"p":["Hobbes","Locke","Rousseau","Rawls"]},{"id":"cooperacao","t":"Cooperação","e":"lat. cooperari: \"trabalhar junto\"","a":"Ação conjunta para um objetivo comum. Para {{Aristóteles|Aristóteles}}, o ser humano é um animal [[politica|político]] que só se realiza em comunidade. {{Kropotkin|Kropotkin}} mostrou que a ajuda mútua é tão importante para a evolução quanto a [[competicao|competição]].","see":[],"p":["Aristóteles","Kropotkin"]},{"id":"coragem","t":"Coragem","e":"lat. cor: \"coração\"; gr. andreía","a":"Virtude de enfrentar o perigo e o medo pelo que é justo. Para {{Aristóteles|Aristóteles}}, é o justo meio entre a covardia e a temeridade. É uma das quatro [[virtude|virtudes]] cardeais.","see":[],"p":["Aristóteles"]},{"id":"corpo","t":"Corpo","e":"lat. corpus; gr. sôma","a":"Realidade material e viva do ser humano. {{Platão|Platão}} via o corpo como prisão da [[alma|alma]]. {{Descartes|Descartes}} o separou da mente como [[substancia|substância]] extensa. {{Merleau-Ponty|Merleau-Ponty}} mostrou que somos corpo e que é por ele que percebemos o mundo. {{Foucault|Foucault}} estudou o corpo disciplinado pelo [[poder|poder]].","see":[],"p":["Platão","Descartes","Merleau-Ponty","Foucault"]},{"id":"corrupcao","t":"Corrupção","e":"lat. corrumpere: \"estragar\", \"deteriorar\"","a":"Em sentido amplo, degeneração de algo. {{Aristóteles|Aristóteles}} fala em formas corrompidas de governo, quando os governantes servem a si mesmos. Em sentido [[politica|político]], uso do [[poder|poder]] público para vantagens privadas.","see":[],"p":["Aristóteles"]},{"id":"cosmologia","t":"Cosmologia","e":"gr. kósmos: \"ordem\", \"mundo\" + lógos","a":"Estudo da origem, da estrutura e da ordem do universo. Os primeiros filósofos gregos, como {{Tales|Tales}} e {{Anaximandro|Anaximandro}}, eram cosmólogos. Hoje é também um ramo da física.","see":[],"p":["Tales","Anaximandro"]},{"id":"costume","t":"Costume","e":"lat. consuetudo","a":"Modo de agir habitual de um grupo, transmitido pela [[tradicao|tradição]]. A palavra [[moral|moral]] vem do latim mos, e [[etica|ética]] do grego éthos, ambos ligados ao costume. {{Hume|Hume}} via no costume o grande guia da [[vida|vida]] humana.","see":[],"p":["Hume"]},{"id":"crenca","t":"Crença","e":"lat. credere: \"crer\", \"confiar\"","a":"[[estado|Estado]] de quem aceita algo como verdadeiro, com ou sem provas. Para {{Platão|Platão}}, o [[conhecimento|conhecimento]] é mais que crença: precisa de justificação. {{Peirce|Peirce}} definiu a crença como [[habito|hábito]] que orienta a ação.","see":[],"p":["Platão","Peirce"]},{"id":"crise","t":"Crise","e":"gr. krísis: \"decisão\", \"julgamento\"","a":"Momento de ruptura, em que algo precisa ser decidido. Na medicina grega, era o ponto em que a doença se definia. Fala-se em crise econômica, [[politica|política]], de [[valor|valores]]. {{Husserl|Husserl}} escreveu sobre a crise das ciências europeias.","see":[],"p":["Husserl"]},{"id":"critica","t":"Crítica","e":"gr. kríno: \"separar\", \"julgar\"","a":"Atitude de examinar algo com cuidado, separando o que tem fundamento do que não tem. {{Sócrates|Sócrates}} questionava as certezas. {{Kant|Kant}} investigou os limites da [[razao|razão]]. A [[teoria|teoria]] crítica da Escola de Frankfurt busca revelar formas ocultas de dominação.","see":[],"p":["Sócrates","Kant"]},{"id":"criticismo","t":"Criticismo","e":"","a":"Nome da [[filosofia|filosofia]] de {{Kant|Kant}}, que antes de conhecer qualquer coisa examina a própria [[razao|razão]], seus [[poder|poderes]] e limites. Busca superar tanto o [[dogmatismo|dogmatismo]] quanto o [[ceticismo|ceticismo]].","see":[],"p":["Kant"]},{"id":"cultura","t":"Cultura","e":"lat. colere: \"cultivar\"","a":"Tudo o que o ser humano cria e transmite: [[linguagem|linguagem]], [[costume|costumes]], [[crenca|crenças]], [[tecnica|técnicas]], [[arte|artes]] e [[valor|valores]]. Opõe-se ao que é puramente natural. Na antropologia, é o modo de [[vida|vida]] de um povo, sem hierarquia entre culturas.","see":[],"p":[]},{"id":"darwinismo","t":"Darwinismo","e":"de Charles Darwin (1809-1882)","a":"[[teoria|Teoria]] da evolução das espécies por seleção natural: os seres com características mais adaptadas ao meio sobrevivem e se reproduzem mais. Abalou a ideia de um ser humano separado da natureza e de uma criação fixa.","see":[],"p":[]},{"id":"darwinismo-social","t":"Darwinismo social","e":"","a":"Aplicação indevida da seleção natural à [[sociedade|sociedade]], defendida por {{Herbert Spencer|Herbert Spencer}} e outros: os \"mais aptos\" venceriam naturalmente. Serviu para justificar [[desigualdade|desigualdades]], colonialismo e [[racismo|racismo]]. Não é ciência, mas [[ideologia|ideologia]].","see":[],"p":["Herbert Spencer"]},{"id":"deducao","t":"Dedução","e":"lat. deducere: \"conduzir de\"","a":"Raciocínio que parte de premissas gerais e chega a uma conclusão necessária. Se as premissas são verdadeiras e o raciocínio é válido, a conclusão é certamente verdadeira. O [[silogismo|silogismo]] é o exemplo clássico.","see":[],"p":[]},{"id":"demagogia","t":"Demagogia","e":"gr. dêmos: \"povo\" + agogós: \"condutor\"","a":"Manipulação do povo por meio de promessas fáceis, apelo às [[emocao|emoções]] e aos medos, em vez de [[argumento|argumentos]]. {{Aristóteles|Aristóteles}} a via como a degeneração da [[democracia|democracia]].","see":[],"p":["Aristóteles"]},{"id":"democracia","t":"Democracia","e":"gr. dêmos: \"povo\" + krátos: \"poder\"","a":"Regime em que o poder pertence ao povo. Em Atenas, era direta, decidida em assembleia. A democracia moderna é representativa, com eleições e separação dos [[poder|poderes]] ({{Montesquieu|Montesquieu}}). Para {{Habermas|Habermas}}, depende também do debate público racional.","see":[],"p":["Montesquieu","Habermas"]},{"id":"demonstracao","t":"Demonstração","e":"lat. demonstrare: \"mostrar\"","a":"Raciocínio que prova a [[verdade|verdade]] de uma [[proposicao|proposição]] a partir de [[principio|princípios]] já aceitos. Para {{Aristóteles|Aristóteles}}, a ciência é [[conhecimento|conhecimento]] demonstrativo. É o método da matemática.","see":[],"p":["Aristóteles"]},{"id":"deontologia","t":"Deontologia","e":"gr. déon: \"dever\" + lógos","a":"[[etica|Ética]] do [[dever|dever]]: certas ações são certas ou erradas em si mesmas, independentemente das [[consequencia|consequências]]. {{Kant|Kant}} é seu maior representante. Também designa os códigos de ética profissionais.","see":[],"p":["Kant"]},{"id":"desejo","t":"Desejo","e":"lat. desiderium","a":"Tendência que nos move em direção a algo que falta. {{Platão|Platão}} o vê como falta; {{Epicuro|Epicuro}} distingue desejos naturais e vazios; {{Espinosa|Espinosa}} diz que o desejo é a própria essência do ser humano; para {{Freud|Freud}}, o desejo [[inconsciente|inconsciente]] move a [[vida|vida]] psíquica.","see":[],"p":["Platão","Epicuro","Espinosa","Freud"]},{"id":"desigualdade","t":"Desigualdade","e":"lat. inaequalitas","a":"[[diferenca|Diferença]] no acesso a bens, [[direito|direitos]] e [[poder|poder]]. Para {{Rousseau|Rousseau}}, nasce da [[propriedade|propriedade]] privada. Para {{Marx|Marx}}, da divisão entre [[classe|classes]]. Para {{Rawls|Rawls}}, só é justa se beneficiar os mais desfavorecidos e houver [[igualdade|igualdade]] de oportunidades.","see":[],"p":["Rousseau","Marx","Rawls"]},{"id":"destino","t":"Destino","e":"lat. destinare: \"fixar\", \"determinar\"","a":"Força que determinaria antecipadamente os acontecimentos. Na [[tragico|tragédia]] grega, ninguém escapa dele, como Édipo. Os [[estoicismo|estoicos]] o identificavam com a [[razao|razão]] que governa o universo. Ver [[amor-fati|Amor fati]].","see":["amor-fati"],"p":[]},{"id":"determinismo","t":"Determinismo","e":"lat. determinare: \"delimitar\"","a":"Doutrina segundo a qual todo acontecimento é efeito necessário de causas anteriores. {{Laplace|Laplace}} imaginou que, conhecendo todas as causas, poderíamos prever tudo. O problema central é se ele deixa lugar para a [[liberdade|liberdade]] humana.","see":[],"p":["Laplace"]},{"id":"deus","t":"Deus","e":"lat. deus; gr. theós","a":"Ser supremo, causa primeira e fundamento de tudo, nas [[tradicao|tradições]] religiosas e [[metafisica|metafísicas]]. {{Aristóteles|Aristóteles}} o pensou como motor imóvel; {{Tomás de Aquino|Tomás de Aquino}} formulou cinco vias para provar sua [[existencia|existência]]; {{Espinosa|Espinosa}} o identificou com a natureza; {{Nietzsche|Nietzsche}} anunciou que \"Deus está morto\".","see":[],"p":["Aristóteles","Tomás de Aquino","Espinosa","Nietzsche"]},{"id":"dever","t":"Dever","e":"lat. debere: \"estar obrigado\"","a":"Aquilo que se deve fazer por obrigação [[moral|moral]], legal ou social. Para {{Kant|Kant}}, agir por dever é agir porque é certo, segundo o imperativo categórico: agir de modo que a regra da ação possa valer para todos.","see":[],"p":["Kant"]},{"id":"dever-ser","t":"Dever-ser","e":"al. Sollen","a":"Aquilo que deveria ser, segundo uma norma ou ideal, em oposição ao que é (ser). {{Hume|Hume}} mostrou que não se pode deduzir o dever-ser do ser: do fato de algo acontecer não segue que deva acontecer.","see":[],"p":["Hume"]},{"id":"devir","t":"Devir","e":"lat. devenire: \"tornar-se\"","a":"O vir a ser, a mudança contínua de todas as coisas. Para {{Heráclito|Heráclito}}, tudo flui e \"ninguém se banha duas vezes no mesmo rio\". Opõe-se ao ser imutável de {{Parmênides|Parmênides}}. {{Nietzsche|Nietzsche}} e {{Hegel|Hegel}} valorizaram o devir.","see":[],"p":["Heráclito","Parmênides","Nietzsche","Hegel"]},{"id":"dialetica","t":"Dialética","e":"gr. dialektiké, de dialégesthai: \"conversar\"","a":"Método que avança pelo confronto de ideias opostas. Em {{Sócrates|Sócrates}} e {{Platão|Platão}}, é a [[arte|arte]] do diálogo. Em {{Hegel|Hegel}}, é o [[movimento|movimento]] da realidade por [[tese|tese]], [[antitese|antítese]] e [[sintese|síntese]]. Em {{Marx|Marx}}, o [[materialismo|materialismo]] dialético explica a [[historia|história]] pelos conflitos entre [[classe|classes]].","see":[],"p":["Sócrates","Platão","Hegel","Marx"]},{"id":"diferenca","t":"Diferença","e":"lat. differentia","a":"Aquilo que distingue uma coisa de outra. Na [[logica|lógica]], a diferença específica distingue uma espécie dentro de um gênero (\"animal racional\"). No século XX, {{Deleuze|Deleuze}} e {{Derrida|Derrida}} pensaram a diferença como anterior à [[identidade|identidade]]. Ver Identidade.","see":["identidade"],"p":["Deleuze","Derrida"]},{"id":"dignidade","t":"Dignidade","e":"lat. dignitas: \"valor\"","a":"[[valor|Valor]] que toda pessoa possui por ser humana. Para {{Kant|Kant}}, as coisas têm preço e podem ser trocadas; as pessoas têm dignidade e devem ser tratadas sempre como fim, nunca apenas como meio. É fundamento dos [[direito|direitos]] humanos e da Constituição de 1988.","see":[],"p":["Kant"]},{"id":"dilema","t":"Dilema","e":"gr. dílemma: \"dupla premissa\"","a":"Situação em que é preciso escolher entre duas alternativas, ambas difíceis ou indesejáveis. Os dilemas [[moral|morais]], como o famoso \"dilema do bonde\", testam nossos [[principio|princípios]] [[etica|éticos]].","see":[],"p":[]},{"id":"dionisiaco","t":"Dionisíaco","e":"de Dioniso, deus grego do vinho e do êxtase","a":"Em {{Nietzsche|Nietzsche}}, [[principio|princípio]] da embriaguez, da [[paixao|paixão]], da [[musica|música]] e da fusão com a [[vida|vida]], além da [[razao|razão]] e da forma. Opõe-se e complementa o [[apolineo|apolíneo]]. Ver Apolíneo e [[socratismo|Socratismo]].","see":["apolineo","socratismo"],"p":["Nietzsche"]},{"id":"direito","t":"Direito","e":"lat. directum: \"o que é reto\"; ius","a":"Conjunto de normas garantidas pelo [[estado|Estado]] que regulam a [[vida|vida]] social; também aquilo que cada um pode exigir legitimamente. O direito natural afirma direitos anteriores às [[lei|leis]]; o [[positivismo|positivismo]] jurídico ({{Kelsen|Kelsen}}) reconhece apenas a lei válida. Nem tudo que é legal é justo.","see":[],"p":["Kelsen"]},{"id":"diversidade","t":"Diversidade","e":"lat. diversitas","a":"[[existencia|Existência]] de [[diferenca|diferenças]] de [[cultura|cultura]], [[crenca|crença]], origem, gênero, [[opiniao|opinião]] e modos de [[vida|vida]]. O pluralismo defende que essa variedade deve ser reconhecida e respeitada numa [[sociedade|sociedade]] [[democracia|democrática]].","see":[],"p":[]},{"id":"dogma","t":"Dogma","e":"gr. dógma: \"opinião\", \"decreto\"","a":"Afirmação considerada verdadeira e indiscutível, especialmente na [[religiao|religião]]. Em sentido crítico, [[crenca|crença]] aceita sem exame.","see":[],"p":[]},{"id":"dogmatismo","t":"Dogmatismo","e":"","a":"Atitude de quem afirma [[verdade|verdades]] sem examinar seus fundamentos ou admitir questionamento. {{Kant|Kant}} chamou de dogmática a [[metafisica|metafísica]] que pretendia conhecer além da [[experiencia|experiência]] sem antes criticar a [[razao|razão]]. Opõe-se ao [[ceticismo|ceticismo]] e ao [[criticismo|criticismo]].","see":[],"p":["Kant"]},{"id":"dor","t":"Dor","e":"lat. dolor","a":"[[sensacao|Sensação]] ou [[sentimento|sentimento]] de sofrimento físico ou [[moral|moral]]. Para {{Epicuro|Epicuro}}, a [[felicidade|felicidade]] é ausência de dor. Para {{Schopenhauer|Schopenhauer}}, a [[vida|vida]] oscila entre a dor e o [[tedio|tédio]]. Para o [[utilitarismo|utilitarismo]], a dor é o critério negativo da moral.","see":[],"p":["Epicuro","Schopenhauer"]},{"id":"duvida","t":"Dúvida","e":"lat. dubitare","a":"[[estado|Estado]] de quem suspende o [[juizo|juízo]] entre afirmar e negar. Para {{Descartes|Descartes}}, a dúvida metódica é o caminho para encontrar uma [[verdade|verdade]] indubitável: duvidando de tudo, resta a certeza de que penso.","see":[],"p":["Descartes"]},{"id":"ecologia","t":"Ecologia","e":"gr. oîkos: \"casa\" + lógos","a":"Ciência das relações entre os seres vivos e o meio ambiente. Na [[filosofia|filosofia]], a ecologia profunda ({{Arne Naess|Arne Naess}}) defende o [[valor|valor]] intrínseco da natureza. {{Hans Jonas|Hans Jonas}} propõe a [[responsabilidade|responsabilidade]] com as gerações futuras.","see":[],"p":["Arne Naess","Hans Jonas"]},{"id":"educacao","t":"Educação","e":"lat. educare: \"criar\", \"conduzir para fora\"","a":"Processo de formação do ser humano. Para {{Platão|Platão}}, é voltar a [[alma|alma]] para a luz, como na saída da caverna. {{Rousseau|Rousseau}} defendeu respeitar a natureza da criança. {{Kant|Kant}}: \"o homem só se torna homem pela educação\". {{Paulo Freire|Paulo Freire}} propôs uma educação libertadora, contra a educação \"bancária\".","see":[],"p":["Platão","Rousseau","Kant","Paulo Freire"]},{"id":"eficiencia","t":"Eficiência","e":"lat. efficere: \"realizar\"","a":"Capacidade de alcançar resultados com o menor uso de recursos. A [[teoria|teoria]] [[critica|crítica]] alerta que, quando vira [[valor|valor]] absoluto, a eficiência ignora se os fins são bons. Ver [[razao-instrumental|Razão instrumental]].","see":["razao-instrumental"],"p":[]},{"id":"ego","t":"Ego","e":"lat. \"eu\"","a":"Na [[psicanalise|psicanálise]] de {{Freud|Freud}}, instância psíquica que media entre os [[desejo|desejos]] do id, as exigências do superego e a realidade. No uso comum, a imagem que a pessoa tem de si.","see":[],"p":["Freud"]},{"id":"elite","t":"Elite","e":"fr. élite: \"escolhido\"","a":"Grupo minoritário que ocupa posições de [[poder|poder]], riqueza ou prestígio. {{Pareto|Pareto}} e {{Mosca|Mosca}} defenderam que toda [[sociedade|sociedade]] é governada por elites. Críticos discutem como elas se perpetuam.","see":[],"p":["Pareto","Mosca"]},{"id":"em-si","t":"Em si","e":"al. an sich","a":"Aquilo que algo é independentemente de qualquer relação com outro. {{Kant|Kant}} fala da \"coisa em si\", inacessível ao [[conhecimento|conhecimento]]. Para {{Sartre|Sartre}}, o \"em si\" é o ser das coisas, maciço e idêntico a si, oposto ao \"para si\" da [[consciencia|consciência]].","see":[],"p":["Kant","Sartre"]},{"id":"emanacao","t":"Emanação","e":"lat. emanare: \"fluir de\"","a":"No [[neoplatonismo|neoplatonismo]] de {{Plotino|Plotino}}, processo pelo qual todas as coisas derivam do Uno, como a luz que irradia do sol, sem que ele se diminua.","see":[],"p":["Plotino"]},{"id":"emancipacao","t":"Emancipação","e":"lat. emancipatio: \"libertação do poder do pai\"","a":"Libertação de uma condição de dependência ou dominação. Para {{Kant|Kant}}, o [[iluminismo|Iluminismo]] é a saída da menoridade, isto é, da incapacidade de pensar por si. Para {{Marx|Marx}} e {{Paulo Freire|Paulo Freire}}, exige superar a exploração e a opressão.","see":[],"p":["Kant","Marx","Paulo Freire"]},{"id":"emocao","t":"Emoção","e":"lat. emovere: \"pôr em movimento\"","a":"Reação afetiva intensa e passageira, como medo, alegria ou raiva, que envolve o [[corpo|corpo]] e a mente. Os [[estoicismo|estoicos]] a viam como perturbação; {{Espinosa|Espinosa}} a estudou como afeto; {{Damásio|Damásio}} mostra que emoções são essenciais para decidir bem.","see":[],"p":["Espinosa","Damásio"]},{"id":"empatia","t":"Empatia","e":"gr. en: \"dentro\" + páthos: \"sentimento\"","a":"Capacidade de se colocar no lugar do outro e compreender o que ele sente. {{Hume|Hume}} e {{Adam Smith|Adam Smith}} falavam em simpatia como base da [[moral|moral]]. {{Edith Stein|Edith Stein}} estudou a empatia na [[fenomeno|fenomenologia]].","see":[],"p":["Hume","Adam Smith","Edith Stein"]},{"id":"empirismo","t":"Empirismo","e":"gr. empeiría: \"experiência\"","a":"Corrente que afirma que todo [[conhecimento|conhecimento]] vem da [[experiencia|experiência]] sensível. Para {{Locke|Locke}}, a mente nasce como uma \"folha em branco\". {{Berkeley|Berkeley}} e {{Hume|Hume}} levaram o empirismo a [[consequencia|consequências]] céticas. Opõe-se ao [[racionalismo|racionalismo]].","see":[],"p":["Locke","Berkeley","Hume"]},{"id":"ente","t":"Ente","e":"lat. ens: \"o que é\"","a":"Tudo aquilo que é ou existe. {{Heidegger|Heidegger}} distingue o ente (as coisas que são) do ser (aquilo pelo qual os entes são), e critica a [[metafisica|metafísica]] por ter esquecido essa [[diferenca|diferença]].","see":[],"p":["Heidegger"]},{"id":"entendimento","t":"Entendimento","e":"lat. intellectus; al. Verstand","a":"Faculdade de compreender e julgar por [[conceito|conceitos]]. {{Locke|Locke}} escreveu o Ensaio sobre o entendimento humano. Para {{Kant|Kant}}, o entendimento organiza os dados da sensibilidade por meio das [[categoria|categorias]], enquanto a [[razao|razão]] busca a [[unidade|unidade]] última. Ver [[compreensao|Compreensão]].","see":["compreensao"],"p":["Locke","Kant"]},{"id":"epicurismo","t":"Epicurismo","e":"de Epicuro (341-270 a.C.)","a":"Escola que identifica a [[felicidade|felicidade]] com o [[prazer|prazer]], entendido como ausência de dor no [[corpo|corpo]] e de perturbação na [[alma|alma]] ([[ataraxia|ataraxia]]). Valoriza a [[amizade|amizade]], a [[vida|vida]] simples e a libertação do medo dos deuses e da [[morte|morte]].","see":[],"p":[]},{"id":"epistemologia","t":"Epistemologia","e":"gr. epistéme: \"ciência\" + lógos","a":"Parte da [[filosofia|filosofia]] que estuda o [[conhecimento|conhecimento]], especialmente o científico: seus fundamentos, métodos, limites e [[validade|validade]]. Também chamada [[teoria|teoria]] do conhecimento ou gnosiologia.","see":[],"p":[]},{"id":"equidade","t":"Equidade","e":"lat. aequitas: \"igualdade\", \"justiça\"","a":"[[justica|Justiça]] adaptada ao caso concreto, que trata desigualmente os desiguais para alcançar a [[igualdade|igualdade]] real. {{Aristóteles|Aristóteles}} a comparava à régua flexível de Lesbos, que se molda à pedra.","see":[],"p":["Aristóteles"]},{"id":"eros","t":"Eros","e":"gr. éros: \"amor\", \"desejo\"","a":"[[amor|Amor]] como [[desejo|desejo]] e falta. No Banquete de {{Platão|Platão}}, Eros é filho da Pobreza e do Recurso, e conduz da [[beleza|beleza]] dos [[corpo|corpos]] à beleza em si. Em {{Freud|Freud}}, é a pulsão de [[vida|vida]], oposta à pulsão de [[morte|morte]].","see":[],"p":["Platão","Freud"]},{"id":"esoterico","t":"Esotérico","e":"gr. esoterikós: \"interior\"","a":"Ensino reservado a um grupo restrito de iniciados, em oposição ao exotérico, destinado a todos. {{Aristóteles|Aristóteles}} teria tido obras dos dois tipos. Hoje se refere a saberes ocultos ou místicos.","see":[],"p":["Aristóteles"]},{"id":"espaco","t":"Espaço","e":"lat. spatium","a":"Extensão em que as coisas estão situadas. Para {{Newton|Newton}}, é absoluto, um recipiente que existe por si. Para {{Leibniz|Leibniz}}, é relação entre as coisas. Para {{Kant|Kant}}, é forma [[a-priori|a priori]] da sensibilidade. {{Einstein|Einstein}} o uniu ao [[tempo|tempo]].","see":[],"p":["Newton","Leibniz","Kant","Einstein"]},{"id":"especie","t":"Espécie","e":"lat. species: \"aspecto\", \"tipo\"","a":"Na [[logica|lógica]], [[classe|classe]] que reúne indivíduos com a mesma essência, dentro de um gênero mais amplo (o ser humano é uma espécie do gênero animal). Na biologia, grupo de seres que se reproduzem entre si.","see":[],"p":[]},{"id":"espirito","t":"Espírito","e":"lat. spiritus: \"sopro\"; gr. pneûma","a":"[[principio|Princípio]] imaterial do [[pensamento|pensamento]] e da [[vida|vida]] interior. Para {{Hegel|Hegel}}, o Espírito é a [[razao|razão]] que se realiza na [[historia|história]], na [[cultura|cultura]], no [[estado|Estado]], na [[arte|arte]], na [[religiao|religião]] e na [[filosofia|filosofia]].","see":[],"p":["Hegel"]},{"id":"estado","t":"Estado","e":"lat. status: \"condição\"","a":"Organização [[politica|política]] que exerce [[poder|poder]] sobre um território e uma população por meio de [[lei|leis]] e instituições. {{Maquiavel|Maquiavel}} o pensou de forma moderna; {{Max Weber|Weber}} o definiu pelo monopólio da força legítima; o [[liberalismo|liberalismo]] o quer mínimo; {{Marx|Marx}} o vê a serviço da [[classe|classe]] dominante.","see":[],"p":["Maquiavel","Max Weber","Marx"]},{"id":"estetica","t":"Estética","e":"gr. aisthesis: \"sensação\", \"percepção\"","a":"Parte da [[filosofia|filosofia]] que estuda o belo, a [[arte|arte]] e a [[experiencia|experiência]] sensível. O termo foi criado por {{Baumgarten|Baumgarten}} no século XVIII. {{Kant|Kant}}, {{Hegel|Hegel}} e {{Nietzsche|Nietzsche}} estão entre seus grandes pensadores.","see":[],"p":["Baumgarten","Kant","Hegel","Nietzsche"]},{"id":"estoicismo","t":"Estoicismo","e":"gr. stoá: \"pórtico\", onde Zenão ensinava","a":"Escola fundada por {{Zenão de Cítio|Zenão de Cítio}}, seguida por {{Sêneca|Sêneca}}, {{Epicteto|Epicteto}} e {{Marco Aurélio|Marco Aurélio}}. Ensina viver de acordo com a [[razao|razão]] e a natureza, distinguir o que depende de nós do que não depende e aceitar o [[destino|destino]] com serenidade.","see":[],"p":["Zenão de Cítio","Sêneca","Epicteto","Marco Aurélio"]},{"id":"estruturalismo","t":"Estruturalismo","e":"","a":"Corrente do século XX que busca explicar [[fenomeno|fenômenos]] humanos pelas estruturas invisíveis que os organizam. Começou na linguística de {{Saussure|Saussure}} e foi aplicada por {{Lévi-Strauss|Lévi-Strauss}} (antropologia), {{Lacan|Lacan}} ([[psicanalise|psicanálise]]) e {{Althusser|Althusser}} (marxismo).","see":[],"p":["Saussure","Lévi-Strauss","Lacan","Althusser"]},{"id":"etica","t":"Ética","e":"gr. éthos: \"morada\", \"caráter\"","a":"Parte da [[filosofia|filosofia]] que reflete sobre o agir humano e o bem. A ética das [[virtude|virtudes]] ({{Aristóteles|Aristóteles}}) busca a [[felicidade|felicidade]] pelos bons [[habito|hábitos]]; a do [[dever|dever]] ({{Kant|Kant}}) segue [[principio|princípios]] [[universal|universais]]; a das [[consequencia|consequências]] ([[utilitarismo|utilitarismo]]) busca o maior bem-estar. A [[moral|moral]] é vivida; a ética é pensada.","see":[],"p":["Aristóteles","Kant"]},{"id":"etiologia","t":"Etiologia","e":"gr. aitía: \"causa\" + lógos","a":"Estudo das causas de algo. Usado sobretudo na medicina, para a origem das doenças, e na [[filosofia|filosofia]], para a investigação das causas.","see":[],"p":[]},{"id":"eu","t":"Eu","e":"lat. ego","a":"O [[sujeito|sujeito]] consciente de si, que pensa, sente e age. {{Descartes|Descartes}} o funda no \"eu penso\". {{Hume|Hume}} o via como um feixe de percepções. {{Kant|Kant}} fala do \"eu penso\" que acompanha toda [[representacao|representação]]. {{Freud|Freud}} mostra que o eu não é senhor em sua própria casa.","see":[],"p":["Descartes","Hume","Kant","Freud"]},{"id":"evidencia","t":"Evidência","e":"lat. evidentia: \"o que se vê claramente\"","a":"Clareza com que algo se mostra verdadeiro, sem precisar de prova. Para {{Descartes|Descartes}}, o critério da [[verdade|verdade]] é a ideia clara e distinta. Na ciência, evidência é também o conjunto de dados que sustenta uma [[hipotese|hipótese]].","see":[],"p":["Descartes"]},{"id":"existencia","t":"Existência","e":"lat. ex-sistere: \"estar fora\", \"surgir\"","a":"Fato de ser real, de estar no mundo. A [[tradicao|tradição]] distingue existência (que algo é) de essência (o que algo é). Para os [[existencialismo|existencialistas]], a existência humana é aberta, feita de escolhas.","see":[],"p":[]},{"id":"existencialismo","t":"Existencialismo","e":"","a":"Corrente do século XX ({{Sartre|Sartre}}, {{Simone de Beauvoir|Simone de Beauvoir}}, {{Camus|Camus}}, com raízes em {{Kierkegaard|Kierkegaard}} e {{Heidegger|Heidegger}}) que parte da [[existencia|existência]] concreta. Para {{Sartre|Sartre}}, \"a existência precede a essência\": não há natureza humana pronta, e somos o que fazemos de nós mesmos.","see":[],"p":["Sartre","Simone de Beauvoir","Camus","Kierkegaard","Heidegger"]},{"id":"experiencia","t":"Experiência","e":"lat. experientia, de experiri: \"tentar\", \"provar\"","a":"[[conhecimento|Conhecimento]] obtido pelos sentidos e pelo contato com o mundo. Para o [[empirismo|empirismo]], é a fonte de todo conhecimento. Para {{Kant|Kant}}, todo conhecimento começa com a experiência, mas nem todo deriva dela. Também significa o saber acumulado pela vivência.","see":[],"p":["Kant"]},{"id":"extase","t":"Êxtase","e":"gr. ékstasis: \"estar fora de si\"","a":"[[estado|Estado]] em que a pessoa se sente arrebatada para além de si mesma. Em {{Plotino|Plotino}} e nos místicos, é a união com o divino. Em {{Heidegger|Heidegger}}, os êxtases do [[tempo|tempo]] são passado, presente e [[futuro|futuro]].","see":[],"p":["Plotino","Heidegger"]},{"id":"falacia","t":"Falácia","e":"lat. fallacia: \"engano\"","a":"[[argumento|Argumento]] que parece válido, mas não é. Exemplos: o ataque à pessoa (ad hominem), o apelo à maioria e a falsa dicotomia (\"ou você está comigo ou contra mim\"). {{Aristóteles|Aristóteles}} as estudou nas [[refutacao|Refutações]] sofísticas.","see":[],"p":["Aristóteles"]},{"id":"falsificacionismo","t":"Falsificacionismo","e":"","a":"[[teoria|Teoria]] de {{Karl Popper|Karl Popper}}: uma teoria só é científica se puder ser refutada pela [[experiencia|experiência]]. Nenhum número de casos confirma uma teoria definitivamente, mas um único contraexemplo pode derrubá-la. \"Todos os cisnes são brancos\" cai com um cisne negro.","see":[],"p":["Karl Popper"]},{"id":"fantasia","t":"Fantasia","e":"gr. phantasía: \"aparição\", \"imagem\"","a":"Capacidade de criar imagens mentais, inclusive de coisas que não existem. Para {{Aristóteles|Aristóteles}}, é a [[imaginacao|imaginação]] que conserva as imagens dos sentidos. Em {{Freud|Freud}}, a fantasia realiza [[desejo|desejos]] de forma imaginária.","see":[],"p":["Aristóteles","Freud"]},{"id":"fascismo","t":"Fascismo","e":"it. fascio: \"feixe\", símbolo de união e autoridade","a":"Regime autoritário e nacionalista criado por Mussolini na Itália (1922), marcado pelo culto ao líder, partido único, repressão aos opositores, militarismo e subordinação do indivíduo ao [[estado|Estado]]. {{Umberto Eco|Umberto Eco}} descreveu seus traços no \"fascismo eterno\".","see":[],"p":["Umberto Eco"]},{"id":"fato","t":"Fato","e":"lat. factum: \"o que foi feito\"","a":"Aquilo que acontece ou é o caso, independentemente de [[opiniao|opiniões]]. {{Wittgenstein|Wittgenstein}}: \"o mundo é a totalidade dos fatos\". {{Nietzsche|Nietzsche}} provocou: \"não há fatos, apenas interpretações\". Distinguir fato e opinião é essencial contra a desinformação.","see":[],"p":["Wittgenstein","Nietzsche"]},{"id":"fe","t":"Fé","e":"lat. fides: \"confiança\", \"lealdade\"","a":"Adesão a algo que não se pode provar pela [[razao|razão]], especialmente a [[verdade|verdades]] religiosas. {{Agostinho|Agostinho}}: \"creio para compreender\". {{Tomás de Aquino|Tomás de Aquino}} buscou harmonizar fé e razão. {{Kierkegaard|Kierkegaard}} a descreveu como um salto.","see":[],"p":["Agostinho","Tomás de Aquino","Kierkegaard"]},{"id":"felicidade","t":"Felicidade","e":"lat. felicitas; gr. eudaimonía","a":"[[estado|Estado]] de plenitude e realização da [[vida|vida]], fim último das ações humanas. Para {{Aristóteles|Aristóteles}}, é viver bem praticando as [[virtude|virtudes]]. Para {{Epicuro|Epicuro}}, ausência de dor e perturbação. Para os [[estoicismo|estoicos]], aceitar o que não depende de nós.","see":[],"p":["Aristóteles","Epicuro"]},{"id":"fenomeno","t":"Fenômeno","e":"gr. phainómenon: \"o que aparece\"","a":"Aquilo que se mostra à [[consciencia|consciência]]. Para {{Kant|Kant}}, só conhecemos fenômenos, nunca a coisa em si. Para {{Husserl|Husserl}}, a fenomenologia descreve como as coisas aparecem à consciência, \"voltando às coisas mesmas\".","see":[],"p":["Kant","Husserl"]},{"id":"fetichismo","t":"Fetichismo","e":"port. feitiço, do lat. facticius: \"artificial\"","a":"Atribuição de [[poder|poderes]] especiais a [[objeto|objetos]]. Em {{Marx|Marx}}, o fetichismo da mercadoria faz as relações entre pessoas parecerem relações entre coisas, escondendo o [[trabalho|trabalho]] que as produziu.","see":[],"p":["Marx"]},{"id":"feudalismo","t":"Feudalismo","e":"lat. feudum: \"feudo\", terra concedida","a":"[[sistema|Sistema]] da Europa medieval baseado na posse da terra, em laços de vassalagem entre senhores e no [[trabalho|trabalho]] dos servos, presos à terra. Para {{Marx|Marx}}, foi o modo de [[producao|produção]] anterior ao [[capitalismo|capitalismo]].","see":[],"p":["Marx"]},{"id":"filosofia","t":"Filosofia","e":"gr. philía: \"amor\" + sophía: \"sabedoria\"","a":"[[amor|Amor]] à [[sabedoria|sabedoria]]. Atividade de pensar de forma [[critica|crítica]], rigorosa e radical sobre o ser, o [[conhecimento|conhecimento]], o agir, a [[politica|política]] e a [[arte|arte]]. Para {{Aristóteles|Aristóteles}}, começa com o espanto. Para {{Kant|Kant}}, não se aprende filosofia, aprende-se a filosofar.","see":[],"p":["Aristóteles","Kant"]},{"id":"filosofia-analitica","t":"Filosofia analítica","e":"","a":"[[tradicao|Tradição]] do século XX ({{Frege|Frege}}, {{Russell|Russell}}, {{Wittgenstein|Wittgenstein}}, {{Carnap|Carnap}}) que dá centralidade à [[logica|lógica]] e à análise da [[linguagem|linguagem]]. Muitos problemas filosóficos seriam confusões de linguagem que a análise pode esclarecer. Predomina no mundo anglo-saxão.","see":[],"p":["Frege","Russell","Wittgenstein","Carnap"]},{"id":"finalidade","t":"Finalidade","e":"lat. finis: \"fim\", \"limite\"","a":"Aquilo para o qual algo existe ou age. Para {{Aristóteles|Aristóteles}}, tudo tem uma causa final: o olho existe para ver. {{Kant|Kant}} formulou que a pessoa é fim em si mesma. Ver [[teleologia|Teleologia]].","see":["teleologia"],"p":["Aristóteles","Kant"]},{"id":"forca","t":"Força","e":"lat. fortia","a":"Capacidade de produzir efeitos ou mudanças. Na física de {{Newton|Newton}}, causa do [[movimento|movimento]]. Na [[politica|política]], uso da coerção, que para {{Max Weber|Weber}} o [[estado|Estado]] monopoliza legitimamente. Para {{Nietzsche|Nietzsche}}, a [[vida|vida]] é jogo de forças.","see":[],"p":["Newton","Max Weber","Nietzsche"]},{"id":"forma","t":"Forma","e":"lat. forma; gr. morphé, eîdos","a":"Aquilo que faz uma coisa ser o que é. Para {{Aristóteles|Aristóteles}}, todo ser concreto une [[materia|matéria]] e forma: a estátua é bronze (matéria) com a figura de Apolo (forma). {{Platão|Platão}} chamava de Formas as [[ideia|Ideias]] eternas.","see":[],"p":["Aristóteles","Platão"]},{"id":"futuro","t":"Futuro","e":"lat. futurus: \"o que será\"","a":"[[tempo|Tempo]] do que ainda não é. Para {{Agostinho|Agostinho}}, o futuro existe na [[alma|alma]] como expectativa. Para {{Heidegger|Heidegger}}, o ser humano é projeto voltado ao futuro. {{Hans Jonas|Hans Jonas}} pede [[responsabilidade|responsabilidade]] com as gerações futuras.","see":[],"p":["Agostinho","Heidegger","Hans Jonas"]},{"id":"genero","t":"Gênero","e":"lat. genus: \"origem\", \"tipo\"","a":"Na [[logica|lógica]], [[classe|classe]] ampla que inclui várias espécies (animal é gênero do ser humano). Nas ciências sociais e na [[filosofia|filosofia]], construção social dos papéis atribuídos a homens e mulheres. {{Simone de Beauvoir|Simone de Beauvoir}}: \"ninguém nasce mulher, torna-se mulher\". {{Judith Butler|Judith Butler}} aprofundou esse debate.","see":[],"p":["Simone de Beauvoir","Judith Butler"]},{"id":"genialidade","t":"Genialidade","e":"lat. genius: \"espírito protetor\"","a":"Capacidade criadora excepcional. Para {{Kant|Kant}}, o gênio é o talento que dá regras à [[arte|arte]], criando obras originais e exemplares, sem seguir regras prontas. O [[romantismo|Romantismo]] exaltou a figura do gênio.","see":[],"p":["Kant"]},{"id":"gosto","t":"Gosto","e":"lat. gustus","a":"Sentido do paladar e, por extensão, capacidade de julgar o belo. {{Hume|Hume}} buscou um \"padrão do gosto\". {{Kant|Kant}} mostrou que o [[juizo|juízo]] de gosto, embora [[subjetivo|subjetivo]], pretende valer para todos. {{Bourdieu|Bourdieu}} mostrou que o gosto também reflete a [[classe|classe]] social.","see":[],"p":["Hume","Kant","Bourdieu"]},{"id":"gozo","t":"Gozo","e":"lat. gaudium: \"alegria\"","a":"[[prazer|Prazer]] intenso, satisfação plena. Em {{Lacan|Lacan}}, o gozo vai além do prazer e se aproxima do excesso e do sofrimento. No [[direito|direito]], gozo é o uso de um bem ou direito.","see":[],"p":["Lacan"]},{"id":"habito","t":"Hábito","e":"lat. habitus; gr. héxis","a":"Disposição adquirida pela [[repeticao|repetição]]. Para {{Aristóteles|Aristóteles}}, a [[virtude|virtude]] é um hábito: tornamo-nos justos praticando atos justos. Para {{Hume|Hume}}, o hábito nos faz esperar que o [[futuro|futuro]] repita o passado. {{Bourdieu|Bourdieu}} chama de habitus as disposições sociais incorporadas.","see":[],"p":["Aristóteles","Hume","Bourdieu"]},{"id":"hedonismo","t":"Hedonismo","e":"gr. hedoné: \"prazer\"","a":"Doutrina que identifica o bem com o [[prazer|prazer]]. Os cirenaicos valorizavam o prazer imediato; {{Epicuro|Epicuro}}, o prazer estável e moderado. O [[utilitarismo|utilitarismo]] é um hedonismo social.","see":[],"p":["Epicuro"]},{"id":"hegemonia","t":"Hegemonia","e":"gr. hegemonía: \"direção\", \"liderança\"","a":"Predomínio de um grupo sobre outros. Para {{Gramsci|Gramsci}}, a [[classe|classe]] dominante mantém o [[poder|poder]] não só pela força, mas pelo consenso, fazendo seus [[valor|valores]] parecerem naturais por meio da escola, da [[religiao|religião]] e da mídia.","see":[],"p":["Gramsci"]},{"id":"heteronomia","t":"Heteronomia","e":"gr. héteros: \"outro\" + nómos: \"lei\"","a":"Condição de quem é governado por [[lei|leis]] ou [[vontade|vontades]] exteriores. Para {{Kant|Kant}}, a vontade é heterônoma quando age por medo, interesse ou [[autoridade|autoridade]], e não pela [[razao|razão]]. Opõe-se à [[autonomia|autonomia]].","see":[],"p":["Kant"]},{"id":"hipotese","t":"Hipótese","e":"gr. hypóthesis: \"o que se põe embaixo\"","a":"Suposição provisória que precisa ser testada. No método científico, a hipótese é confirmada ou refutada por experimentos e [[observacao|observações]].","see":[],"p":[]},{"id":"historia","t":"História","e":"gr. historía: \"investigação\"","a":"O passado humano e o estudo desse passado. Para {{Hegel|Hegel}}, a história é o [[progresso|progresso]] da [[consciencia|consciência]] da [[liberdade|liberdade]]. Para {{Marx|Marx}}, é a história da luta de [[classe|classes]]. {{Walter Benjamin|Walter Benjamin}} pediu para escová-la \"a contrapelo\", ouvindo os vencidos.","see":[],"p":["Hegel","Marx","Walter Benjamin"]},{"id":"homogeneo","t":"Homogêneo","e":"gr. homós: \"igual\" + génos: \"tipo\"","a":"Que é formado por partes da mesma natureza. Opõe-se a heterogêneo. Na [[critica|crítica]] social, fala-se da homogeneização da [[cultura|cultura]] de massa, que apaga [[diferenca|diferenças]].","see":[],"p":[]},{"id":"ideal","t":"Ideal","e":"lat. idealis","a":"Aquilo que é perfeito, modelo a ser buscado mas talvez nunca alcançado. Também designa o que existe apenas no [[pensamento|pensamento]]. Para {{Kant|Kant}}, os ideais da [[razao|razão]] orientam a ação, mesmo sem serem [[objeto|objetos]] de [[conhecimento|conhecimento]].","see":[],"p":["Kant"]},{"id":"idealismo","t":"Idealismo","e":"","a":"Doutrina que dá primazia ao [[pensamento|pensamento]] ou ao [[espirito|espírito]] sobre a [[materia|matéria]]. {{Berkeley|Berkeley}}: \"ser é ser percebido\". {{Kant|Kant}} fala em idealismo [[transcendental|transcendental]]; {{Hegel|Hegel}}, em idealismo absoluto. Opõe-se ao [[materialismo|materialismo]]. No uso comum, atitude de quem age por ideais.","see":[],"p":["Berkeley","Kant","Hegel"]},{"id":"ideia","t":"Ideia","e":"gr. idéa: \"forma\", \"aspecto\"","a":"Para {{Platão|Platão}}, as Ideias são realidades eternas e perfeitas, das quais as coisas sensíveis são cópias. Na modernidade, {{Descartes|Descartes}} e {{Locke|Locke}} chamam de ideia qualquer conteúdo da mente.","see":[],"p":["Platão","Descartes","Locke"]},{"id":"identidade","t":"Identidade","e":"lat. idem: \"o mesmo\"","a":"Relação de algo consigo mesmo. O [[principio|princípio]] de identidade diz que A é A. Identidade pessoal é o que faz alguém ser o mesmo ao longo do [[tempo|tempo]] ({{Locke|Locke}} a funda na [[memoria|memória]]). Identidade social é o reconhecimento de pertencer a um grupo. Ver [[diferenca|Diferença]].","see":["diferenca"],"p":["Locke"]},{"id":"ideologia","t":"Ideologia","e":"gr. idéa + lógos","a":"Conjunto de ideias que orientam a visão de mundo de um grupo. Para {{Marx|Marx}}, as ideias dominantes são as da [[classe|classe]] dominante e fazem parecer natural o que é histórico e injusto. Hoje também designa [[sistema|sistemas]] de [[crenca|crenças]] [[politica|políticas]].","see":[],"p":["Marx"]},{"id":"ignorancia","t":"Ignorância","e":"lat. ignorantia","a":"Falta de [[conhecimento|conhecimento]]. {{Sócrates|Sócrates}} afirmava \"só sei que nada sei\": reconhecer a própria ignorância é o início da [[sabedoria|sabedoria]]. Para ele, ninguém faz o mal voluntariamente, mas por ignorância do bem.","see":[],"p":["Sócrates"]},{"id":"igualdade","t":"Igualdade","e":"lat. aequalitas","a":"Condição de ser igual. Igualdade formal (todos iguais perante a [[lei|lei]]) difere da igualdade material (condições reais de [[vida|vida]]). Foi lema da Revolução Francesa, junto com [[liberdade|liberdade]] e fraternidade.","see":[],"p":[]},{"id":"iluminismo","t":"Iluminismo","e":"al. Aufklärung: \"esclarecimento\"","a":"[[movimento|Movimento]] do século XVIII ({{Voltaire|Voltaire}}, {{Rousseau|Rousseau}}, {{Diderot|Diderot}}, {{Kant|Kant}}) que defendia a [[razao|razão]], a ciência, a [[liberdade|liberdade]] e a tolerância contra o [[dogmatismo|dogmatismo]] e o absolutismo. Para {{Kant|Kant}}, seu lema é \"ouse saber!\".","see":[],"p":["Voltaire","Rousseau","Diderot","Kant"]},{"id":"imaginacao","t":"Imaginação","e":"lat. imaginatio, de imago: \"imagem\"","a":"Capacidade de formar imagens e de combinar [[representacao|representações]] de modo novo. Para {{Descartes|Descartes}}, pode enganar; para {{Kant|Kant}}, é indispensável ao [[conhecimento|conhecimento]]; para {{Bachelard|Bachelard}}, é força criadora da [[poesia|poesia]] e da ciência.","see":[],"p":["Descartes","Kant","Bachelard"]},{"id":"imanente","t":"Imanente","e":"lat. immanere: \"permanecer em\"","a":"Aquilo que está dentro de algo e não depende de nada exterior. Em {{Espinosa|Espinosa}}, [[deus|Deus]] é causa imanente do mundo, não exterior a ele. Opõe-se a [[transcendente|transcendente]].","see":[],"p":["Espinosa"]},{"id":"imoral","t":"Imoral","e":"lat. in-: \"não\" + moralis","a":"Contrário às normas [[moral|morais]]. Difere de amoral, que é o que está fora do campo da moral, sem [[consciencia|consciência]] de normas.","see":[],"p":[]},{"id":"inatismo","t":"Inatismo","e":"lat. innatus: \"nascido com\"","a":"Doutrina segundo a qual certas ideias ou [[conhecimento|conhecimentos]] já nascem com o ser humano. {{Platão|Platão}} (reminiscência) e {{Descartes|Descartes}} (ideias inatas, como a de [[deus|Deus]]) são inatistas. {{Locke|Locke}} o criticou.","see":[],"p":["Platão","Descartes","Locke"]},{"id":"inconsciente","t":"Inconsciente","e":"lat. in-: \"não\" + conscius","a":"Parte da [[vida|vida]] psíquica que escapa à [[consciencia|consciência]]. Para {{Freud|Freud}}, é formado so
