  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de ligações de ${esc(e.t)}">`;
  const pos=nodes.map((n,k)=>{const a=-Math.PI/2+2*Math.PI*k/Math.max(nodes.length,1);return{...n,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)*.92}});
  pos.forEach(p=>s+=`<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" ${p.k==='in'?'stroke-dasharray="4 3"':''}/>`);
  pos.forEach(p=>{const t=byId[p.i].t, lbl=t.length>14?t.slice(0,13)+'…':t, anc=p.x<cx-10?'end':p.x>cx+10?'start':'middle', dx=anc==='end'?-9:anc==='start'?9:0, dy=anc==='middle'?(p.y<cy?-10:18):4;
    s+=`<g class="n ${p.k==='in'?'in':''}" data-go="${p.i}" data-peek="${p.i}" tabindex="0" role="link" aria-label="${esc(t)}"><circle cx="${p.x}" cy="${p.y}" r="${4+Math.min(byId[p.i].deg,20)/4}"/><text x="${p.x+dx}" y="${p.y+dy}" text-anchor="${anc}">${esc(lbl)}</text></g>`});
  const ct=e.t.length>16?e.t.slice(0,15)+'…':e.t;
  s+=`<g class="n c"><circle cx="${cx}" cy="${cy}" r="${Math.max(26,ct.length*3.4)}"/><text x="${cx}" y="${cy+4}" text-anchor="middle">${esc(ct)}</text></g>`;
  if(!nodes.length) s+=`<text x="${cx}" y="${H-16}" text-anchor="middle" style="fill:var(--muted)">Verbete ainda sem ligações</text>`;
  if(more) s+=`<text x="${W-8}" y="${H-8}" text-anchor="end" style="fill:var(--muted)">+${more} na lista abaixo</text>`;
  return s+'</svg>';
}
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('g[data-go]'))go(ev.target.dataset.go)});

function dayEntry(){const d=new Date();const n=d.getFullYear()*372+d.getMonth()*31+d.getDate();return DATA[(n*7919)%DATA.length]}
function showHome(){
  curId=null; document.title='Wiki Filosófica';
  const top=[...DATA].sort((a,b)=>b.deg-a.deg).slice(0,10), mx=top[0].deg;
  const de=dayEntry();
  const nl=DATA.reduce((s,e)=>s+e.out.length,0);
  view.innerHTML=`<div class="page" style="grid-template-columns:minmax(0,1fr)"><article class="home" style="max-width:none">
    <div class="kicker"><span>${esc(META.fonte)}</span></div>
    <h1>Wiki Filosófica</h1>
    <p class="lede">Os verbetes do dicionário da turma, agora ligados entre si. Cada palavra sublinhada leva a outro conceito; cada nome de pensador reúne todos os verbetes em que ele aparece. Siga as ligações e veja aonde o pensamento te leva.</p>
    <p class="quote">A filosofia começa com o espanto.<cite>Aristóteles</cite></p>
    <div class="stats"><div><b>${DATA.length}</b>verbetes</div><div><b>${nl}</b>ligações</div><div><b>${Object.keys(TH).length}</b>pensadores</div></div>
    <div class="homegrid">
      <div><h2>Verbete do dia</h2><div class="day"><h3>${esc(de.t)}</h3><p>${esc(de.plain.length>220?de.plain.slice(0,220).replace(/\s\S*$/,'')+'…':de.plain)}</p><button class="btn" data-go="${de.id}">Ler verbete</button></div></div>
      <div><h2>Conceitos mais conectados</h2><ol class="rank">${top.map(e=>`<li><button data-go="${e.id}" data-peek="${e.id}">${esc(e.t)}</button><span class="bar"><i style="width:${e.deg/mx*100}%"></i></span><small>${e.deg}</small></li>`).join('')}</ol></div>
      <div><h2>Como usar</h2><p style="margin:0;font-size:.95rem">Busque um conceito no índice ou comece pelo verbete do dia. No verbete, o <b>mapa de ligações</b> mostra o que ele cita e quem o cita. O caminho que você percorre aparece no topo da página, para você refazer o raciocínio depois.</p><div class="actions"><button class="btn" data-go="pensadores">Índice de pensadores</button><button class="btn" id="rnd3">Verbete ao acaso</button></div></div>
    </div>
    <p style="margin-top:3em;font-family:var(--f-ui);font-size:.8rem;color:var(--muted)">Organização: ${esc(META.autor)} · Filosofia</p>
  </article></div>`;
  $('#rnd3').onclick=random;
}
function showThinkers(){
  curId=null; document.title='Pensadores · Wiki Filosófica';
  const names=Object.keys(TH).sort((a,b)=>a.localeCompare(b,'pt'));
  view.innerHTML=`<div class="page" style="grid-template-columns:minmax(0,1fr)"><article style="max-width:none">
    <div class="kicker"><span>Índice</span><span>${names.length} nomes</span></div><h1>Pensadores</h1>
    <p class="lede" style="color:var(--muted);max-width:60ch">Cada nome abre a lista de verbetes em que ele é citado. O número indica quantos verbetes.</p>
    <ul class="thlist">${names.map(n=>`<li><button data-go="p-${thSlug(n)}">${esc(n)}</button><small>${TH[n].length}</small></li>`).join('')}</ul></article></div>`;
}
function showThinker(sl){
  const n=thBySlug[sl]; if(!n) return showThinkers(); curId=null; document.title=n+' · Wiki Filosófica';
  const ids=TH[n];
  view.innerHTML=`<div class="page" style="grid-template-columns:minmax(0,1fr)"><article>
    <div class="kicker"><button class="btn" data-go="pensadores">← Pensadores</button><span>Aparece em ${ids.length} verbete${ids.length>1?'s':''}</span></div>
    <h1 style="font-variant:small-caps;color:var(--thinker)">${esc(n)}</h1>
    <ul class="thentries">${ids.map(i=>{const e=byId[i];const s=sentFor(e,n);return `<li><button data-go="${i}">${esc(e.t)}</button><p>${s}</p></li>`}).join('')}</ul></article></div>`;
}
function sentFor(e,n){
  const parts=e.plain.split(/(?<=[.;])\s+/); const last=n.split(' ').slice(-1)[0];
  const s=parts.find(p=>p.includes(last))||parts[0];
  return esc(s).replace(new RegExp(last.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),`<b style="color:var(--thinker)">${esc(last)}</b>`);
}
function showFavs(){
  curId=null; document.title='Favoritos · Wiki Filosófica';
  const ids=[...favs].filter(i=>byId[i]);
  view.innerHTML=`<div class="page" style="grid-template-columns:minmax(0,1fr)"><article>
    <div class="kicker"><span>Seus verbetes marcados</span></div><h1>Favoritos</h1>
    ${ids.length?chips(ids,'see'):'<p class="empty">Nenhum favorito ainda. Abra um verbete e toque em ☆ Favoritar para guardá-lo aqui. Os favoritos ficam salvos só neste navegador.</p>'}</article></div>`;
}
function renderTrail(){
  const t=trail.filter(i=>byId[i]);
  $('#trail').innerHTML=`<b>Caminho</b>`+(t.length?t.map((i,k)=>`${k?'<span class="arr">→</span>':''}<button data-go="${i}">${esc(byId[i].t)}</button>`).join('')+`<button class="clear" id="clr">limpar</button>`:'<span>os verbetes que você abrir aparecem aqui, em ordem</span>');
  const c=$('#clr'); if(c) c.onclick=()=>{trail=[];store.set('trail',trail);renderTrail()};
}
function random(){let e;do{e=DATA[Math.floor(Math.random()*DATA.length)]}while(e.id===curId);go(e.id)}
$('#rnd').onclick=random;
$('#ths').onclick=()=>{$('#side').classList.remove('open');go('pensadores')};
$('#favs').onclick=()=>{$('#side').classList.remove('open');go('favoritos')};
$('#openidx').onclick=()=>{$('#side').classList.add('open');$('#q').focus()};
$('#closeidx').onclick=()=>$('#side').classList.remove('open');

// prévia ao passar o mouse
const peek=$('#peek'); let pt;
function hidePeek(){clearTimeout(pt);peek.hidden=true}
document.addEventListener('mouseover',ev=>{
  const a=ev.target.closest('[data-peek]'); if(!a||!matchMedia('(hover:hover)').matches) return;
  clearTimeout(pt); pt=setTimeout(()=>{
    const e=byId[a.dataset.peek]; if(!e) return;
    peek.innerHTML=`<strong>${esc(e.t)}</strong>${e.e?`<em>${esc(e.e)}</em>`:''}${esc(e.plain.length>200?e.plain.slice(0,200).replace(/\s\S*$/,'')+'…':e.plain)}`;
    peek.hidden=false; const r=a.getBoundingClientRect(), w=peek.offsetWidth, h=peek.offsetHeight;
    let x=Math.min(Math.max(8,r.left),innerWidth-w-8), y=r.bottom+8; if(y+h>innerHeight-8) y=r.top-h-8;
    peek.style.left=x+'px'; peek.style.top=y+'px';
  },350);
});
document.addEventListener('mouseout',ev=>{if(ev.target.closest('[data-peek]'))hidePeek()});

route();
</script>
