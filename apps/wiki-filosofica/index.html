bretudo por [[desejo|desejos]] reprimidos que se manifestam em sonhos, atos falhos e sintomas. {{Jung|Jung}} acrescentou o inconsciente coletivo.","see":[],"p":["Freud","Jung"]},{"id":"indicio","t":"Indício","e":"lat. indicium: \"sinal\"","a":"Sinal que aponta para algo sem prová-lo totalmente. {{Carlo Ginzburg|Carlo Ginzburg}} falou de um \"[[paradigma|paradigma]] indiciário\", presente no detetive, no médico e no historiador.","see":[],"p":["Carlo Ginzburg"]},{"id":"inducao","t":"Indução","e":"lat. inducere: \"conduzir para dentro\"","a":"Raciocínio que parte de casos particulares e chega a uma conclusão geral, que é apenas provável. {{Hume|Hume}} mostrou o problema da indução: nada garante que o [[futuro|futuro]] será igual ao passado.","see":[],"p":["Hume"]},{"id":"industria-cultural","t":"Indústria cultural","e":"al. Kulturindustrie","a":"[[conceito|Conceito]] de {{Adorno|Adorno}} e {{Horkheimer|Horkheimer}} (1947): [[producao|produção]] de bens culturais em série, como mercadorias, padronizando gostos e transformando o público em consumidor passivo. Hoje se discute o papel dos algoritmos e das plataformas digitais.","see":[],"p":["Adorno","Horkheimer"]},{"id":"informacao","t":"Informação","e":"lat. informare: \"dar forma\"","a":"Dado organizado que comunica algo. Informação não é o mesmo que [[conhecimento|conhecimento]]: este exige [[compreensao|compreensão]], relação e [[critica|crítica]]. {{Byung-Chul Han|Byung-Chul Han}} alerta para o excesso de informação que impede o [[pensamento|pensamento]].","see":[],"p":["Byung-Chul Han"]},{"id":"inteligivel","t":"Inteligível","e":"lat. intelligibilis","a":"Aquilo que só pode ser conhecido pelo intelecto, e não pelos sentidos. {{Platão|Platão}} separa o mundo sensível do mundo inteligível, onde estão as [[ideia|Ideias]].","see":[],"p":["Platão"]},{"id":"intencao","t":"Intenção","e":"lat. intentio: \"tensão em direção a\"","a":"Propósito que orienta uma ação. Para {{Abelardo|Abelardo}} e {{Kant|Kant}}, o [[valor|valor]] [[moral|moral]] de um ato depende da intenção. O [[utilitarismo|utilitarismo]], ao contrário, privilegia as [[consequencia|consequências]].","see":[],"p":["Abelardo","Kant"]},{"id":"intencionalidade","t":"Intencionalidade","e":"","a":"Para {{Brentano|Brentano}} e {{Husserl|Husserl}}, característica essencial da [[consciencia|consciência]]: estar sempre dirigida a algo. Toda consciência é consciência de alguma coisa.","see":[],"p":["Brentano","Husserl"]},{"id":"intuicao","t":"Intuição","e":"lat. intueri: \"olhar atentamente\"","a":"[[conhecimento|Conhecimento]] imediato, sem raciocínio intermediário. Para {{Descartes|Descartes}}, é a visão clara de uma [[verdade|verdade]]. Para {{Kant|Kant}}, é a forma pela qual os [[objeto|objetos]] nos são dados. Para {{Bergson|Bergson}}, é o método que capta a duração viva.","see":[],"p":["Descartes","Kant","Bergson"]},{"id":"isonomia","t":"Isonomia","e":"gr. ísos: \"igual\" + nómos: \"lei\"","a":"[[igualdade|Igualdade]] de todos perante a [[lei|lei]]. Foi um [[principio|princípio]] da [[democracia|democracia]] ateniense e é base do [[estado|Estado]] de [[direito|direito]] moderno.","see":[],"p":[]},{"id":"jogo","t":"Jogo","e":"lat. iocus: \"brincadeira\"","a":"Atividade [[liberdade|livre]], com regras próprias, feita pelo [[prazer|prazer]] de jogar. {{Huizinga|Huizinga}} mostrou que o jogo está na origem da [[cultura|cultura]] (Homo ludens). {{Wittgenstein|Wittgenstein}} comparou a [[linguagem|linguagem]] a \"jogos de linguagem\", cada um com suas regras.","see":[],"p":["Huizinga","Wittgenstein"]},{"id":"juizo","t":"Juízo","e":"lat. iudicium: \"julgamento\"","a":"Ato do [[pensamento|pensamento]] que afirma ou nega algo de algo, como \"a rosa é vermelha\". {{Kant|Kant}} distingue juízos analíticos (o [[predicado|predicado]] está no [[sujeito|sujeito]]) e sintéticos (acrescentam [[informacao|informação]]). Também significa capacidade de avaliar bem.","see":[],"p":["Kant"]},{"id":"justa-medida","t":"Justa medida","e":"gr. mesótes: \"meio-termo\"","a":"Em {{Aristóteles|Aristóteles}}, a [[virtude|virtude]] é o meio-termo entre dois excessos: a [[coragem|coragem]] fica entre a covardia e a temeridade; a generosidade, entre a avareza e o desperdício. Já o oráculo de Delfos ensinava \"nada em excesso\".","see":[],"p":["Aristóteles"]},{"id":"justica","t":"Justiça","e":"lat. iustitia; gr. dikaiosýne","a":"[[virtude|Virtude]] de dar a cada um o que lhe é devido. Para {{Platão|Platão}}, é harmonia entre as partes da [[alma|alma]] e da cidade. {{Aristóteles|Aristóteles}} distingue justiça distributiva e corretiva. Para {{Rawls|Rawls}}, a [[sociedade|sociedade]] justa é a que escolheríamos sob um \"véu de [[ignorancia|ignorância]]\".","see":[],"p":["Platão","Aristóteles","Rawls"]},{"id":"lei","t":"Lei","e":"lat. lex","a":"Regra que ordena ou regula. A lei natural é a ordem da natureza ou da [[razao|razão]]; a lei positiva é criada pelo [[estado|Estado]]; a lei científica descreve regularidades; a lei [[moral|moral]], para {{Kant|Kant}}, é dada pela própria razão.","see":[],"p":["Kant"]},{"id":"liberalismo","t":"Liberalismo","e":"lat. liber: \"livre\"","a":"Corrente [[politica|política]] e econômica que defende as [[liberdade|liberdades]] individuais, a [[propriedade|propriedade]] privada, o [[estado|Estado]] limitado por [[lei|leis]] e o livre [[mercado|mercado]]. {{Locke|Locke}}, {{Montesquieu|Montesquieu}}, {{Adam Smith|Adam Smith}} e {{Stuart Mill|Stuart Mill}} são referências. O neoliberalismo radicaliza a defesa do mercado.","see":[],"p":["Locke","Montesquieu","Adam Smith","Stuart Mill"]},{"id":"liberdade","t":"Liberdade","e":"lat. libertas; gr. eleuthería","a":"Capacidade de agir por si mesmo, sem ser impedido ou dominado. A liberdade negativa é ausência de impedimentos; a positiva, capacidade real de decidir. Para {{Sartre|Sartre}}, \"o homem está condenado a ser livre\". Para {{Marx|Marx}}, a liberdade exige condições materiais.","see":[],"p":["Sartre","Marx"]},{"id":"lideranca","t":"Liderança","e":"ingl. to lead: \"conduzir\"","a":"Capacidade de orientar pessoas para objetivos comuns. {{Platão|Platão}} defendia o rei-filósofo; {{Maquiavel|Maquiavel}}, a virtù do príncipe; {{Max Weber|Weber}} descreveu a [[autoridade|autoridade]] carismática. Liderar difere de apenas mandar.","see":[],"p":["Platão","Maquiavel","Max Weber"]},{"id":"linguagem","t":"Linguagem","e":"lat. lingua","a":"[[sistema|Sistema]] de [[signo|signos]] para comunicar e pensar. Para {{Aristóteles|Aristóteles}}, o ser humano é o animal que tem lógos. {{Saussure|Saussure}} distinguiu língua e fala. {{Wittgenstein|Wittgenstein}}: \"os limites da minha linguagem são os limites do meu mundo\".","see":[],"p":["Aristóteles","Saussure","Wittgenstein"]},{"id":"logica","t":"Lógica","e":"gr. logiké, de lógos","a":"Parte da [[filosofia|filosofia]] que estuda as formas válidas do raciocínio. {{Aristóteles|Aristóteles}} a criou como instrumento (órganon) do [[pensamento|pensamento]]. Seus [[principio|princípios]] clássicos são [[identidade|identidade]], não contradição e terceiro excluído.","see":[],"p":["Aristóteles"]},{"id":"logos","t":"Logos","e":"gr. lógos: \"palavra\", \"razão\", \"discurso\"","a":"Termo central do [[pensamento|pensamento]] grego. Para {{Heráclito|Heráclito}}, é a [[razao|razão]] que ordena o universo. Para os [[estoicismo|estoicos]], a razão divina presente em tudo. O Evangelho de João o identifica com o Verbo. A passagem do [[mito|mito]] ao logos marca o nascimento da [[filosofia|filosofia]].","see":[],"p":["Heráclito"]},{"id":"loucura","t":"Loucura","e":"lat. de origem incerta","a":"[[estado|Estado]] de desvio da [[razao|razão]] ou da norma. {{Erasmo|Erasmo}} escreveu o Elogio da loucura, sátira da [[sociedade|sociedade]]. {{Foucault|Foucault}}, na [[historia|História]] da loucura, mostrou como a sociedade moderna separou e internou os \"loucos\".","see":[],"p":["Erasmo","Foucault"]},{"id":"lucro","t":"Lucro","e":"lat. lucrum: \"ganho\"","a":"[[diferenca|Diferença]] entre o que se recebe e o que se gasta numa atividade econômica. {{Aristóteles|Aristóteles}} criticava a acumulação ilimitada de dinheiro (crematística). {{Adam Smith|Adam Smith}} via no lucro o motor da \"mão invisível\". {{Marx|Marx}} o explica pela [[mais-valia|mais-valia]].","see":[],"p":["Aristóteles","Adam Smith","Marx"]},{"id":"lugar","t":"Lugar","e":"lat. locus","a":"Porção do [[espaco|espaço]] ocupada por um [[corpo|corpo]]. Para {{Aristóteles|Aristóteles}}, cada elemento tem seu lugar natural: a pedra cai porque tende à terra. É uma das [[categoria|categorias]] aristotélicas.","see":[],"p":["Aristóteles"]},{"id":"magia","t":"Magia","e":"gr. mageía, dos magos persas","a":"Conjunto de práticas que buscam agir sobre a natureza por forças ocultas e rituais. Antropólogos como {{Frazer|Frazer}} e {{Marcel Mauss|Mauss}} a estudaram. {{Max Weber|Weber}} chamou de \"desencantamento do mundo\" o recuo da magia diante da ciência.","see":[],"p":["Frazer","Marcel Mauss","Max Weber"]},{"id":"mais-valia","t":"Mais-valia","e":"al. Mehrwert: \"valor a mais\"","a":"[[conceito|Conceito]] de {{Marx|Marx}}: [[diferenca|diferença]] entre o [[valor|valor]] que o trabalhador produz e o salário que recebe. É o [[trabalho|trabalho]] não pago, apropriado pelo [[capitalismo|capitalista]]. A mais-valia absoluta vem do aumento da jornada; a relativa, do aumento da produtividade.","see":[],"p":["Marx"]},{"id":"mal","t":"Mal","e":"lat. malum","a":"Aquilo que é contrário ao bem: o sofrimento, a injustiça, a destruição. Para {{Agostinho|Agostinho}}, o mal não é [[substancia|substância]], mas ausência de bem. {{Leibniz|Leibniz}} enfrentou o problema do mal num mundo criado por [[deus|Deus]]. {{Hannah Arendt|Hannah Arendt}} falou da \"banalidade do mal\".","see":[],"p":["Agostinho","Leibniz","Hannah Arendt"]},{"id":"maniqueismo","t":"Maniqueísmo","e":"de Mani, profeta persa do século III","a":"[[religiao|Religião]] que via o mundo como luta entre dois [[principio|princípios]]: o Bem (luz) e o Mal (trevas). {{Agostinho|Agostinho}} foi maniqueu antes de se converter. Hoje, chama-se maniqueísta a visão que divide tudo entre bons e maus, sem nuances.","see":[],"p":["Agostinho"]},{"id":"materia","t":"Matéria","e":"lat. materia, de mater: \"mãe\"","a":"Aquilo de que as coisas são feitas. Para {{Aristóteles|Aristóteles}}, é pura [[potencia|potência]] que recebe a forma. Para {{Descartes|Descartes}}, é [[substancia|substância]] extensa. Para os [[materialismo|materialistas]], é a única realidade. Ver Forma.","see":["forma"],"p":["Aristóteles","Descartes"]},{"id":"materialismo","t":"Materialismo","e":"","a":"Doutrina segundo a qual tudo o que existe é [[materia|matéria]] ou depende dela, inclusive o [[pensamento|pensamento]]. Os atomistas gregos foram os primeiros materialistas. {{Marx|Marx}} formulou o materialismo histórico: as condições materiais determinam a [[vida|vida]] social. Opõe-se ao [[idealismo|idealismo]].","see":[],"p":["Marx"]},{"id":"mecanicismo","t":"Mecanicismo","e":"","a":"Concepção que explica a natureza como uma máquina, por meio de [[movimento|movimentos]] e causas físicas, sem [[finalidade|finalidades]]. {{Descartes|Descartes}} via os animais como máquinas. {{Newton|Newton}} consolidou essa visão. Opõe-se ao finalismo.","see":[],"p":["Descartes","Newton"]},{"id":"memoria","t":"Memória","e":"lat. memoria","a":"Capacidade de conservar e lembrar o passado. Para {{Platão|Platão}}, conhecer é recordar (reminiscência). {{Agostinho|Agostinho}} chamou a memória de \"palácio imenso\". Para {{Bergson|Bergson}}, a memória é o passado que dura no presente. Há também a memória coletiva de um povo.","see":[],"p":["Platão","Agostinho","Bergson"]},{"id":"mercado","t":"Mercado","e":"lat. mercatus, de merx: \"mercadoria\"","a":"[[espaco|Espaço]] onde se trocam bens e serviços e se formam preços pela oferta e procura. O [[liberalismo|liberalismo]] o vê como forma eficiente de organizar a economia. {{Polanyi|Polanyi}} e {{Michael Sandel|Sandel}} alertam para os riscos de tudo virar mercadoria.","see":[],"p":["Polanyi","Michael Sandel"]},{"id":"merito","t":"Mérito","e":"lat. meritum: \"merecimento\"","a":"[[valor|Valor]] atribuído a alguém por suas ações ou [[qualidade|qualidades]]. {{Aristóteles|Aristóteles}} fala em [[justica|justiça]] distributiva segundo o mérito. A meritocracia premia o esforço, mas {{Michael Sandel|Michael Sandel}} critica seu uso quando os pontos de partida são muito desiguais.","see":[],"p":["Aristóteles","Michael Sandel"]},{"id":"metafisica","t":"Metafísica","e":"gr. metà tà physiká: \"depois da física\"","a":"Parte da [[filosofia|filosofia]] que estuda o ser enquanto ser, as causas primeiras e as realidades além da [[experiencia|experiência]], como [[deus|Deus]], [[alma|alma]] e [[liberdade|liberdade]]. O nome vem da organização das obras de {{Aristóteles|Aristóteles}}. {{Kant|Kant}} criticou suas pretensões; {{Heidegger|Heidegger}} buscou superá-la.","see":[],"p":["Aristóteles","Kant","Heidegger"]},{"id":"metafora","t":"Metáfora","e":"gr. metaphorá: \"transporte\"","a":"Figura de [[linguagem|linguagem]] que transfere o sentido de uma palavra para outra por semelhança, como \"a [[vida|vida]] é uma viagem\". {{Nietzsche|Nietzsche}} disse que a [[verdade|verdade]] é um \"exército móvel de metáforas\". {{Ricoeur|Ricoeur}} estudou seu [[poder|poder]] criador.","see":[],"p":["Nietzsche","Ricoeur"]},{"id":"mito","t":"Mito","e":"gr. mýthos: \"narrativa\"","a":"Narrativa sagrada que explica a origem do mundo, dos deuses e dos [[costume|costumes]]. A [[filosofia|filosofia]] nasce na passagem do mito ao [[logos|logos]], buscando explicações racionais. {{Platão|Platão}}, porém, usou mitos para ensinar, como o da caverna. {{Lévi-Strauss|Lévi-Strauss}} mostrou a [[logica|lógica]] dos mitos.","see":[],"p":["Platão","Lévi-Strauss"]},{"id":"modernismo","t":"Modernismo","e":"lat. modernus: \"recente\"","a":"Conjunto de [[movimento|movimentos]] artísticos do início do século XX que romperam com a [[tradicao|tradição]], como o cubismo e, no Brasil, a Semana de [[arte|Arte]] Moderna de 1922. Em [[filosofia|filosofia]], liga-se à modernidade: a época iniciada com {{Descartes|Descartes}}, a ciência e o [[iluminismo|Iluminismo]], centrada no [[sujeito|sujeito]] e na [[razao|razão]].","see":[],"p":["Descartes"]},{"id":"monada","t":"Mônada","e":"gr. monás: \"unidade\"","a":"Em {{Leibniz|Leibniz}}, [[substancia|substância]] simples, indivisível e espiritual, que compõe toda a realidade. Cada mônada reflete o universo a seu modo e \"não tem janelas\", isto é, não sofre influência externa. [[deus|Deus]] garante sua harmonia preestabelecida.","see":[],"p":["Leibniz"]},{"id":"moral","t":"Moral","e":"lat. mos, moris: \"costume\"","a":"Conjunto de normas e [[valor|valores]] que orientam o comportamento de um grupo. Para {{Kant|Kant}}, a moral verdadeira vem da [[razao|razão]] e vale para todos. {{Nietzsche|Nietzsche}} investigou a genealogia dos valores morais. Ver [[etica|Ética]].","see":["etica"],"p":["Kant","Nietzsche"]},{"id":"morte","t":"Morte","e":"lat. mors","a":"Fim da [[vida|vida]]. Para {{Platão|Platão}}, filosofar é aprender a morrer. {{Epicuro|Epicuro}}: \"quando a morte está, nós não estamos\". {{Montaigne|Montaigne}} retomou essa ideia. Para {{Heidegger|Heidegger}}, o ser humano é \"ser-para-a-morte\", e a [[consciencia|consciência]] da finitude dá sentido à [[existencia|existência]].","see":[],"p":["Platão","Epicuro","Montaigne","Heidegger"]},{"id":"motivacao","t":"Motivação","e":"lat. motivus: \"que move\"","a":"Conjunto de [[razao|razões]], [[desejo|desejos]] e forças que levam alguém a agir. Distingue-se a motivação interna (o [[prazer|prazer]] da atividade) da externa (recompensas e punições).","see":[],"p":[]},{"id":"movimento","t":"Movimento","e":"lat. movimentum","a":"Mudança de lugar ou de estado. {{Parmênides|Parmênides}} e {{Zenão de Eleia|Zenão}} negaram o movimento; {{Heráclito|Heráclito}} o afirmou como essência do real. Para {{Aristóteles|Aristóteles}}, é a passagem da [[potencia|potência]] ao ato, e tudo depende de um primeiro motor imóvel.","see":[],"p":["Parmênides","Zenão de Eleia","Heráclito","Aristóteles"]},{"id":"musica","t":"Música","e":"gr. mousiké: \"arte das Musas\"","a":"[[arte|Arte]] dos sons organizados no [[tempo|tempo]]. {{Pitágoras|Pitágoras}} ligou a música aos números e à harmonia do cosmos. {{Platão|Platão}} a via como formadora da [[alma|alma]]. Para {{Schopenhauer|Schopenhauer}}, é a arte mais alta, expressão direta da [[vontade|vontade]]. Para {{Nietzsche|Nietzsche}}, sem música a [[vida|vida]] seria um erro.","see":[],"p":["Pitágoras","Platão","Schopenhauer","Nietzsche"]},{"id":"nacionalismo","t":"Nacionalismo","e":"lat. natio: \"nação\", \"nascimento\"","a":"[[ideologia|Ideologia]] que valoriza a nação como comunidade de língua, [[historia|história]] e [[cultura|cultura]], defendendo sua [[unidade|unidade]] e soberania. Teve papel nas lutas por independência, mas também alimentou guerras, xenofobia e regimes autoritários.","see":[],"p":[]},{"id":"nada","t":"Nada","e":"lat. res nata: \"coisa nascida\", usado em negações","a":"Ausência de ser. {{Parmênides|Parmênides}} afirmava que o nada não pode ser pensado. Para {{Heidegger|Heidegger}}, a [[angustia|angústia]] nos põe diante do nada. {{Sartre|Sartre}}, em O ser e o nada, mostra que a [[consciencia|consciência]] introduz o nada no mundo pela [[liberdade|liberdade]].","see":[],"p":["Parmênides","Heidegger","Sartre"]},{"id":"nausea","t":"Náusea","e":"gr. nausía: \"enjoo do mar\"","a":"Título do romance de {{Sartre|Sartre}} (1938): [[sentimento|sentimento]] de mal-estar diante da [[existencia|existência]] bruta e sem justificativa das coisas, quando percebemos que tudo é contingente e \"está aí demais\".","see":[],"p":["Sartre"]},{"id":"nazismo","t":"Nazismo","e":"de Nationalsozialismus","a":"Regime [[totalitarismo|totalitário]] de Hitler na Alemanha (1933-1945), baseado no [[racismo|racismo]], no antissemitismo, no culto ao líder e no expansionismo. Promoveu o Holocausto, extermínio de milhões de judeus e outros grupos. {{Hannah Arendt|Arendt}} e {{Adorno|Adorno}} refletiram sobre essa [[barbarie|barbárie]].","see":[],"p":["Hannah Arendt","Adorno"]},{"id":"necessario","t":"Necessário","e":"lat. necessarius: \"inevitável\"","a":"Aquilo que não pode ser de outro modo, oposto ao contingente. Na [[logica|lógica]], uma condição necessária é aquela sem a qual algo não acontece: oxigênio é necessário ao fogo, mas não basta. Ver Suficiente.","see":["suficiente"],"p":[]},{"id":"negativismo","t":"Negativismo","e":"","a":"Tendência a negar, recusar ou ver tudo pelo lado negativo. Próximo do pessimismo, que para {{Schopenhauer|Schopenhauer}} é a visão de que a [[vida|vida]] é essencialmente sofrimento. Opõe-se ao [[otimismo|otimismo]].","see":[],"p":["Schopenhauer"]},{"id":"neoplatonismo","t":"Neoplatonismo","e":"","a":"[[filosofia|Filosofia]] de {{Plotino|Plotino}} (século III) e seus seguidores, que reinterpretou {{Platão|Platão}}: tudo emana do Uno, passando pelo Intelecto e pela [[alma|Alma]] até a [[materia|matéria]]. A alma deve retornar ao Uno pela contemplação. Influenciou {{Agostinho|Agostinho}} e o [[pensamento|pensamento]] cristão.","see":[],"p":["Plotino","Platão","Agostinho"]},{"id":"niilismo","t":"Niilismo","e":"lat. nihil: \"nada\"","a":"Negação de todos os [[valor|valores]], [[verdade|verdades]] e sentidos. Para {{Nietzsche|Nietzsche}}, é [[consequencia|consequência]] da \"[[morte|morte]] de [[deus|Deus]]\": os valores supremos perdem força. O niilismo passivo se entrega ao vazio; o ativo destrói valores antigos para criar novos.","see":[],"p":["Nietzsche"]},{"id":"normal","t":"Normal","e":"lat. norma: \"esquadro\", \"regra\"","a":"Aquilo que está de acordo com a regra ou com a média. {{Canguilhem|Canguilhem}} e {{Foucault|Foucault}} mostraram que a distinção entre normal e anormal é também histórica e social, servindo para controlar comportamentos.","see":[],"p":["Canguilhem","Foucault"]},{"id":"normativo","t":"Normativo","e":"","a":"Aquilo que estabelece normas, dizendo como algo deve ser, e não apenas como é. A [[etica|ética]] e o [[direito|direito]] são normativos; a [[sociologia|sociologia]] descritiva, não. Ver [[dever-ser|Dever-ser]].","see":["dever-ser"],"p":[]},{"id":"obediencia","t":"Obediência","e":"lat. oboedire: \"ouvir\"","a":"Ato de cumprir ordens ou regras. {{Hobbes|Hobbes}} defendeu a obediência ao soberano em troca de segurança. {{La Boétie|La Boétie}} escreveu sobre a \"servidão voluntária\". {{Thoreau|Thoreau}} defendeu a desobediência civil contra [[lei|leis]] injustas.","see":[],"p":["Hobbes","La Boétie","Thoreau"]},{"id":"objeto","t":"Objeto","e":"lat. obiectum: \"o que está posto diante\"","a":"Aquilo que é conhecido, percebido ou pensado por um [[sujeito|sujeito]]. A relação sujeito-objeto é central na [[teoria|teoria]] do [[conhecimento|conhecimento]] moderna. Coisificar alguém é reduzi-lo a objeto.","see":[],"p":[]},{"id":"observacao","t":"Observação","e":"lat. observare","a":"Atenção metódica aos [[fenomeno|fenômenos]] para conhecê-los. É o ponto de partida do método científico, segundo {{Bacon|Bacon}}. {{Karl Popper|Popper}}, porém, mostrou que toda observação já é guiada por [[teoria|teorias]].","see":[],"p":["Bacon","Karl Popper"]},{"id":"ocio","t":"Ócio","e":"lat. otium; gr. scholé, origem de \"escola\"","a":"[[tempo|Tempo]] [[liberdade|livre]] das obrigações de sobrevivência, dedicado ao descanso, à reflexão e à criação. Para gregos e romanos, era condição da [[filosofia|filosofia]]. \"Negócio\" vem de nec-otium, negação do ócio. {{Lafargue|Lafargue}} defendeu o \"[[direito|direito]] à preguiça\".","see":[],"p":["Lafargue"]},{"id":"oligarquia","t":"Oligarquia","e":"gr. olígoi: \"poucos\" + arché: \"governo\"","a":"Governo de poucos, geralmente os ricos, em benefício próprio. Para {{Aristóteles|Aristóteles}}, é a forma corrompida da [[aristocracia|aristocracia]]. A República Velha brasileira é chamada de república oligárquica.","see":[],"p":["Aristóteles"]},{"id":"onipotencia","t":"Onipotência","e":"lat. omnis: \"tudo\" + potentia: \"poder\"","a":"[[poder|Poder]] absoluto, sem limites, atribuído a [[deus|Deus]] nas [[religiao|religiões]] monoteístas. Levanta [[paradoxo|paradoxos]], como: Deus poderia criar uma pedra que ele mesmo não consegue levantar?","see":[],"p":[]},{"id":"ontologia","t":"Ontologia","e":"gr. ón, óntos: \"o ser\" + lógos","a":"Parte da [[filosofia|filosofia]] que estuda o ser enquanto ser: o que significa existir, quais tipos de coisas existem. Muitas vezes é tomada como sinônimo de [[metafisica|metafísica]]. {{Heidegger|Heidegger}} propôs uma ontologia fundamental.","see":[],"p":["Heidegger"]},{"id":"opiniao","t":"Opinião","e":"lat. opinio; gr. dóxa","a":"[[crenca|Crença]] sem fundamento seguro. Para {{Platão|Platão}}, a dóxa se baseia nas [[aparencia|aparências]] e difere da epistéme ([[conhecimento|conhecimento]] verdadeiro). A opinião pública é central nas [[democracia|democracias]] e pode ser manipulada.","see":[],"p":["Platão"]},{"id":"ordem","t":"Ordem","e":"lat. ordo","a":"Disposição organizada das coisas segundo uma regra. Os gregos chamavam o universo de kósmos, ordem. Na [[politica|política]], opõe-se ao caos e à anarquia. O lema \"Ordem e [[progresso|Progresso]]\" vem do [[positivismo|positivismo]] de {{Comte|Comte}}.","see":[],"p":["Comte"]},{"id":"origem","t":"Origem","e":"lat. origo: \"nascimento\"","a":"Ponto de partida de algo. Os primeiros filósofos buscavam a arché, o [[principio|princípio]] originário de tudo: a água ({{Tales|Tales}}), o ápeiron ({{Anaximandro|Anaximandro}}), o ar ({{Anaxímenes|Anaxímenes}}). {{Nietzsche|Nietzsche}} e {{Foucault|Foucault}} fizeram \"genealogias\" para mostrar origens históricas.","see":[],"p":["Tales","Anaximandro","Anaxímenes","Nietzsche","Foucault"]},{"id":"otimismo","t":"Otimismo","e":"lat. optimus: \"o melhor\"","a":"Disposição a ver o lado bom das coisas. {{Leibniz|Leibniz}} afirmou que vivemos \"no melhor dos mundos possíveis\". {{Voltaire|Voltaire}} ironizou essa ideia em Cândido. Opõe-se ao pessimismo.","see":[],"p":["Leibniz","Voltaire"]},{"id":"outro","t":"Outro","e":"lat. alter","a":"A pessoa ou realidade diferente de mim. Para {{Sartre|Sartre}}, \"o inferno são os outros\", pois o olhar alheio nos limita. Para {{Levinas|Levinas}}, o outro funda a [[etica|ética]]. Para {{Hegel|Hegel}}, a [[consciencia|consciência]] de si depende do reconhecimento do outro. Ver [[alteridade|Alteridade]].","see":["alteridade"],"p":["Sartre","Levinas","Hegel"]},{"id":"paixao","t":"Paixão","e":"lat. passio, de pati: \"sofrer\"","a":"Afeto intenso que domina a pessoa. Para os [[estoicismo|estoicos]], é uma perturbação a ser controlada pela [[razao|razão]]. {{Descartes|Descartes}} escreveu As paixões da [[alma|alma]]. {{Hegel|Hegel}}: \"nada de grande se fez no mundo sem paixão\".","see":[],"p":["Descartes","Hegel"]},{"id":"para-si","t":"Para si","e":"al. für sich","a":"Em {{Hegel|Hegel}} e {{Sartre|Sartre}}, modo de ser da [[consciencia|consciência]], que se sabe e se projeta, sempre aberta e incompleta. Opõe-se ao \"em si\", modo de ser das coisas, fechadas e completas.","see":[],"p":["Hegel","Sartre"]},{"id":"paradigma","t":"Paradigma","e":"gr. parádeigma: \"modelo\", \"exemplo\"","a":"Modelo ou padrão. Para {{Thomas Kuhn|Thomas Kuhn}}, é o conjunto de [[teoria|teorias]], métodos e [[valor|valores]] aceitos por uma comunidade científica. As revoluções científicas são mudanças de paradigma, como a passagem de Ptolomeu para Copérnico.","see":[],"p":["Thomas Kuhn"]},{"id":"paradoxo","t":"Paradoxo","e":"gr. pará: \"contra\" + dóxa: \"opinião\"","a":"Afirmação que parece contraditória ou contrária ao [[senso-comum|senso comum]], mas pode conter uma [[verdade|verdade]]. Os paradoxos de {{Zenão de Eleia|Zenão}} (Aquiles e a tartaruga) e o do mentiroso (\"esta frase é falsa\") desafiam a [[razao|razão]].","see":[],"p":["Zenão de Eleia"]},{"id":"paralelismo","t":"Paralelismo","e":"gr. parállelos: \"ao lado um do outro\"","a":"Doutrina segundo a qual mente e [[corpo|corpo]] seguem séries paralelas, correspondentes, sem agir um sobre o outro. Em {{Espinosa|Espinosa}}, [[pensamento|pensamento]] e extensão são dois atributos da mesma [[substancia|substância]]. {{Leibniz|Leibniz}} fala em harmonia preestabelecida.","see":[],"p":["Espinosa","Leibniz"]},{"id":"particular","t":"Particular","e":"lat. particularis: \"da parte\"","a":"Aquilo que se refere a um indivíduo ou parte, oposto ao [[universal|universal]]. \"{{Sócrates|Sócrates}}\" é particular; \"ser humano\" é universal. Na [[logica|lógica]], [[proposicao|proposição]] particular é a que vale para alguns (\"alguns homens são [[sabio|sábios]]\").","see":[],"p":["Sócrates"]},{"id":"patriotismo","t":"Patriotismo","e":"gr. patrís: \"pátria\"","a":"[[amor|Amor]] e dedicação à pátria. Diferente do [[nacionalismo|nacionalismo]] exacerbado, pode ser compatível com o respeito a outros povos. {{Samuel Johnson|Samuel Johnson}} ironizou o patriotismo como \"último refúgio dos canalhas\" quando usado para encobrir interesses.","see":[],"p":["Samuel Johnson"]},{"id":"patristica","t":"Patrística","e":"lat. patres: \"pais\" (da Igreja)","a":"[[filosofia|Filosofia]] dos primeiros pensadores cristãos (séculos II a VIII), que buscaram conciliar a [[fe|fé]] com a filosofia grega. {{Agostinho|Agostinho}} de Hipona é seu maior nome. Precede a escolástica.","see":[],"p":["Agostinho"]},{"id":"pecado","t":"Pecado","e":"lat. peccatum: \"falta\"","a":"Na [[tradicao|tradição]] religiosa, transgressão da [[lei|lei]] divina. {{Agostinho|Agostinho}} desenvolveu a doutrina do pecado original. A [[filosofia|filosofia]] discute sua relação com a [[liberdade|liberdade]] e a culpa.","see":[],"p":["Agostinho"]},{"id":"pena","t":"Pena","e":"lat. poena: \"castigo\"","a":"Punição imposta pela [[lei|lei]] a quem comete um crime. {{Beccaria|Beccaria}}, no [[iluminismo|Iluminismo]], defendeu penas proporcionais e combateu a tortura. {{Foucault|Foucault}}, em Vigiar e punir, analisou a passagem do suplício à prisão.","see":[],"p":["Beccaria","Foucault"]},{"id":"pensamento","t":"Pensamento","e":"lat. pensare: \"pesar\", \"avaliar\"","a":"Atividade da mente de conceber, julgar e raciocinar. Para {{Descartes|Descartes}}, é a essência da [[alma|alma]]: \"sou uma coisa que pensa\". {{Hannah Arendt|Hannah Arendt}} distingue o pensar do conhecer: pensar é dialogar consigo mesmo sobre o sentido das coisas.","see":[],"p":["Descartes","Hannah Arendt"]},{"id":"perfeccionismo","t":"Perfeccionismo","e":"","a":"Na [[etica|ética]], doutrina que coloca como fim o desenvolvimento máximo das capacidades humanas. Na [[psicologia|psicologia]], exigência excessiva de perfeição, que pode gerar sofrimento e paralisia.","see":[],"p":[]},{"id":"perfeito","t":"Perfeito","e":"lat. perficere: \"acabar completamente\"","a":"Aquilo que é completo, sem falta nem defeito. {{Descartes|Descartes}} usou a ideia de um ser perfeito para provar a [[existencia|existência]] de [[deus|Deus]]. {{Aristóteles|Aristóteles}} chamava perfeito o que atingiu seu fim.","see":[],"p":["Descartes","Aristóteles"]},{"id":"performativo","t":"Performativo","e":"ingl. to perform: \"realizar\"","a":"Na [[filosofia|filosofia]] da [[linguagem|linguagem]] de {{Austin|Austin}}, enunciado que realiza uma ação ao ser dito, como \"eu prometo\" ou \"declaro aberta a sessão\". {{Judith Butler|Judith Butler}} aplicou a ideia ao gênero.","see":[],"p":["Austin","Judith Butler"]},{"id":"permanencia","t":"Permanência","e":"lat. permanere: \"durar\"","a":"Aquilo que continua o mesmo através da mudança. {{Parmênides|Parmênides}} afirmou a permanência do ser contra o [[devir|devir]] de {{Heráclito|Heráclito}}. Para {{Kant|Kant}}, a [[substancia|substância]] é o que permanece nas mudanças.","see":[],"p":["Parmênides","Heráclito","Kant"]},{"id":"personalidade","t":"Personalidade","e":"lat. persona: \"máscara de teatro\"","a":"Conjunto de características que tornam alguém único e consistente ao longo do [[tempo|tempo]]. Em {{Kant|Kant}}, é a capacidade [[moral|moral]] que faz do ser humano uma pessoa, digna de respeito.","see":[],"p":["Kant"]},{"id":"platonismo","t":"Platonismo","e":"","a":"[[filosofia|Filosofia]] de {{Platão|Platão}} e de seus seguidores, marcada pela [[teoria|teoria]] das [[ideia|Ideias]], pela distinção entre mundo sensível e [[inteligivel|inteligível]] e pela imortalidade da [[alma|alma]]. {{Whitehead|Whitehead}} disse que a filosofia ocidental é uma série de notas de rodapé a {{Platão|Platão}}.","see":[],"p":["Platão","Whitehead"]},{"id":"poder","t":"Poder","e":"lat. potere: \"ser capaz\"","a":"Capacidade de produzir efeitos e influenciar ações alheias. {{Hobbes|Hobbes}} defendeu o poder soberano; {{Max Weber|Weber}} o definiu como chance de impor a [[vontade|vontade]]; {{Foucault|Foucault}} mostrou que o poder circula em todas as relações, pela disciplina e pela vigilância.","see":[],"p":["Hobbes","Max Weber","Foucault"]},{"id":"poesia","t":"Poesia","e":"gr. poíesis: \"criação\", \"produção\"","a":"[[arte|Arte]] da palavra que cria sentidos pelo ritmo, pela imagem e pela sonoridade. {{Platão|Platão}} expulsou os poetas da cidade ideal. {{Aristóteles|Aristóteles}}, na Poética, valorizou a poesia como mais filosófica que a [[historia|história]]. {{Heidegger|Heidegger}}: \"poeticamente habita o homem\".","see":[],"p":["Platão","Aristóteles","Heidegger"]},{"id":"politica","t":"Política","e":"gr. pólis: \"cidade\"","a":"Atividade de organizar a [[vida|vida]] em comum e decidir coletivamente. Para {{Aristóteles|Aristóteles}}, o ser humano é animal político. {{Maquiavel|Maquiavel}} mostrou sua [[logica|lógica]] própria. Para {{Hannah Arendt|Hannah Arendt}}, é o [[espaco|espaço]] da ação e da palavra entre pessoas [[liberdade|livres]] e iguais.","see":[],"p":["Aristóteles","Maquiavel","Hannah Arendt"]},{"id":"positivismo","t":"Positivismo","e":"lat. positivus: \"o que é dado\"","a":"Corrente de {{Comte|Auguste Comte}} (século XIX) que valoriza apenas o [[conhecimento|conhecimento]] científico baseado em fatos observáveis. {{Comte|Comte}} propôs a [[lei|lei]] dos três estados: teológico, [[metafisica|metafísico]] e positivo. Inspirou o lema da bandeira brasileira.","see":[],"p":["Comte"]},{"id":"postulado","t":"Postulado","e":"lat. postulare: \"pedir\"","a":"[[proposicao|Proposição]] aceita sem [[demonstracao|demonstração]] como ponto de partida. {{Euclides|Euclides}} formulou postulados da geometria. Para {{Kant|Kant}}, [[liberdade|liberdade]], imortalidade da [[alma|alma]] e [[deus|Deus]] são postulados da [[razao|razão]] prática.","see":[],"p":["Euclides","Kant"]},{"id":"potencia","t":"Potência","e":"lat. potentia; gr. dýnamis","a":"Em {{Aristóteles|Aristóteles}}, possibilidade de algo vir a ser. A semente é árvore em potência. Para {{Espinosa|Espinosa}}, a potência é a força de cada ser para perseverar em sua [[existencia|existência]]. Ver Ato.","see":["ato"],"p":["Aristóteles","Espinosa"]},{"id":"pragmatismo","t":"Pragmatismo","e":"gr. prâgma: \"ação\", \"coisa feita\"","a":"Corrente americana ({{Peirce|Peirce}}, {{William James|William James}}, {{Dewey|Dewey}}) segundo a qual o sentido e a [[verdade|verdade]] de uma ideia estão em suas [[consequencia|consequências]] práticas. Uma ideia verdadeira é aquela que funciona na [[experiencia|experiência]].","see":[],"p":["Peirce","William James","Dewey"]},{"id":"pratico","t":"Prático","e":"gr. praktikós: \"que age\"","a":"Relativo à ação. Para {{Aristóteles|Aristóteles}}, a [[razao|razão]] prática orienta a ação [[etica|ética]] e [[politica|política]], distinta da razão teórica. {{Kant|Kant}} chama de razão prática a razão que determina a [[vontade|vontade]] [[moral|moral]].","see":[],"p":["Aristóteles","Kant"]},{"id":"prazer","t":"Prazer","e":"lat. placere: \"agradar\"; gr. hedoné","a":"[[sensacao|Sensação]] ou [[sentimento|sentimento]] agradável. Para o [[hedonismo|hedonismo]], é o bem supremo. {{Epicuro|Epicuro}} distingue prazeres em [[movimento|movimento]] e estáveis. {{Stuart Mill|Stuart Mill}} distingue prazeres superiores e inferiores. {{Freud|Freud}} fala no [[principio|princípio]] do prazer.","see":[],"p":["Epicuro","Stuart Mill","Freud"]},{"id":"predicado","t":"Predicado","e":"lat. praedicatum: \"o que é dito\"","a":"Na [[logica|lógica]], aquilo que se afirma ou nega do [[sujeito|sujeito]]. Em \"{{Sócrates|Sócrates}} é mortal\", \"mortal\" é o predicado. {{Kant|Kant}} afirmou que a [[existencia|existência]] não é um predicado real.","see":[],"p":["Sócrates","Kant"]},{"id":"presenca","t":"Presença","e":"lat. praesentia: \"estar diante\"","a":"Fato de estar aqui e agora. A [[metafisica|metafísica]] ocidental, segundo {{Heidegger|Heidegger}} e {{Derrida|Derrida}}, privilegiou o ser como presença. Na [[arte|arte]] e na [[educacao|educação]], fala-se da presença como estar inteiro na relação.","see":[],"p":["Heidegger","Derrida"]},{"id":"pressuposicao","t":"Pressuposição","e":"lat. praesupponere","a":"Aquilo que se admite antes, implicitamente, para que algo faça sentido. \"Parei de fumar\" pressupõe que se fumava antes. A [[filosofia|filosofia]] busca revelar os pressupostos ocultos do [[pensamento|pensamento]].","see":[],"p":[]},{"id":"principio","t":"Princípio","e":"lat. principium: \"começo\"; gr. arché","a":"Ponto de partida, fundamento de algo. Os pré-socráticos buscavam o princípio de todas as coisas. Na [[logica|lógica]], há princípios como o de [[identidade|identidade]] e o de não contradição. Na [[etica|ética]], princípios orientam a conduta.","see":[],"p":[]},{"id":"producao","t":"Produção","e":"lat. producere: \"levar adiante\"","a":"Ato de criar algo, especialmente bens materiais. Para {{Marx|Marx}}, o modo de produção (forças produtivas e relações de produção) é a base da [[sociedade|sociedade]]. {{Aristóteles|Aristóteles}} distingue produção (poíesis) e ação (práxis).","see":[],"p":["Marx","Aristóteles"]},{"id":"profano","t":"Profano","e":"lat. pro: \"diante\" + fanum: \"templo\"","a":"Aquilo que está fora do [[sagrado|sagrado]], pertencente à [[vida|vida]] comum. Para {{Durkheim|Durkheim}} e {{Mircea Eliade|Eliade}}, a distinção entre sagrado e profano é base da [[experiencia|experiência]] religiosa. Ver Sagrado.","see":["sagrado"],"p":["Durkheim","Mircea Eliade"]},{"id":"progresso","t":"Progresso","e":"lat. progressus: \"avanço\"","a":"[[ideia|Ideia]] de que a humanidade avança continuamente rumo ao melhor. Foi central no [[iluminismo|Iluminismo]] e no [[positivismo|positivismo]]. {{Walter Benjamin|Walter Benjamin}} e a Escola de Frankfurt criticaram o progresso técnico que convive com a [[barbarie|barbárie]].","see":[],"p":["Walter Benjamin"]},{"id":"proposicao","t":"Proposição","e":"lat. propositio","a":"Enunciado que pode ser verdadeiro ou falso, como \"a Terra gira em torno do Sol\". É a [[unidade|unidade]] básica da [[logica|lógica]]. Perguntas e ordens não são proposições.","see":[],"p":[]},{"id":"propriedade","t":"Propriedade","e":"lat. proprietas, de proprius: \"próprio\"","a":"[[direito|Direito]] de usar e dispor de um bem. Para {{Locke|Locke}}, nasce do [[trabalho|trabalho]]. Para {{Rousseau|Rousseau}}, a propriedade privada é origem da [[desigualdade|desigualdade]]. Para {{Marx|Marx}}, o problema é a propriedade privada dos meios de [[producao|produção]]. A Constituição exige sua função social.","see":[],"p":["Locke","Rousseau","Marx"]},{"id":"prova","t":"Prova","e":"lat. probare: \"demonstrar\"","a":"Aquilo que estabelece a [[verdade|verdade]] de algo, por [[demonstracao|demonstração]] [[logica|lógica]], experimento ou evidência. {{Tomás de Aquino|Tomás de Aquino}} formulou provas da [[existencia|existência]] de [[deus|Deus]]. No [[direito|direito]], prova é o que sustenta uma acusação.","see":[],"p":["Tomás de Aquino"]},{"id":"psicanalise","t":"Psicanálise","e":"gr. psyché: \"alma\" + análysis: \"decomposição\"","a":"[[teoria|Teoria]] e método criados por {{Freud|Freud}} para investigar o [[inconsciente|inconsciente]] e tratar sofrimentos psíquicos pela fala. [[conceito|Conceitos]] centrais: inconsciente, recalque, pulsão, id, [[ego|ego]] e superego. {{Lacan|Lacan}} a renovou com a linguística.","see":[],"p":["Freud","Lacan"]},{"id":"psicodelico","t":"Psicodélico","e":"gr. psyché: \"mente\" + délos: \"manifesto\"","a":"Termo criado nos anos 1950 para [[substancia|substâncias]] e [[experiencia|experiências]] que alteram a percepção e a [[consciencia|consciência]]. {{Huxley|Aldous Huxley}} escreveu As portas da percepção. Liga-se à contracultura dos anos 1960 e ao debate sobre estados alterados de consciência.","see":[],"p":["Huxley"]},{"id":"psicologia","t":"Psicologia","e":"gr. psyché + lógos","a":"Ciência que estuda a mente e o comportamento. Até o século XIX, era parte da [[filosofia|filosofia]]. {{Wundt|Wundt}} criou o primeiro laboratório (1879). Correntes: [[behaviorismo|behaviorismo]], [[psicanalise|psicanálise]], gestalt, cognitivismo.","see":[],"p":["Wundt"]},{"id":"publicidade","t":"Publicidade","e":"lat. publicus: \"do povo\"","a":"Em {{Kant|Kant}} e {{Habermas|Habermas}}, caráter público do uso da [[razao|razão]] e das decisões [[politica|políticas]], condição da [[democracia|democracia]]. No uso comum, propaganda comercial, que a [[teoria|teoria]] [[critica|crítica]] analisa como ferramenta da [[industria-cultural|indústria cultural]].","see":[],"p":["Kant","Habermas"]},{"id":"qualidade","t":"Qualidade","e":"lat. qualitas, de qualis: \"qual\"","a":"Característica que define como algo é (cor, sabor, forma). É uma [[categoria|categoria]] de {{Aristóteles|Aristóteles}}. {{Locke|Locke}} distingue qualidades primárias, que estão nos [[objeto|objetos]] (extensão, [[movimento|movimento]]), e secundárias, que dependem de quem percebe (cor, cheiro).","see":[],"p":["Aristóteles","Locke"]},{"id":"quantidade","t":"Quantidade","e":"lat. quantitas, de quantus: \"quanto\"","a":"Aquilo que pode ser medido ou contado. É uma [[categoria|categoria]] aristotélica. A ciência moderna, com {{Galileu|Galileu}}, passou a explicar a natureza pela quantidade, escrita em \"[[linguagem|linguagem]] matemática\".","see":[],"p":["Galileu"]},{"id":"quididade","t":"Quididade","e":"lat. quidditas, de quid: \"o quê\"","a":"Termo da [[filosofia|filosofia]] medieval para a essência de uma coisa, aquilo que responde à pergunta \"o que é?\". A quididade do ser humano é ser animal racional.","see":[],"p":[]},{"id":"raca","t":"Raça","e":"it. razza","a":"Na biologia antiga, divisão da espécie humana por traços físicos. A genética mostrou que raças humanas não existem biologicamente. O termo permanece como [[categoria|categoria]] social e [[politica|política]], ligado às [[experiencia|experiências]] de discriminação.","see":[],"p":[]},{"id":"racional","t":"Racional","e":"lat. rationalis","a":"Que é dotado de [[razao|razão]] ou está de acordo com ela. {{Aristóteles|Aristóteles}} definiu o ser humano como animal racional. {{Hegel|Hegel}}: \"o que é racional é real, e o que é real é racional\".","see":[],"p":["Aristóteles","Hegel"]},{"id":"racionalismo","t":"Racionalismo","e":"lat. ratio: \"razão\"","a":"Corrente que afirma que a [[razao|razão]] é a principal fonte do [[conhecimento|conhecimento]], capaz de alcançar [[verdade|verdades]] [[universal|universais]] e necessárias. {{Descartes|Descartes}}, {{Espinosa|Espinosa}} e {{Leibniz|Leibniz}} são racionalistas e admitem ideias inatas. Opõe-se ao [[empirismo|empirismo]].","see":[],"p":["Descartes","Espinosa","Leibniz"]},{"id":"racismo","t":"Racismo","e":"","a":"Doutrina e prática que hierarquizam pessoas segundo supostas [[raca|raças]], justificando discriminação e dominação. {{Frantz Fanon|Frantz Fanon}} analisou seus efeitos psicológicos. No Brasil, {{Silvio Almeida|Silvio Almeida}} fala em racismo estrutural, presente nas instituições e na [[historia|história]]. É crime pela Constituição.","see":[],"p":["Frantz Fanon","Silvio Almeida"]},{"id":"radicalismo","t":"Radicalismo","e":"lat. radix: \"raiz\"","a":"Atitude de ir à raiz dos problemas. Para {{Marx|Marx}}, \"ser radical é agarrar as coisas pela raiz\". {{Saviani|Saviani}} diz que a reflexão filosófica deve ser radical, rigorosa e de conjunto. No uso [[politica|político]], indica posições extremas.","see":[],"p":["Marx","Saviani"]},{"id":"razao","t":"Razão","e":"lat. ratio: \"cálculo\", \"medida\"; gr. lógos","a":"Faculdade de pensar, julgar, argumentar e conhecer. Para os gregos, distingue o ser humano dos animais. {{Descartes|Descartes}} a chama \"a coisa mais bem distribuída do mundo\". {{Kant|Kant}} examinou seus limites. A Escola de Frankfurt criticou sua redução a instrumento.","see":[],"p":["Descartes","Kant"]},{"id":"razao-instrumental","t":"Razão instrumental","e":"al. instrumentelle Vernunft","a":"Uso da [[razao|razão]] apenas para encontrar os meios mais eficientes de atingir um fim, sem perguntar se o fim é bom. {{Horkheimer|Horkheimer}} e {{Adorno|Adorno}} criticaram seu domínio na modernidade. {{Habermas|Habermas}} propõe a razão comunicativa, baseada no diálogo.","see":[],"p":["Horkheimer","Adorno","Habermas"]},{"id":"real","t":"Real","e":"lat. realis, de res: \"coisa\"","a":"Aquilo que existe de fato, independentemente do [[pensamento|pensamento]] ou da [[imaginacao|imaginação]]. Para {{Platão|Platão}}, o mais real são as [[ideia|Ideias]]. Para {{Lacan|Lacan}}, o real é o que escapa à simbolização.","see":[],"p":["Platão","Lacan"]},{"id":"realidade-objetiva","t":"Realidade objetiva","e":"","a":"Aquilo que existe independentemente da mente de quem conhece. O realismo afirma que podemos conhecê-la; o [[idealismo|idealismo]] destaca o papel do [[sujeito|sujeito]]. Para {{Descartes|Descartes}}, \"realidade objetiva\" era o conteúdo representado por uma ideia.","see":[],"p":["Descartes"]},{"id":"reciprocidade","t":"Reciprocidade","e":"lat. reciprocus: \"que vai e volta\"","a":"Relação de troca mútua entre pessoas ou grupos. {{Marcel Mauss|Marcel Mauss}} mostrou, no Ensaio sobre a dádiva, que dar, receber e retribuir organizam muitas [[sociedade|sociedades]]. É base da regra de ouro: tratar o outro como gostaria de ser tratado.","see":[],"p":["Marcel Mauss"]},{"id":"refutacao","t":"Refutação","e":"lat. refutare: \"rebater\"","a":"[[demonstracao|Demonstração]] de que uma afirmação é falsa. {{Sócrates|Sócrates}} usava o élenchos, refutando as [[opiniao|opiniões]] dos interlocutores. Para {{Karl Popper|Popper}}, a ciência avança pela refutação de [[teoria|teorias]].","see":[],"p":["Sócrates","Karl Popper"]},{"id":"relacao","t":"Relação","e":"lat. relatio","a":"Ligação entre duas ou mais coisas, como \"maior que\", \"pai de\", \"causa de\". É uma das [[categoria|categorias]] de {{Aristóteles|Aristóteles}}. Muitos pensadores contemporâneos afirmam que somos constituídos por nossas relações.","see":[],"p":["Aristóteles"]},{"id":"relativismo","t":"Relativismo","e":"","a":"Doutrina segundo a qual a [[verdade|verdade]] ou os [[valor|valores]] dependem do [[sujeito|sujeito]], da [[cultura|cultura]] ou da época. Protágoras: \"o homem é a medida de todas as coisas\". O relativismo cultural combate o etnocentrismo, mas é criticado por dificultar a condenação de injustiças.","see":[],"p":[]},{"id":"religiao","t":"Religião","e":"lat. religare: \"religar\", ou relegere: \"reler\"","a":"Conjunto de [[crenca|crenças]], [[rito|ritos]] e práticas ligados ao [[sagrado|sagrado]]. Para {{Durkheim|Durkheim}}, une a comunidade. Para {{Feuerbach|Feuerbach}}, é projeção humana; para {{Marx|Marx}}, \"o ópio do povo\"; para {{Freud|Freud}}, ilusão. Para {{Kierkegaard|Kierkegaard}} e {{William James|William James}}, é [[experiencia|experiência]] existencial profunda.","see":[],"p":["Durkheim","Feuerbach","Marx","Freud","Kierkegaard","William James"]},{"id":"repeticao","t":"Repetição","e":"lat. repetere","a":"Retorno do mesmo. {{Kierkegaard|Kierkegaard}} via na repetição a [[coragem|coragem]] de assumir a [[vida|vida]]. {{Freud|Freud}} falou da compulsão à repetição. {{Deleuze|Deleuze}}, em [[diferenca|Diferença]] e repetição, mostrou que toda repetição produz diferença. {{Nietzsche|Nietzsche}} pensou o eterno retorno.","see":[],"p":["Kierkegaard","Freud","Deleuze","Nietzsche"]},{"id":"representacao","t":"Representação","e":"lat. repraesentare: \"tornar presente\"","a":"Aquilo que torna presente algo ausente: imagem mental, [[signo|signo]], ideia. Para {{Schopenhauer|Schopenhauer}}, \"o mundo é minha representação\". Na [[politica|política]], representação é o mandato do eleito em nome do povo.","see":[],"p":["Schopenhauer"]},{"id":"responsabilidade","t":"Responsabilidade","e":"lat. respondere: \"responder\"","a":"[[dever|Dever]] de responder pelos próprios atos e suas [[consequencia|consequências]]. Para {{Aristóteles|Aristóteles}}, só respondemos pelo que é voluntário. Para {{Sartre|Sartre}}, somos totalmente responsáveis. {{Hans Jonas|Hans Jonas}} propõe uma [[etica|ética]] da responsabilidade com o [[futuro|futuro]] do planeta.","see":[],"p":["Aristóteles","Sartre","Hans Jonas"]},{"id":"retorica","t":"Retórica","e":"gr. rhetoriké: \"arte do orador\"","a":"[[arte|Arte]] de persuadir pelo discurso. Os [[sofisma|sofistas]] a ensinavam; {{Platão|Platão}} a criticava quando separada da [[verdade|verdade]]. {{Aristóteles|Aristóteles}} a sistematizou em três provas: ethos (caráter do orador), pathos ([[emocao|emoção]] do público) e [[logos|logos]] ([[argumento|argumento]]).","see":[],"p":["Platão","Aristóteles"]},{"id":"revelacao","t":"Revelação","e":"lat. revelare: \"tirar o véu\"","a":"Na [[religiao|religião]], manifestação de [[deus|Deus]] aos seres humanos, por escrituras ou profetas. {{Tomás de Aquino|Tomás de Aquino}} distingue [[verdade|verdades]] da revelação e verdades da [[razao|razão]]. {{Heidegger|Heidegger}} pensou a verdade como desvelamento (alétheia).","see":[],"p":["Tomás de Aquino","Heidegger"]},{"id":"rito","t":"Rito","e":"lat. ritus","a":"Ação simbólica repetida segundo regras, que marca momentos importantes (nascimento, casamento, [[morte|morte]]) ou reafirma [[crenca|crenças]]. {{Van Gennep|Van Gennep}} estudou os ritos de passagem.","see":[],"p":["Van Gennep"]},{"id":"romantismo","t":"Romantismo","e":"","a":"[[movimento|Movimento]] cultural do final do século XVIII e do XIX ({{Rousseau|Rousseau}} como inspiração, {{Schelling|Schelling}}, {{Novalis|Novalis}}) que valorizou o [[sentimento|sentimento]], a natureza, a [[imaginacao|imaginação]], o gênio e a nação, reagindo ao [[racionalismo|racionalismo]] [[iluminismo|iluminista]].","see":[],"p":["Rousseau","Schelling","Novalis"]},{"id":"sabedoria","t":"Sabedoria","e":"lat. sapientia, de sapere: \"ter sabor\", \"saber\"; gr. sophía","a":"[[conhecimento|Conhecimento]] profundo unido à [[arte|arte]] de bem viver. A [[filosofia|filosofia]] é [[amor|amor]] à sabedoria, e não sua posse. Para os antigos, sabedoria é saber o que é essencial e agir de acordo.","see":[],"p":[]},{"id":"sabio","t":"Sábio","e":"lat. sapiens","a":"Pessoa que possui [[sabedoria|sabedoria]]. Para os [[estoicismo|estoicos]], o sábio é [[liberdade|livre]], sereno e virtuoso, um ideal raramente alcançado. {{Sócrates|Sócrates}} era considerado o mais sábio por saber que nada sabia.","see":[],"p":["Sócrates"]},{"id":"sagrado","t":"Sagrado","e":"lat. sacer: \"separado\", \"consagrado\"","a":"Aquilo que é separado do uso comum por ligar-se ao divino e despertar respeito e temor. {{Rudolf Otto|Rudolf Otto}} o descreveu como mistério fascinante e terrível. {{Mircea Eliade|Mircea Eliade}} estudou sua oposição ao [[profano|profano]].","see":[],"p":["Rudolf Otto","Mircea Eliade"]},{"id":"sensacao","t":"Sensação","e":"lat. sensatio","a":"Impressão produzida nos sentidos por um estímulo. Para o [[empirismo|empirismo]], as sensações são a [[materia|matéria]] de todo [[conhecimento|conhecimento]]. A Gestalt mostrou que percebemos totalidades, e não sensações soltas.","see":[],"p":[]},{"id":"senso-comum","t":"Senso comum","e":"lat. sensus communis","a":"Conjunto de [[crenca|crenças]] compartilhadas por um grupo, aceitas sem exame. A [[filosofia|filosofia]] nasce ao questioná-lo. {{Gramsci|Gramsci}} reconhece no senso comum um \"núcleo sadio\" de bom senso, que pode ser elaborado criticamente.","see":[],"p":["Gramsci"]},{"id":"sentenca","t":"Sentença","e":"lat. sententia: \"opinião\", \"decisão\"","a":"Na gramática e na [[logica|lógica]], frase com sentido completo. No [[direito|direito]], decisão do juiz. Na [[tradicao|tradição]] antiga, máxima breve de [[sabedoria|sabedoria]], como \"conhece-te a ti mesmo\".","see":[],"p":[]},{"id":"sentidos","t":"Sentidos","e":"lat. sensus","a":"Faculdades de perceber o mundo: visão, audição, olfato, paladar e tato. Para {{Platão|Platão}} e {{Descartes|Descartes}}, podem enganar. Para os [[empirismo|empiristas]], são a fonte do [[conhecimento|conhecimento]]. {{Merleau-Ponty|Merleau-Ponty}} valorizou a percepção corporal.","see":[],"p":["Platão","Descartes","Merleau-Ponty"]},{"id":"sentimento","t":"Sentimento","e":"lat. sentire: \"sentir\"","a":"[[estado|Estado]] afetivo mais duradouro e reflexivo que a [[emocao|emoção]], como [[amor|amor]], gratidão ou saudade. {{Hume|Hume}} fundou a [[moral|moral]] nos sentimentos, e não na [[razao|razão]]. {{Rousseau|Rousseau}} valorizou o sentimento como guia interior.","see":[],"p":["Hume","Rousseau"]},{"id":"ser","t":"Ser","e":"lat. esse","a":"O fato de existir e aquilo que existe. Para {{Parmênides|Parmênides}}, \"o ser é e o não ser não é\". {{Aristóteles|Aristóteles}} mostrou que \"o ser se diz de muitos modos\". {{Heidegger|Heidegger}} acusou a [[filosofia|filosofia]] de ter esquecido a pergunta pelo sentido do ser.","see":[],"p":["Parmênides","Aristóteles","Heidegger"]},{"id":"significado","t":"Significado","e":"lat. significare: \"dar sinal\"","a":"Sentido de uma palavra, expressão ou ação. {{Frege|Frege}} distinguiu sentido (o modo de apresentar) e referência (o [[objeto|objeto]] apontado). Para o segundo {{Wittgenstein|Wittgenstein}}, o significado de uma palavra é seu uso na [[linguagem|linguagem]].","see":[],"p":["Frege","Wittgenstein"]},{"id":"signo","t":"Signo","e":"lat. signum: \"sinal\"","a":"Aquilo que representa outra coisa. Para {{Saussure|Saussure}}, o signo une significante (a forma, o som) e [[significado|significado]] (o [[conceito|conceito]]), e essa união é arbitrária. {{Peirce|Peirce}} distinguiu ícone, índice e símbolo.","see":[],"p":["Saussure","Peirce"]},{"id":"silogismo","t":"Silogismo","e":"gr. syllogismós: \"raciocínio conjunto\"","a":"Raciocínio dedutivo de {{Aristóteles|Aristóteles}}, com duas premissas e uma conclusão: \"Todo homem é mortal; {{Sócrates|Sócrates}} é homem; logo, {{Sócrates|Sócrates}} é mortal\". É a base da [[logica|lógica]] clássica.","see":[],"p":["Aristóteles","Sócrates"]},{"id":"simbolismo","t":"Simbolismo","e":"gr. sýmbolon: \"sinal de reconhecimento\"","a":"Uso de símbolos para representar ideias. {{Cassirer|Cassirer}} definiu o ser humano como \"animal simbólico\". Também é o [[movimento|movimento]] literário do fim do século XIX (Baudelaire, Cruz e Sousa) que valorizou a sugestão e a [[musica|música]] das palavras.","see":[],"p":["Cassirer"]},{"id":"sintese","t":"Síntese","e":"gr. sýnthesis: \"composição\"","a":"União de elementos num todo. Na [[dialetica|dialética]] de {{Hegel|Hegel}}, momento que supera e conserva [[tese|tese]] e [[antitese|antítese]]. Para {{Kant|Kant}}, a síntese é a atividade do [[entendimento|entendimento]] que une as [[representacao|representações]]. Ver Tese e Antítese.","see":["tese","antitese"],"p":["Hegel","Kant"]},{"id":"sistema","t":"Sistema","e":"gr. sýstema: \"conjunto organizado\"","a":"Conjunto de elementos interligados que formam um todo. Um sistema filosófico, como o de {{Hegel|Hegel}}, pretende explicar toda a realidade de modo coerente. {{Kierkegaard|Kierkegaard}} e {{Nietzsche|Nietzsche}} desconfiavam dos sistemas.","see":[],"p":["Hegel","Kierkegaard","Nietzsche"]},{"id":"socialismo","t":"Socialismo","e":"lat. socius: \"companheiro\"","a":"Conjunto de doutrinas que defendem a [[propriedade|propriedade]] coletiva ou social dos meios de [[producao|produção]] e a redução das [[desigualdade|desigualdades]]. Há socialismo utópico ({{Saint-Simon|Saint-Simon}}, {{Owen|Owen}}), científico ({{Marx|Marx}} e {{Engels|Engels}}) e [[democracia|democrático]]. Para {{Marx|Marx}}, seria a etapa anterior ao [[comunismo|comunismo]].","see":[],"p":["Saint-Simon","Owen","Marx","Engels"]},{"id":"sociedade","t":"Sociedade","e":"lat. societas, de socius: \"companheiro\"","a":"Conjunto de pessoas que vivem juntas por meio de regras, instituições e interesses comuns. Para {{Aristóteles|Aristóteles}}, somos sociais por natureza. Para os [[contratualismo|contratualistas]], a sociedade nasce de um pacto. Para {{Durkheim|Durkheim}}, ela molda os indivíduos.","see":[],"p":["Aristóteles","Durkheim"]},{"id":"sociologia","t":"Sociologia","e":"lat. socius + gr. lógos","a":"Ciência que estuda a [[sociedade|sociedade]], suas estruturas e transformações. {{Comte|Comte}} criou o nome; {{Durkheim|Durkheim}}, {{Max Weber|Weber}} e {{Marx|Marx}} são considerados seus clássicos.","see":[],"p":["Comte","Durkheim","Max Weber","Marx"]},{"id":"socratismo","t":"Socratismo","e":"","a":"Para {{Nietzsche|Nietzsche}}, a atitude [[racionalismo|racionalista]] inaugurada por {{Sócrates|Sócrates}}, que acreditava que a [[razao|razão]] pode corrigir a [[vida|vida]] e que [[virtude|virtude]] é saber. {{Nietzsche|Nietzsche}} o via como causa do declínio da [[tragico|tragédia]] grega e do instinto [[dionisiaco|dionisíaco]].","see":[],"p":["Nietzsche","Sócrates"]},{"id":"sofisma","t":"Sofisma","e":"gr. sóphisma: \"astúcia\"","a":"Raciocínio falso feito para enganar, com [[aparencia|aparência]] de [[verdade|verdade]]. O nome vem dos sofistas, mestres de [[retorica|retórica]] criticados por {{Platão|Platão}} por ensinarem a vencer debates sem compromisso com a verdade.","see":[],"p":["Platão"]},{"id":"solipsismo","t":"Solipsismo","e":"lat. solus: \"só\" + ipse: \"mesmo\"","a":"Posição extrema segundo a qual só a própria mente existe ou pode ser conhecida com certeza, e o resto pode ser ilusão. {{Descartes|Descartes}} o enfrentou após a [[duvida|dúvida]] metódica.","see":[],"p":["Descartes"]},{"id":"subconsciente","t":"Subconsciente","e":"lat. sub: \"abaixo\" + conscius","a":"Termo usado popularmente para processos mentais abaixo da [[consciencia|consciência]]. {{Freud|Freud}} preferiu falar em pré-consciente (o que pode vir à consciência) e [[inconsciente|inconsciente]] (o que é reprimido).","see":[],"p":["Freud"]},{"id":"subjetivo","t":"Subjetivo","e":"lat. subiectivus","a":"Aquilo que depende do [[sujeito|sujeito]], de seus [[sentimento|sentimentos]] e pontos de vista. Opõe-se ao objetivo. Gostos são subjetivos; mas {{Kant|Kant}} mostrou que até o [[juizo|juízo]] de gosto aspira à universalidade.","see":[],"p":["Kant"]},{"id":"sublime","t":"Sublime","e":"lat. sublimis: \"elevado\"","a":"[[sentimento|Sentimento]] diante do que ultrapassa nossa medida, como uma tempestade ou o céu estrelado, misturando admiração e temor. {{Burke|Burke}} e {{Kant|Kant}} o distinguiram do belo. Para {{Kant|Kant}}, o sublime revela a grandeza da [[razao|razão]] humana.","see":[],"p":["Burke","Kant"]},{"id":"substancia","t":"Substância","e":"lat. substantia: \"o que está por baixo\"","a":"Aquilo que existe por si e sustenta as [[qualidade|qualidades]]. Para {{Aristóteles|Aristóteles}}, é a primeira [[categoria|categoria]]. {{Descartes|Descartes}} fala em substância pensante e extensa. Para {{Espinosa|Espinosa}}, existe uma única substância: [[deus|Deus]] ou a Natureza.","see":[],"p":["Aristóteles","Descartes","Espinosa"]},{"id":"suficiente","t":"Suficiente","e":"lat. sufficere: \"bastar\"","a":"Na [[logica|lógica]], condição suficiente é aquela que basta para que algo aconteça: chover é suficiente para molhar a rua, mas não necessário. {{Leibniz|Leibniz}} formulou o [[principio|princípio]] de [[razao|razão]] suficiente: nada acontece sem uma razão. Ver Necessário.","see":["necessario"],"p":["Leibniz"]},{"id":"sujeito","t":"Sujeito","e":"lat. subiectum: \"o que está por baixo\"","a":"O ser humano enquanto alguém que pensa, conhece, sente e age. {{Descartes|Descartes}} o funda no \"eu penso\"; {{Kant|Kant}} mostra que ele organiza a [[experiencia|experiência]]. {{Marx|Marx}}, {{Freud|Freud}} e {{Foucault|Foucault}} mostram que o sujeito é condicionado pela [[sociedade|sociedade]], pelo [[inconsciente|inconsciente]] e pelo [[poder|poder]].","see":[],"p":["Descartes","Kant","Marx","Freud","Foucault"]},{"id":"sumo-bem","t":"Sumo bem","e":"lat. summum bonum","a":"O bem mais elevado, fim último de todas as ações. Para {{Aristóteles|Aristóteles}}, é a [[felicidade|felicidade]]. Para os [[estoicismo|estoicos]], a [[virtude|virtude]]. Para {{Agostinho|Agostinho}}, [[deus|Deus]]. Para {{Kant|Kant}}, a união entre virtude e felicidade.","see":[],"p":["Aristóteles","Agostinho","Kant"]},{"id":"superestrutura","t":"Superestrutura","e":"al. Überbau","a":"Em {{Marx|Marx}}, conjunto de instituições e ideias ([[direito|direito]], [[estado|Estado]], [[religiao|religião]], [[arte|arte]], [[filosofia|filosofia]]) que se ergue sobre a infraestrutura econômica (forças e relações de [[producao|produção]]) e é condicionado por ela.","see":[],"p":["Marx"]},{"id":"sustentabilidade","t":"Sustentabilidade","e":"lat. sustentare: \"manter\"","a":"Capacidade de atender às necessidades do presente sem comprometer as gerações futuras. Popularizada pelo Relatório Brundtland (1987) e pela Rio-92. {{Hans Jonas|Hans Jonas}} fundamenta essa [[responsabilidade|responsabilidade]] com o [[futuro|futuro]].","see":[],"p":["Hans Jonas"]},{"id":"tabu","t":"Tabu","e":"polinésio tapu: \"proibido\", \"sagrado\"","a":"Proibição sagrada ou social cuja violação provoca forte reprovação. {{Freud|Freud}}, em [[totem|Totem]] e tabu, relacionou os tabus primitivos à origem da [[moral|moral]] e da culpa.","see":[],"p":["Freud"]},{"id":"taoismo","t":"Taoísmo","e":"chin. Tao: \"caminho\"","a":"[[filosofia|Filosofia]] chinesa atribuída a {{Lao-Tsé|Lao-Tsé}} (Tao Te Ching) e {{Chuang-Tsé|Chuang-Tsé}}. O Tao é o [[principio|princípio]] indizível que flui em todas as coisas. Ensina a harmonia com a natureza, a simplicidade e o wu wei (agir sem forçar). O yin e o yang expressam a complementaridade dos opostos.","see":[],"p":["Lao-Tsé","Chuang-Tsé"]},{"id":"tautologia","t":"Tautologia","e":"gr. tautó: \"o mesmo\" + lógos","a":"Afirmação sempre verdadeira por sua própria forma, mas que nada informa sobre o mundo, como \"chove ou não chove\". Para {{Wittgenstein|Wittgenstein}}, as [[verdade|verdades]] da [[logica|lógica]] são tautologias.","see":[],"p":["Wittgenstein"]},{"id":"tecnica","t":"Técnica","e":"gr. téchne: \"arte\", \"saber fazer\"","a":"Conjunto de procedimentos e instrumentos para produzir algo ou transformar a natureza. Para {{Aristóteles|Aristóteles}}, é saber prático. {{Bacon|Bacon}}: \"saber é [[poder|poder]]\". {{Heidegger|Heidegger}} alertou que a técnica moderna transforma tudo, inclusive o ser humano, em recurso.","see":[],"p":["Aristóteles","Bacon","Heidegger"]},{"id":"tecnologia","t":"Tecnologia","e":"gr. téchne + lógos","a":"Aplicação sistemática do [[conhecimento|conhecimento]] científico à [[producao|produção]] de instrumentos e processos. Hoje inclui a internet e a inteligência artificial. Filósofos discutem se ela liberta ou controla, e quem decide seus rumos.","see":[],"p":[]},{"id":"tedio","t":"Tédio","e":"lat. taedium: \"aborrecimento\"","a":"[[sentimento|Sentimento]] de vazio e falta de sentido, quando nada interessa. Para {{Pascal|Pascal}}, o ser humano foge do tédio pelo divertimento. Para {{Schopenhauer|Schopenhauer}}, a [[vida|vida]] oscila entre a dor e o tédio. {{Heidegger|Heidegger}} viu no tédio profundo uma [[revelacao|revelação]] da [[existencia|existência]].","see":[],"p":["Pascal","Schopenhauer","Heidegger"]},{"id":"teismo","t":"Teísmo","e":"gr. theós: \"deus\"","a":"[[crenca|Crença]] em um [[deus|Deus]] pessoal, criador, que age no mundo. Difere do deísmo, que admite um Deus criador que não intervém, e do panteísmo, que identifica Deus e a natureza.","see":[],"p":[]},{"id":"teleologia","t":"Teleologia","e":"gr. télos: \"fim\" + lógos","a":"Explicação das coisas por suas [[finalidade|finalidades]]. {{Aristóteles|Aristóteles}} via finalidade em toda a natureza. A ciência moderna preferiu explicações mecânicas. {{Hegel|Hegel}} e {{Marx|Marx}} viram uma direção na [[historia|história]].","see":[],"p":["Aristóteles","Hegel","Marx"]},{"id":"tempo","t":"Tempo","e":"lat. tempus; gr. chrónos","a":"Sucessão de momentos: passado, presente e [[futuro|futuro]]. {{Agostinho|Agostinho}}: \"se ninguém me pergunta, sei; se quero explicar, não sei\". Para {{Kant|Kant}}, é forma [[a-priori|a priori]] da sensibilidade. {{Bergson|Bergson}} distinguiu o tempo do relógio da duração vivida. {{Einstein|Einstein}} mostrou que é relativo.","see":[],"p":["Agostinho","Kant","Bergson","Einstein"]},{"id":"teocracia","t":"Teocracia","e":"gr. theós: \"deus\" + krátos: \"poder\"","a":"Governo em que o [[poder|poder]] [[politica|político]] é exercido em nome de [[deus|Deus]] ou por [[autoridade|autoridades]] religiosas, e a [[lei|lei]] religiosa é a lei do [[estado|Estado]].","see":[],"p":[]},{"id":"teorema","t":"Teorema","e":"gr. theórema: \"o que se contempla\"","a":"[[proposicao|Proposição]] demonstrada a partir de [[axioma|axiomas]] e outros teoremas. O teorema de {{Pitágoras|Pitágoras}} é o exemplo mais conhecido.","see":[],"p":["Pitágoras"]},{"id":"teoria","t":"Teoria","e":"gr. theoría: \"contemplação\", \"visão\"","a":"Conjunto organizado de [[conceito|conceitos]] que explica um campo da realidade. Para os gregos, a [[vida|vida]] teórica era a contemplação da [[verdade|verdade]], considerada a mais alta. Hoje opõe-se à prática, embora as duas se alimentem mutuamente (práxis).","see":[],"p":[]},{"id":"teosofia","t":"Teosofia","e":"gr. theós: \"deus\" + sophía: \"sabedoria\"","a":"Doutrina mística que busca conhecer [[deus|Deus]] por iluminação interior. No século XIX, {{Helena Blavatsky|Helena Blavatsky}} fundou a [[sociedade|Sociedade]] Teosófica, misturando [[tradicao|tradições]] orientais e ocidentais.","see":[],"p":["Helena Blavatsky"]},{"id":"tese","t":"Tese","e":"gr. thésis: \"posição\"","a":"Afirmação que se propõe e se defende com [[argumento|argumentos]]. Na [[dialetica|dialética]] de {{Hegel|Hegel}}, primeiro momento, que gera sua negação ([[antitese|antítese]]) e é superado na [[sintese|síntese]]. Ver Antítese e Síntese.","see":["antitese","sintese"],"p":["Hegel"]},{"id":"tirania","t":"Tirania","e":"gr. týrannos: \"senhor absoluto\"","a":"Governo de um só que exerce o [[poder|poder]] em benefício próprio, sem respeitar [[lei|leis]]. Para {{Platão|Platão}} e {{Aristóteles|Aristóteles}}, é a pior forma de governo, a [[corrupcao|corrupção]] da monarquia.","see":[],"p":["Platão","Aristóteles"]},{"id":"todo","t":"Todo","e":"lat. totus","a":"Conjunto de partes considerado como [[unidade|unidade]]. {{Aristóteles|Aristóteles}}: \"o todo é mais que a soma das partes\". A Gestalt e a [[teoria|teoria]] dos [[sistema|sistemas]] retomaram essa ideia. {{Hegel|Hegel}}: \"o verdadeiro é o todo\".","see":[],"p":["Aristóteles","Hegel"]},{"id":"totalitarismo","t":"Totalitarismo","e":"","a":"Regime que pretende controlar todos os aspectos da [[vida|vida]], público e privado, por meio de partido único, [[ideologia|ideologia]] oficial, propaganda, polícia secreta e terror. {{Hannah Arendt|Hannah Arendt}}, em Origens do totalitarismo, analisou o [[nazismo|nazismo]] e o stalinismo.","see":[],"p":["Hannah Arendt"]},{"id":"totem","t":"Totem","e":"ojíbua ototeman: \"parente\"","a":"Animal, planta ou [[objeto|objeto]] considerado ancestral e protetor de um grupo, alvo de respeito e proibições. {{Durkheim|Durkheim}} viu no totemismo a forma elementar da [[religiao|religião]].","see":[],"p":["Durkheim"]},{"id":"trabalho","t":"Trabalho","e":"lat. tripalium: instrumento de tortura","a":"Atividade pela qual o ser humano transforma a natureza e, ao fazê-lo, transforma a si mesmo. Desvalorizado na Antiguidade, foi exaltado na modernidade. Para {{Marx|Marx}}, nos humaniza, mas no [[capitalismo|capitalismo]] se torna alienado. {{Hannah Arendt|Arendt}} distingue labor, trabalho e ação.","see":[],"p":["Marx","Hannah Arendt"]},{"id":"tradicao","t":"Tradição","e":"lat. traditio: \"entrega\", \"transmissão\"","a":"Conjunto de [[costume|costumes]], [[crenca|crenças]] e saberes transmitidos entre gerações. O [[iluminismo|Iluminismo]] desconfiava da tradição; {{Gadamer|Gadamer}} mostrou que todo compreender parte de uma tradição.","see":[],"p":["Gadamer"]},{"id":"tragico","t":"Trágico","e":"gr. tragikós","a":"O que se refere à tragédia, gênero teatral grego (Ésquilo, Sófocles, Eurípides) em que o herói enfrenta um [[destino|destino]] inevitável. {{Aristóteles|Aristóteles}} falou da catarse. Para {{Nietzsche|Nietzsche}}, o trágico é afirmar a [[vida|vida]] mesmo em sua dor.","see":[],"p":["Aristóteles","Nietzsche"]},{"id":"transcendental","t":"Transcendental","e":"lat. transcendere: \"ultrapassar\"","a":"Em {{Kant|Kant}}, refere-se às condições [[a-priori|a priori]] que tornam possível o [[conhecimento|conhecimento]], como [[espaco|espaço]], [[tempo|tempo]] e [[categoria|categorias]]. Não confundir com [[transcendente|transcendente]].","see":[],"p":["Kant"]},{"id":"transcendente","t":"Transcendente","e":"lat. transcendere: \"ultrapassar\"","a":"Aquilo que está além do mundo da [[experiencia|experiência]], como o [[deus|Deus]] das [[religiao|religiões]] monoteístas. Opõe-se a [[imanente|imanente]].","see":[],"p":[]},{"id":"unico","t":"Único","e":"lat. unicus","a":"Aquilo que é só um, sem igual. {{Stirner|Stirner}} escreveu O único e sua [[propriedade|propriedade]], defendendo o indivíduo contra todas as abstrações. Cada pessoa, para o [[existencialismo|existencialismo]], é única e insubstituível.","see":[],"p":["Stirner"]},{"id":"unidade","t":"Unidade","e":"lat. unitas","a":"Caráter do que é um, indiviso. Para {{Parmênides|Parmênides}}, o ser é uno. Para {{Plotino|Plotino}}, tudo vem do Uno. {{Kant|Kant}} fala na unidade da [[consciencia|consciência]] que reúne as [[representacao|representações]].","see":[],"p":["Parmênides","Plotino","Kant"]},{"id":"universal","t":"Universal","e":"lat. universalis","a":"Aquilo que vale para todos os casos. Na Idade Média, a \"querela dos universais\" discutiu se os [[conceito|conceitos]] gerais (como \"homem\") existem fora da mente (realismo) ou são apenas nomes (nominalismo).","see":[],"p":[]},{"id":"utilitarismo","t":"Utilitarismo","e":"lat. utilitas: \"utilidade\"","a":"[[teoria|Teoria]] [[etica|ética]] segundo a qual a ação correta é a que produz maior [[felicidade|felicidade]] para o maior número. {{Bentham|Bentham}} propôs calcular [[prazer|prazeres]] e dores; {{Stuart Mill|Stuart Mill}} distinguiu prazeres superiores e inferiores. É criticado por [[poder|poder]] sacrificar minorias.","see":[],"p":["Bentham","Stuart Mill"]},{"id":"utopia","t":"Utopia","e":"gr. ou: \"não\" + tópos: \"lugar\"","a":"\"Lugar nenhum\": sociedade ideal imaginada. {{Thomas More|Thomas More}} criou o termo (1516). {{Platão|Platão}} (República) e {{Campanella|Campanella}} (A cidade do Sol) também imaginaram [[sociedade|sociedades]] perfeitas. {{Ernst Bloch|Ernst Bloch}} viu na utopia o [[principio|princípio]] da esperança.","see":[],"p":["Thomas More","Platão","Campanella","Ernst Bloch"]},{"id":"validade","t":"Validade","e":"lat. validus: \"forte\"","a":"Na [[logica|lógica]], [[propriedade|propriedade]] de um [[argumento|argumento]] cuja conclusão segue necessariamente das premissas. Um argumento pode ser válido com premissas falsas. Validade diz respeito à forma; [[verdade|verdade]], ao conteúdo.","see":[],"p":[]},{"id":"valor","t":"Valor","e":"lat. valere: \"ser forte\", \"valer\"","a":"Aquilo que torna algo digno de ser desejado ou escolhido. {{Marx|Marx}} distingue valor de uso e valor de troca. Para {{Kant|Kant}}, o que tem preço pode ser trocado; o que tem [[dignidade|dignidade]], não. {{Nietzsche|Nietzsche}} propôs a \"transvaloração de todos os valores\".","see":[],"p":["Marx","Kant","Nietzsche"]},{"id":"veracidade","t":"Veracidade","e":"lat. verax: \"verdadeiro\"","a":"[[qualidade|Qualidade]] de quem diz a [[verdade|verdade]], a sinceridade. Difere da verdade: alguém pode ser sincero e estar enganado. Para {{Kant|Kant}}, mentir nunca é permitido.","see":[],"p":["Kant"]},{"id":"verdade","t":"Verdade","e":"lat. veritas; gr. alétheia: \"desvelamento\"","a":"Para {{Aristóteles|Aristóteles}}, dizer do que é que é e do que não é que não é (correspondência). Outras [[teoria|teorias]] falam em coerência ou utilidade ([[pragmatismo|pragmatismo]]). Para {{Heidegger|Heidegger}}, é desvelamento. {{Nietzsche|Nietzsche}} questionou a [[vontade|vontade]] de verdade.","see":[],"p":["Aristóteles","Heidegger","Nietzsche"]},{"id":"verificacao","t":"Verificação","e":"lat. verus: \"verdadeiro\" + facere: \"fazer\"","a":"Procedimento para comprovar se algo é verdadeiro. Para o Círculo de Viena, só tem sentido o enunciado verificável pela [[experiencia|experiência]]. {{Karl Popper|Popper}} preferiu a falseabilidade.","see":[],"p":["Karl Popper"]},{"id":"vicio","t":"Vício","e":"lat. vitium: \"defeito\"","a":"Disposição habitual para o mal, oposta à [[virtude|virtude]]. Para {{Aristóteles|Aristóteles}}, os vícios são excessos ou faltas em relação à [[justa-medida|justa medida]]. Hoje também indica dependência.","see":[],"p":["Aristóteles"]},{"id":"vida","t":"Vida","e":"lat. vita; gr. bíos, zoé","a":"Condição dos seres que nascem, crescem, se reproduzem e morrem. Os gregos distinguiam zoé (vida biológica) e bíos (modo de vida). {{Nietzsche|Nietzsche}} fez da vida o critério de todos os [[valor|valores]]. {{Foucault|Foucault}} e {{Agamben|Agamben}} falam em biopolítica.","see":[],"p":["Nietzsche","Foucault","Agamben"]},{"id":"virtude","t":"Virtude","e":"lat. virtus; gr. areté: \"excelência\"","a":"Disposição firme para agir bem. Para {{Sócrates|Sócrates}}, é [[conhecimento|conhecimento]]. Para {{Aristóteles|Aristóteles}}, [[habito|hábito]] que busca a [[justa-medida|justa medida]]. As virtudes cardeais são prudência, [[justica|justiça]], [[coragem|coragem]] e temperança. Em {{Maquiavel|Maquiavel}}, virtù é habilidade [[politica|política]].","see":[],"p":["Sócrates","Aristóteles","Maquiavel"]},{"id":"vontade","t":"Vontade","e":"lat. voluntas","a":"Faculdade de decidir e agir. Para {{Agostinho|Agostinho}}, a vontade [[liberdade|livre]] explica a origem do mal. Para {{Kant|Kant}}, a [[boa-vontade|boa vontade]] é a única coisa boa em si. Para {{Schopenhauer|Schopenhauer}}, a vontade é a essência cega do mundo; para {{Nietzsche|Nietzsche}}, a [[vida|vida]] é vontade de [[potencia|potência]].","see":[],"p":["Agostinho","Kant","Schopenhauer","Nietzsche"]}];
const META = {autor:"Prof. Artur Merlin", fonte:"Dicionário Filosófico · Conceitos fundamentais para o Ensino Médio"};
const byId = Object.fromEntries(DATA.map(e=>[e.id,e]));
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ligações
DATA.forEach(e=>{
  e.out=[...new Set([...(e.a.matchAll(/\[\[([^|]+)\|/g))].map(m=>m[1]).concat(e.see))];
  e.plain=e.a.replace(/\[\[[^|]+\|([^\]]+)\]\]/g,'$1').replace(/\{\{[^|]+\|([^}]+)\}\}/g,'$1');
  e.f=fold(e.t+' '+e.plain); e.inn=[];
});
DATA.forEach(e=>e.out.forEach(o=>byId[o]&&byId[o].inn.push(e.id)));
DATA.forEach(e=>e.deg=new Set([...e.out,...e.inn]).size);
const TH={}; DATA.forEach(e=>e.p.forEach(p=>(TH[p]=TH[p]||[]).push(e.id)));

// armazenamento local (favoritos e trilha)
const store={get(k,d){try{const v=localStorage.getItem('wf:'+k);return v?JSON.parse(v):d}catch(_){return d}},set(k,v){try{localStorage.setItem('wf:'+k,JSON.stringify(v))}catch(_){}}};
let favs=new Set(store.get('favs',[]));
let trail=store.get('trail',[]);

const $=s=>document.querySelector(s);
const view=$('#view');
$('#count').textContent=DATA.length+' verbetes';

// índice
let letter=null;
const LET=[...new Set(DATA.map(e=>fold(e.t)[0].toUpperCase()))];
$('#letters').innerHTML=LET.map(l=>`<button data-l="${l}" aria-pressed="false">${l}</button>`).join('');
$('#letters').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;letter=letter===b.dataset.l?null:b.dataset.l;$('#q').value='';renderList();});
function renderList(){
  const q=fold($('#q').value.trim());
  document.querySelectorAll('#letters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===letter));
  let items=DATA, html='';
  if(q){
    items=DATA.filter(e=>e.f.includes(q)).sort((a,b)=>(fold(b.t).startsWith(q)-fold(a.t).startsWith(q))||(fold(b.t).includes(q)-fold(a.t).includes(q)));
    if(!items.length) html='<li class="hit" style="padding:12px 10px">Nenhum verbete contém essa palavra.</li>';
    items.forEach(e=>{
      let hit='';
      if(!fold(e.t).includes(q)){const i=fold(e.plain).indexOf(q);hit=`<span class="hit">…${esc(e.plain.slice(Math.max(0,i-30),i+50))}…</span>`}
      html+=`<li><button data-go="${e.id}" class="${e.id===curId?'cur':''}">${esc(e.t)}<span class="n">${e.deg}</span></button>${hit}</li>`;
    });
  } else {
    if(letter) items=DATA.filter(e=>fold(e.t)[0].toUpperCase()===letter);
    let last='';
    items.forEach(e=>{const L=fold(e.t)[0].toUpperCase();if(L!==last){html+=`<li class="sep">${L}</li>`;last=L}
      html+=`<li><button data-go="${e.id}" class="${e.id===curId?'cur':''}">${esc(e.t)}<span class="n" title="ligações">${e.deg}</span></button></li>`});
  }
  $('#list').innerHTML=html;
}
$('#q').addEventListener('input',()=>{letter=null;renderList()});
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const b=$('#list button');if(b)go(b.dataset.go)}});

// navegação
let curId=null;
function go(id){ if(location.hash.slice(1)===id) route(); else location.hash=id; }
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-go]'); if(!a) return;
  ev.preventDefault(); $('#side').classList.remove('open'); go(a.dataset.go);
});
window.addEventListener('hashchange',route);
function route(){
  hidePeek();
  const h=decodeURIComponent(location.hash.slice(1))||'inicio';
  if(byId[h]) showEntry(h);
  else if(h==='pensadores') showThinkers();
  else if(h.startsWith('p-')) showThinker(h.slice(2));
  else if(h==='favoritos') showFavs();
  else showHome();
  $('#main').scrollTop=0; renderList(); renderTrail();
  const cur=document.querySelector('#list .cur'); if(cur) cur.scrollIntoView({block:'nearest'});
}
const thSlug=n=>fold(n).replace(/[^a-z0-9]+/g,'-');
const thBySlug=Object.fromEntries(Object.keys(TH).map(n=>[thSlug(n),n]));

function linkify(a,q){
  let h=esc(a)
    .replace(/\[\[([^|]+)\|([^\]]+)\]\]/g,(m,id,t)=>`<a class="l" href="#${id}" data-go="${id}" data-peek="${id}">${t}</a>`)
    .replace(/\{\{([^|]+)\|([^}]+)\}\}/g,(m,n,t)=>`<a class="p" href="#p-${thSlug(n)}" data-go="p-${thSlug(n)}" title="Ver todos os verbetes com ${esc(n)}">${t}</a>`);
  return h;
}
function chips(ids,cls=''){return ids.length?`<div class="chips">${ids.map(i=>`<button class="chip ${cls}" data-go="${i}" data-peek="${i}">${esc(byId[i].t)}</button>`).join('')}</div>`:''}

function showEntry(id){
  curId=id; const e=byId[id];
  if(trail[trail.length-1]!==id){trail=trail.filter(x=>x!==id);trail.push(id);trail=trail.slice(-8);store.set('trail',trail)}
  document.title=e.t+' · Wiki Filosófica';
  const see=e.see, cites=e.out.filter(x=>!see.includes(x)), inn=e.inn.filter(x=>x!==id);
  const L=fold(e.t)[0].toUpperCase();
  view.innerHTML=`<div class="page">
    <article>
      <div class="kicker"><span>Verbete · ${L}</span><span>${e.deg} ligações</span></div>
      <h1>${esc(e.t)}</h1>
      ${e.e?`<p class="etym">${esc(e.e)}</p>`:''}
      <div class="def">${linkify(e.a)}</div>
      <div class="actions">
        <button class="btn" id="fav" aria-pressed="${favs.has(id)}">${favs.has(id)?'★ Nos favoritos':'☆ Favoritar'}</button>
        <button class="btn" id="copy">Copiar verbete</button>
        <button class="btn" id="rnd2">Outro ao acaso</button>
      </div>
      <div class="legend"><span class="lc">conceito com verbete próprio</span><span class="tc">pensador (abre lista de verbetes)</span></div>
    </article>
    <aside class="rel">
      <div class="box"><h2>Mapa de ligações</h2><div class="graph">${graph(e)}<div class="cap"><span>── cita</span><span>- - é citado por</span></div></div></div>
      ${see.length?`<div class="box"><h2>Ver também <span>${see.length}</span></h2>${chips(see,'see')}</div>`:''}
      <div class="box"><h2>Este verbete cita <span>${cites.length}</span></h2>${chips(cites)||'<p class="empty">Nenhum outro verbete citado.</p>'}</div>
      <div class="box"><h2>Citado por <span>${inn.length}</span></h2>${chips(inn)||'<p class="empty">Ainda nenhum verbete aponta para cá.</p>'}</div>
      ${e.p.length?`<div class="box"><h2>Pensadores <span>${e.p.length}</span></h2><div class="chips">${e.p.map(n=>`<button class="chip th" data-go="p-${thSlug(n)}">${esc(n)}</button>`).join('')}</div></div>`:''}
    </aside></div>`;
  $('#fav').onclick=()=>{favs.has(id)?favs.delete(id):favs.add(id);store.set('favs',[...favs]);showEntry(id)};
  $('#rnd2').onclick=random;
  $('#copy').onclick=ev=>{const t=`${e.t}${e.e?' ('+e.e+')':''}\n${e.plain}\n\nFonte: ${META.fonte}, ${META.autor}`;
    const b=ev.target;Promise.resolve().then(()=>navigator.clipboard.writeText(t)).then(()=>{b.textContent='Copiado'},()=>{b.textContent='Não foi possível copiar'});setTimeout(()=>b.textContent='Copiar verbete',1800)};
}

function graph(e){
  const W=300,H=260,cx=W/2,cy=H/2;
  const out=e.out.filter(x=>x!==e.id), inn=e.inn.filter(x=>x!==e.id&&!out.includes(x));
  let nodes=[...out.map(i=>({i,k:'out'})),...inn.map(i=>({i,k:'in'}))];
  const more=Math.max(0,nodes.length-14); nodes=nodes.slice(0,14);
  const R=Math.min(W,H)/2-34;
