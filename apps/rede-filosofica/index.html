<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rede Filosófica · Prática Filosófica</title>
<meta name="description" content="Mapa em rede de 128 filósofos: influências, mestres e discípulos, críticas, diálogos, correntes, conceitos, linha do tempo e mapa-múndi.">
<script>try{ document.documentElement.dataset.tema = localStorage.getItem("tema")==="escuro" ? "escuro" : "claro"; }catch(e){ document.documentElement.dataset.tema="claro"; }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mesma família visual da Rede Lusófona. Barra no topo, tela da rede à esquerda, painel de abas à direita. */
:root{
  --fundo:#faf8f5; --fundo2:#f0ece6; --cartao:#ffffff; --tinta:#121212; --apagado:#5d5751; --borda:#e2ddd5;
  --destaque:#c1272d; --destaque-suave:#f7e2e2; --certo:#23845a;
  --l-inf:#4a4540; --l-mest:#c27417; --l-crit:#c1272d; --l-dial:#335fc0;
  --L:43%; --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --fundo:#111111; --fundo2:#1b1b1b; --cartao:#171717; --tinta:#f3f0eb; --apagado:#aaa39b; --borda:#2f2c29;
  --destaque:#e8484e; --destaque-suave:#3b1a1c; --certo:#4cc58c;
  --l-inf:#bdb6ad; --l-mest:#e7a35c; --l-crit:#ef5a5f; --l-dial:#7aa2f0; --L:64%; color-scheme:dark}}
:root[data-tema="escuro"]{
  --fundo:#111111; --fundo2:#1b1b1b; --cartao:#171717; --tinta:#f3f0eb; --apagado:#aaa39b; --borda:#2f2c29;
  --destaque:#e8484e; --destaque-suave:#3b1a1c; --certo:#4cc58c;
  --l-inf:#bdb6ad; --l-mest:#e7a35c; --l-crit:#ef5a5f; --l-dial:#7aa2f0; --L:64%; color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--fundo);color:var(--tinta);line-height:1.5;overflow:hidden;font-size:15px}
button,input,select{font:inherit;color:inherit}
a{color:var(--destaque)}
:focus-visible{outline:2px solid var(--destaque);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

.topo{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--tinta);background:var(--fundo);flex-wrap:wrap}
.voltar{font-size:.82rem;color:var(--apagado);text-decoration:none;white-space:nowrap}
.voltar:hover{color:var(--destaque)}
.marca{font-family:var(--serif);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;text-transform:lowercase;white-space:nowrap}
.marca i{color:var(--destaque)}
.busca{position:relative;flex:1;min-width:180px;max-width:360px}
.busca input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--borda);border-radius:4px;background:var(--cartao)}
.busca input:focus{outline:none;border-color:var(--destaque);box-shadow:0 0 0 3px var(--destaque-suave)}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--apagado)}
.sugestoes{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--cartao);border:1px solid var(--borda);border-radius:4px;max-height:320px;overflow:auto;z-index:30;box-shadow:4px 4px 0 var(--fundo2)}
.sugestoes button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border:0;background:none;cursor:pointer;font-size:.9rem}
.sugestoes button:hover,.sugestoes button.ativo{background:var(--fundo2)}
.sugestoes small{color:var(--apagado);margin-left:auto;font-size:.75rem;white-space:nowrap}
.layouts{display:flex;border:1.5px solid var(--borda);border-radius:999px;overflow:hidden}
.layouts button{border:0;background:var(--cartao);padding:6px 14px;cursor:pointer;font-size:.85rem;font-weight:500}
.layouts button[aria-pressed="true"]{background:var(--tinta);color:var(--fundo)}
.tema{border:1.5px solid var(--borda);background:var(--cartao);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.tema:hover{border-color:var(--destaque)}

.principal{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.tela{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--fundo)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg:active{cursor:grabbing}
.painel{border-left:1px solid var(--tinta);background:var(--cartao);display:flex;flex-direction:column;min-height:0}
.abas{display:flex;border-bottom:1px solid var(--borda);overflow-x:auto;flex-shrink:0}
.abas button{flex:1;border:0;background:none;padding:11px 6px;font-size:.76rem;font-weight:600;letter-spacing:.03em;cursor:pointer;color:var(--apagado);border-bottom:2.5px solid transparent;white-space:nowrap}
.abas button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--destaque)}
.conteudo{padding:18px 18px 28px;overflow-y:auto;flex:1}
.puxador{display:none}

.ano-box{position:absolute;left:16px;top:12px;pointer-events:none}
.ano{font-family:var(--serif);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.03em;opacity:.85;font-variant-numeric:tabular-nums}
.ano-info{font-size:.78rem;color:var(--apagado);margin-top:2px}
.camadas{position:absolute;left:16px;top:76px;display:flex;flex-wrap:wrap;gap:6px;max-width:66%}
.camadas button{border:1.5px solid var(--borda);background:var(--cartao);border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:500;cursor:pointer;color:var(--apagado)}
.camadas button:hover{border-color:var(--destaque);color:var(--destaque)}
.camadas button[aria-pressed="true"]{background:var(--tinta);color:var(--fundo);border-color:var(--tinta)}
.camadas .sep-c{width:100%;height:0}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border:1.5px solid var(--borda);background:var(--cartao);border-radius:4px;cursor:pointer;font-size:1.05rem;line-height:1}
.zoom button:hover{border-color:var(--destaque)}
.legenda{position:absolute;left:12px;bottom:72px;background:color-mix(in srgb,var(--cartao) 92%,transparent);border:1px solid var(--borda);border-radius:4px;padding:8px 10px;font-size:.74rem;display:grid;gap:3px;max-width:240px}
.legenda b{font-weight:600;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);margin-top:4px}
.legenda .corpo{display:grid;gap:3px}
.legenda.fechada .corpo{display:none}
.legenda .alterna{border:0;background:none;cursor:pointer;font-size:.72rem;color:var(--apagado);text-align:left;padding:0}
.legenda button.tp{display:flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;padding:1px 0;text-align:left;font-size:.76rem}
.legenda button.tp[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legenda span{display:flex;align-items:center;gap:7px}
.legenda svg{flex-shrink:0}
.tempo{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--borda);background:color-mix(in srgb,var(--fundo) 94%,transparent)}
.tempo input{flex:1;accent-color:var(--destaque);min-width:0}
.tempo .play{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--tinta);background:var(--cartao);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.tempo .play:hover{border-color:var(--destaque);color:var(--destaque)}
.tempo label{font-size:.78rem;color:var(--apagado);white-space:nowrap}
.cartao-h{position:absolute;z-index:12;width:260px;background:var(--cartao);border:1px solid var(--tinta);border-radius:4px;padding:10px 12px;pointer-events:none;box-shadow:4px 4px 0 var(--destaque);font-size:.84rem;line-height:1.4}
.cartao-h b{font-family:var(--serif);font-size:1.05rem;display:block}
.cartao-h span{color:var(--apagado);font-size:.76rem;display:block}
.cartao-h p{margin-top:6px;font-family:var(--serif);font-style:italic}
.cartao-h small{display:block;color:var(--apagado);margin-top:6px;font-size:.72rem}
.aviso{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--tinta);color:var(--fundo);padding:8px 14px;border-radius:4px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:20}
.aviso.ver{opacity:1;pointer-events:auto}
.aviso a{color:inherit;font-weight:600}

/* grafo */
.lk{fill:none;stroke-linecap:round;transition:opacity .2s}
.lk.inf{stroke:var(--l-inf);stroke-width:1.1;opacity:.45}
.lk.mest{stroke:var(--l-mest);stroke-width:2.2;opacity:.65}
.lk.crit{stroke:var(--l-crit);stroke-width:1.4;stroke-dasharray:5 3;opacity:.6}
.lk.dial{stroke:var(--l-dial);stroke-width:1.2;stroke-dasharray:1.5 3.5;opacity:.6}
.mk-inf{fill:var(--l-inf)} .mk-mest{fill:var(--l-mest)} .mk-crit{fill:var(--l-crit)} .mk-dial{fill:var(--l-dial)}
.modo-tempo .lk:not(.viz){opacity:0}
.modo-mapa .lk{display:none}
.lk.off,.no.off,.rot.off{display:none}
.apagando .lk:not(.viz){opacity:.05}
.lk.viz{opacity:1;stroke-width:2.2}
.lk.mest.viz{stroke-width:3}
.lk.caminho{stroke:var(--destaque)!important;stroke-width:3.4!important;opacity:1!important;stroke-dasharray:none!important}
.no{cursor:pointer}
.no circle{stroke:var(--fundo);stroke-width:1.5;transition:opacity .2s}
.no.fora circle{stroke:var(--tinta);stroke-width:1.6;stroke-dasharray:2.5 2}
.no.foco circle{stroke:var(--destaque);stroke-width:3.5;stroke-dasharray:none}
.no.caminho circle{stroke:var(--destaque);stroke-width:3;stroke-dasharray:none}
.apagando .no:not(.viz):not(.foco){opacity:.13}
.filtrado .no.fil{opacity:.1}
.filtrado .lk.fil{opacity:.03}
.no.agrupado{display:none}
.rot{fill:var(--tinta);paint-order:stroke;stroke:var(--fundo);stroke-linejoin:round;pointer-events:none;text-anchor:middle;opacity:0;transition:opacity .15s}
.rot.mostra{opacity:1}
.rot.foco{font-weight:700}
.rot.cid{font-family:var(--serif);font-style:italic;font-weight:600;fill:var(--apagado)}
.pais{fill:var(--fundo2);stroke:var(--borda);stroke-width:.6}
.pais.tem{cursor:pointer}
.pais.tem:hover{stroke:var(--destaque);stroke-width:1.2}
.pais.sel{stroke:var(--destaque);stroke-width:2}
.grat{fill:none;stroke:var(--borda);stroke-width:.4;opacity:.8}
.esfera{fill:color-mix(in srgb,var(--fundo2) 35%,var(--fundo));stroke:var(--borda);stroke-width:.8}
.clu{cursor:pointer}
.clu circle{fill:var(--cartao);stroke:var(--tinta);stroke-width:1.4}
.clu:hover circle{stroke:var(--destaque);stroke-width:2.2}
.clu text{font-weight:600;text-anchor:middle;dominant-baseline:central;fill:var(--tinta);pointer-events:none;font-variant-numeric:tabular-nums}
.clu.viz circle{stroke:var(--destaque);stroke-width:2.6}
.apagando .clu:not(.viz){opacity:.35}
.arco{fill:none;stroke-linecap:round;opacity:.9}
.arco.inf{stroke:var(--l-inf)} .arco.mest{stroke:var(--l-mest)} .arco.crit{stroke:var(--l-crit);stroke-dasharray:6 4} .arco.dial{stroke:var(--l-dial);stroke-dasharray:2 4}
.arco.caminho{stroke:var(--destaque);stroke-dasharray:none}
@keyframes corre{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion:no-preference){.arco.inf,.arco.mest{stroke-dasharray:8 7;animation:corre 1.4s linear infinite}}
.era rect{fill:var(--fundo2)}
.era:nth-child(even) rect{fill:var(--fundo)}
.era text{font-family:var(--serif);font-style:italic;font-weight:600;fill:var(--apagado)}
.eixo text{fill:var(--apagado);font-variant-numeric:tabular-nums}
.eixo line{stroke:var(--borda)}
.faixa text{fill:var(--apagado);font-weight:600;text-anchor:end}
.faixa line{stroke:var(--borda);stroke-dasharray:2 4}
.regiao path{stroke-linejoin:round;stroke-linecap:round}
.regiao text{font-family:var(--serif);font-style:italic;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--fundo);stroke-linejoin:round;pointer-events:none}
.apagando .regiao{opacity:.35}
.trilha-linha{fill:none;stroke:var(--destaque);stroke-width:2.6;stroke-dasharray:7 5;opacity:.85;pointer-events:none}
.trilha-num{font-weight:700;fill:var(--destaque);paint-order:stroke;stroke:var(--fundo);stroke-linejoin:round}

/* painel */
.kicker{font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--destaque);margin-bottom:6px}
h2{font-family:var(--serif);font-weight:800;font-size:1.6rem;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
h3{font-family:var(--serif);font-weight:600;font-size:1.1rem;margin:20px 0 8px}
h4{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado);margin:18px 0 8px}
.meta{font-size:.85rem;color:var(--apagado);margin-top:6px}
.selos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.selo{font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--fundo2);color:var(--apagado);font-weight:500;border:0;cursor:default}
button.selo{cursor:pointer}
.selo.cor{color:#fff;background:var(--c)}
p.ideia{margin-top:14px;font-size:.95rem}
blockquote{margin:16px 0 0;padding:4px 0 4px 14px;border-left:3px solid var(--destaque);font-family:var(--serif);font-style:italic;font-size:1.08rem;line-height:1.4}
blockquote cite{display:block;font-family:var(--sans);font-style:normal;font-size:.76rem;color:var(--apagado);margin-top:6px}
.lista{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px 8px;margin:0 -8px;border-radius:4px;cursor:pointer;font-size:.88rem;width:calc(100% + 16px)}
.item:hover{background:var(--fundo2)}
.item .bola{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
.item small{display:block;color:var(--apagado);font-size:.78rem;line-height:1.35}
.item .dir{margin-left:auto;color:var(--apagado);font-size:.76rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--borda);background:var(--cartao);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--destaque);color:var(--destaque)}
.chip.on{background:var(--tinta);color:var(--fundo);border-color:var(--tinta)}
.chip.desl{opacity:.4}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.botoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1.5px solid var(--tinta);background:var(--cartao);border-radius:4px;padding:8px 13px;font-size:.84rem;font-weight:500;cursor:pointer;text-decoration:none;color:var(--tinta);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--destaque);color:var(--destaque)}
.btn.forte{background:var(--tinta);color:var(--fundo)}
.btn.forte:hover{background:var(--destaque);border-color:var(--destaque);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.campo{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:.82rem;color:var(--apagado)}
.campo select{padding:8px 10px;border:1.5px solid var(--borda);border-radius:4px;background:var(--cartao);font-size:.92rem;color:var(--tinta)}
.cartoes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.numero{background:var(--fundo2);border-radius:4px;padding:10px 12px}
.numero b{display:block;font-family:var(--serif);font-size:1.5rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.numero span{font-size:.76rem;color:var(--apagado)}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.comparar>div{background:var(--fundo2);border-radius:4px;padding:12px;min-width:0}
.comparar h5{font-family:var(--serif);font-size:1rem;font-weight:600;margin-bottom:4px;cursor:pointer}
.comparar h5:hover{color:var(--destaque)}
.comparar p{font-size:.82rem}
.comparar blockquote{font-size:.9rem;margin-top:8px}
.nota{margin-top:12px;font-size:.92rem;padding:10px 12px;background:var(--destaque-suave);border-radius:4px}
.trilha{border:1px solid var(--borda);border-radius:4px;padding:12px 14px;cursor:pointer;background:var(--cartao);text-align:left;width:100%;margin-bottom:8px;display:block}
.trilha:hover{border-color:var(--tinta);box-shadow:4px 4px 0 var(--destaque)}
.trilha b{font-family:var(--serif);font-size:1.05rem;font-weight:600;display:block}
.trilha span{font-size:.84rem;color:var(--apagado)}
.progresso{height:4px;background:var(--fundo2);border-radius:2px;margin:12px 0;overflow:hidden}
.progresso i{display:block;height:100%;background:var(--destaque);transition:width .3s}
.passos{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.passos span{font-size:.8rem;color:var(--apagado);font-variant-numeric:tabular-nums}
.pergunta{font-family:var(--serif);font-size:1.12rem;line-height:1.4;margin-top:12px}
.opcoes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opcao{border:1.5px solid var(--borda);background:var(--cartao);border-radius:4px;padding:10px 12px;text-align:left;cursor:pointer;font-size:.92rem}
.opcao:hover:not(:disabled){border-color:var(--tinta)}
.opcao.certa{border-color:var(--certo);background:color-mix(in srgb,var(--certo) 14%,var(--cartao))}
.opcao.errada{border-color:var(--destaque);background:var(--destaque-suave)}
.placar{display:flex;gap:14px;font-size:.84rem;color:var(--apagado);margin-top:4px;flex-wrap:wrap}
.placar b{color:var(--tinta);font-variant-numeric:tabular-nums}
.ranking{counter-reset:r}
.ranking .item{counter-increment:r}
.ranking .item::before{content:counter(r);font-family:var(--serif);font-weight:800;width:20px;color:var(--apagado);flex-shrink:0}
.ranking .item>div{flex:1;min-width:0}
.barra{height:5px;background:var(--fundo2);border-radius:3px;margin-top:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--c,var(--destaque))}
.dica{font-size:.84rem;color:var(--apagado);margin-top:10px}
.sep{border:0;border-top:1px solid var(--borda);margin:20px 0}
textarea.saida{width:100%;min-height:110px;margin-top:10px;font:.78rem ui-monospace,monospace;background:var(--fundo2);color:var(--tinta);border:1px solid var(--borda);border-radius:4px;padding:8px}
.carregando{position:absolute;inset:0;display:grid;place-items:center;color:var(--apagado);font-size:.9rem;pointer-events:none}

@media (max-width:860px){
  .principal{grid-template-columns:1fr;position:relative}
  .painel{position:absolute;left:0;right:0;bottom:0;max-height:62%;border-left:0;border-top:1px solid var(--tinta);z-index:15;transition:transform .25s;box-shadow:0 -6px 0 var(--fundo2);padding-bottom:env(safe-area-inset-bottom,0px)}
  .painel.recolhido{transform:translateY(calc(100% - 92px))}
  .puxador{display:block;border:0;background:none;width:100%;padding:6px 0 0;cursor:pointer}
  .puxador i{display:block;width:44px;height:4px;border-radius:2px;background:var(--borda);margin:0 auto}
  .tempo{bottom:92px}
  .legenda{bottom:160px}
  .camadas{top:66px;max-width:82%}
  .marca{font-size:1.2rem}
  .busca{order:3;max-width:none;flex-basis:100%}
  .ano{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="topo">
    <a class="voltar" href="../../">← Prática Filosófica</a>
    <div class="marca">rede <i>filosófica</i></div>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

/* tema: o mesmo botão e a mesma chave do resto do site */
(function(){
  const h = document.documentElement; let t = null;
  try{ t = localStorage.getItem("tema"); }catch(e){}
  if(t === "escuro" || t === "claro") h.dataset.tema = t;
  else if(h.getAttribute("data-theme")) h.dataset.tema = h.getAttribute("data-theme") === "dark" ? "escuro" : "claro";
  else if(SITE) h.dataset.tema = "claro";
  new MutationObserver(() => { let s = null; try{ s = localStorage.getItem("tema"); }catch(e){} if(!s && h.getAttribute("data-theme")) h.dataset.tema = h.getAttribute("data-theme") === "dark" ? "escuro" : "claro"; }).observe(h, {attributes:true, attributeFilter:["data-theme"]});
})();
$("#tema").onclick = () => {
  const h = document.documentElement;
  const escuro = h.dataset.tema ? h.dataset.tema === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches;
  h.dataset.tema = escuro ? "claro" : "escuro";
  try{ localStorage.setItem("tema", h.dataset.tema); }catch(e){}
};

const curInfo = Object.fromEntries(CUR.map(c => [c[0], {nome:c[1], h:c[2], s:c[3]}]));
const corC = c => `hsl(${curInfo[c].h} ${curInfo[c].s}% var(--L))`;
const TIPOS = {
  inf:{nome:"Influência", verbo:"influenciou", inv:"foi influenciado por"},
  mest:{nome:"Mestre e discípulo", verbo:"foi mestre de", inv:"foi aluno de"},
  crit:{nome:"Crítica", verbo:"criticou", inv:"foi criticado por"},
  dial:{nome:"Diálogo ou debate", verbo:"dialogou com", inv:"dialogou com"}

const TCOD = {i:"inf", m:"mest", c:"crit", d:"dial"};
const nos = RAW.split("\n").map(l => { const p = l.split("|");
  return {id:p[0], n:p[1], a:+p[2], b:p[3] === "" ? null : +p[3], c:p[4], loc:p[5], lat:+p[6], lon:+p[7], q:p[8], o:p[9], k:p[10].split(";"), f:p[11] === "1"}; });
const porId = Object.fromEntries(nos.map(n => [n.id, n]));
const ligs = LRAW.split(/\s+/).filter(Boolean).map(s => { const [m, t] = s.split(":"); const [a, b] = m.split(">"); return {s:a, t:b, tp:TCOD[t], source:a, target:b}; })
  .filter(l => porId[l.s] && porId[l.t]);
const viz = {}; nos.forEach(n => viz[n.id] = []);
ligs.forEach(l => { viz[l.s].push({o:l.t, l, dir:"sai"}); viz[l.t].push({o:l.s, l, dir:"entra"}); });
nos.forEach(n => { n.grau = viz[n.id].length; n.r = 4 + Math.sqrt(n.grau) * 2.2; });
const anoTxt = y => y < 0 ? `${-y} a.C.` : String(y);
const vida = n => n.b == null ? `nasc. ${anoTxt(n.a)}` : n.a < 0 && n.b < 0 ? `${-n.a} a ${-n.b} a.C.` : n.a < 0 ? `${-n.a} a.C. a ${n.b} d.C.` : `${n.a} a ${n.b}`;
const curto = n => n.n.replace(/ \(.*\)/, "");

let paises = null, contagemPais = new Map();

if(typeof topojson !== "undefined" && MUNDO){

  nos.forEach(n => { const f = paises.find(p => d3.geoContains(p, [n.lon, n.lat])); n.pais = f ? (NOME_PAIS[f.properties.name] || f.properties.name) : (n.loc.includes("Martinica") ? "Martinica (França)" : null); if(f) contagemPais.set(f, (contagemPais.get(f) || 0) + 1); });
  nos.filter(n => !n.pais).forEach(n => { let best = null, bd = 1e9; paises.forEach(p => { const d = d3.geoDistance([n.lon, n.lat], d3.geoCentroid(p)); if(d < bd){ bd = d; best = p; } }); if(best && bd < .05){ n.pais = NOME_PAIS[best.properties.name] || best.properties.name; contagemPais.set(best, (contagemPais.get(best) || 0) + 1); } });

const nomePais = f => NOME_PAIS[f.properties.name] || f.properties.name;
/* agrupamentos do mapa: no zoom do mundo, quem nasceu no mesmo país vira uma bolha com o número */
const lugares = {};
nos.forEach(n => { const key = n.pais || n.loc; n.lugar = key; (lugares[key] = lugares[key] || {key, nome:(n.pais || n.loc).replace(/ \(.*\)/, ""), ids:[]}).ids.push(n.id); });
Object.values(lugares).forEach(g => { g.lat = d3.mean(g.ids, id => porId[id].lat); g.lon = d3.mean(g.ids, id => porId[id].lon); });
const grupos = Object.values(lugares).filter(g => g.ids.length > 1);

/* ====================== estado ====================== */
const E = {
  layout:guarda.get("layout", "rede"), aba:"explorar", ano:2026,
  sel:null, conc:null, cor:null, pais:null,
  caminho:null, pa:"socrates", pb:"freire",

/* ====================== svg ====================== */
const tela = $("#tela");
const W = () => tela.clientWidth, H = () => tela.clientHeight;
const svg = d3.select("#svg");

Object.keys(TIPOS).concat(["caminho"]).forEach(t => defs.append("marker").attr("id", "mk-" + t).attr("viewBox", "0 -4 8 8").attr("refX", 7).attr("refY", 0)
  .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto").attr("markerUnits", "userSpaceOnUse")
  .append("path").attr("d", "M0,-4L8,0L0,4").attr("class", "mk-" + (t === "caminho" ? "crit" : t)));

const gFundo = mundo.append("g"), gEixo = mundo.append("g"), gReg = mundo.append("g"), gLig = mundo.append("g"), gArco = mundo.append("g"),

/* ====================== escalas ====================== */
const xTempo = d3.scaleLinear().domain([-650, 500, 1400, 1800, 2030]).range([80, 1345, 1750, 2390, 3425]);
const ordemCur = CUR.map(c => c[0]);
const yTempo = c => 90 + ordemCur.indexOf(c) * 40;
let projecao = d3.geoNaturalEarth1();
function fazProjecao(){
  projecao = d3.geoNaturalEarth1().fitExtent([[12, 12], [Math.max(400, W()) - 12, Math.max(300, H()) - 12]], {type:"Sphere"});
}
const pontoLugar = n => projecao([n.lon, n.lat]);
const posMapa = n => (K < LIMIAR && grupoDe(n)) ? projecao([grupoDe(n).lon, grupoDe(n).lat]) : [n.x, n.y];
const LIMIAR = 2.6;

/* ====================== visibilidade ====================== */
const passaFiltro = n => E.cur.has(n.c) && (!E.fora || n.f);
const jaNasceu = n => n.a <= E.ano;

/* ====================== simulação ====================== */
const raioAtual = n => E.layout === "mapa" ? (2.6 + Math.sqrt(n.grau) * 1.25) / Math.max(K, LIMIAR) : n.r;
const sim = d3.forceSimulation(nos).alphaDecay(.03).velocityDecay(.38).on("tick", tick).on("end", () => { if(pendeAjuste){ pendeAjuste = false; if(E.layout === "rede") ajusta(); } if(E.layout === "mapa") atualiza(); pedeRotulos(); desenhaRegioes(); });
let pendeAjuste = false;
function ancoraCorrente(c){
  const i = ordemCur.indexOf(c), ang = i / ordemCur.length * Math.PI * 2 - Math.PI / 2, R = 600;
  return [W() / 2 + Math.cos(ang) * R, H() / 2 + Math.sin(ang) * R * .72];
}
function configura(inicial){
  sim.force("link", null).force("carga", null).force("x", null).force("y", null).force("colisao", null);
  const w = W(), h = H();
  if(E.layout === "rede"){
    sim.force("link", d3.forceLink(ligs).id(d => d.id).distance(l => l.tp === "mest" ? 40 : 64).strength(E.regioes ? .06 : .3))
      .force("carga", d3.forceManyBody().strength(E.regioes ? -90 : -190).distanceMax(600))
      .force("x", E.regioes ? d3.forceX(n => ancoraCorrente(n.c)[0]).strength(.22) : d3.forceX(w / 2).strength(.045))

/* ====================== desenho ====================== */
function curva(d){
  const s = d.source, t = d.target, dx = t.x - s.x, dy = t.y - s.y, L = Math.hypot(dx, dy) || 1;

}
let nTick = 0;
function tick(){

}
function posicionaRotulos(){

}
function desenhaFundo(){

        .attr("class", f => "pais" + (contagemPais.get(f) ? " tem" : "") + (E.pais === nomePais(f) ? " sel" : ""))

        .on("click", (ev, f) => { if(!contagemPais.get(f)) return; ev.stopPropagation(); escolhePais(nomePais(f)); })

  }

    g.append("text").attr("x", d => xTempo(d[0]) + 14).attr("y", y0 + 34).style("font-size", "26px").text(d => d[2]);

    const ex = gEixo.append("g").attr("class", "eixo");
    marcas.forEach(a => { const x = xTempo(a);
      ex.append("line").attr("x1", x).attr("x2", x).attr("y1", y0 + 44).attr("y2", y1);

/* regiões das correntes (envoltórias) */
function desenhaRegioes(){
  if(!(E.layout === "rede" && E.regioes)){ gReg.selectAll("*").remove(); return; }
  const dados = CUR.map(([c, nome]) => {
    const pts = nos.filter(n => n.c === c && jaNasceu(n) && passaFiltro(n)).map(n => [n.x, n.y]);
    return {c, nome, pts};
  }).filter(d => d.pts.length);
  const g = gReg.selectAll("g.regiao").data(dados, d => d.c).join(en => { const g = en.append("g").attr("class", "regiao"); g.append("path"); g.append("text"); return g; });
  g.select("path").attr("d", d => {
    if(d.pts.length === 1) return `M${d.pts[0][0]},${d.pts[0][1]}l0.1,0`;
    if(d.pts.length === 2) return `M${d.pts[0]}L${d.pts[1]}`;

/* arcos no mapa */
function desenhaArcos(lista){
  gArco.selectAll("*").remove();
  if(E.layout !== "mapa" || !lista.length) return;
  lista.forEach(({l, cls}) => {
    const a = porId[l.s], b = porId[l.t]; if(K < LIMIAR && a.lugar === b.lugar) return;
    const p = posMapa(a), q = posMapa(b), dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy);

/* trilha */
function desenhaTrilha(){
  gTri.selectAll("*").remove();
  if(!E.trilha) return;
  const t = TRAILS.find(x => x.id === E.trilha);
  const pts = t.s.map(([id]) => { const n = porId[id]; return E.layout === "mapa" ? posMapa(n) : [n.x, n.y]; });
  gTri.append("path").attr("class", "trilha-linha").attr("vector-effect", "non-scaling-stroke").attr("d", d3.line().curve(d3.curveCatmullRom)(pts));
  pts.forEach((p, i) => gTri.append("text").attr("class", "trilha-num").attr("x", p[0] + 8 / K).attr("y", p[1] + 14 / K).style("font-size", 12 / K + "px").attr("stroke-width", 3 / K).text(i + 1));

const grupoDe = n => lugares[n.lugar].ids.length > 1 ? lugares[n.lugar] : null;

/* ====================== destaque ====================== */
function conjuntoDestaque(){
  if(E.caminho && E.caminho.nos.length) return {nos:new Set(E.caminho.nos), ligs:new Set(E.caminho.ligs), cam:true};
  if(E.trilha){ const t = TRAILS.find(x => x.id === E.trilha), ids = new Set(t.s.map(x => x[0])), atual = t.s[E.passo][0];
    return {nos:ids, ligs:new Set(ligs.filter(l => ids.has(l.s) && ids.has(l.t) && (l.s === atual || l.t === atual))), foco:atual}; }
  if(E.conc){ const ids = new Set(nos.filter(n => n.k.includes(E.conc)).map(n => n.id)); return {nos:ids, ligs:new Set(ligs.filter(l => ids.has(l.s) && ids.has(l.t)))}; }
  if(E.cor){ const ids = new Set(nos.filter(n => n.c === E.cor).map(n => n.id)); return {nos:ids, ligs:new Set(ligs.filter(l => ids.has(l.s) && ids.has(l.t)))}; }
  if(E.pais){ const ids = new Set(nos.filter(n => n.pais === E.pais).map(n => n.id)); return {nos:ids, ligs:new Set(ligs.filter(l => ids.has(l.s) || ids.has(l.t)))}; }
  if(E.aba === "comparar" && E.cmpA && E.cmpB){ const c = bfs(E.cmpA, E.cmpB); if(c.nos.length) return {nos:new Set(c.nos), ligs:new Set(c.ligs), cam:true}; }
  if(E.sel){ const v = viz[E.sel].filter(x => E.tipos.has(x.l.tp)); return {nos:new Set([E.sel, ...v.map(x => x.o)]), ligs:new Set(v.map(x => x.l)), foco:E.sel}; }
  return null;
}
let DEST = null;
function atualiza(){
  DEST = conjuntoDestaque();
  const foco = DEST && DEST.foco;
  svg.classed("apagando", !!DEST).classed("filtrado", E.cur.size < CUR.length || E.fora);
  const mapaLonge = E.layout === "mapa" && K < LIMIAR;
  selNo.classed("off", n => !jaNasceu(n)).classed("fil", n => !passaFiltro(n))
    .classed("viz", n => DEST && DEST.nos.has(n.id)).classed("foco", n => n.id === foco || (E.cmpA === n.id && E.aba === "comparar") || (E.cmpB === n.id && E.aba === "comparar"))
    .classed("caminho", n => DEST && DEST.cam && DEST.nos.has(n.id))
    .classed("agrupado", n => mapaLonge && !!grupoDe(n));
  selLig.classed("off", l => !ligVisivel(l)).classed("fil", l => !passaFiltro(porId[l.s]) || !passaFiltro(porId[l.t]))
    .classed("viz", l => DEST && DEST.ligs.has(l)).classed("caminho", l => DEST && DEST.cam && DEST.ligs.has(l))
    .attr("marker-end", l => (DEST && DEST.ligs.has(l)) || E.layout === "rede" ? (l.tp === "dial" ? null : `url(#mk-${DEST && DEST.cam && DEST.ligs.has(l) ? "caminho" : l.tp})`) : null);
  selClu.style("display", d => mapaLonge && d.ids.some(id => jaNasceu(porId[id])) ? null : "none")
    .classed("viz", d => DEST && d.ids.some(id => DEST.nos.has(id)));
  selClu.select("text").text(d => d.ids.filter(id => jaNasceu(porId[id])).length);
  desenhaArcos(DEST && E.layout === "mapa" ? [...DEST.ligs].filter(ligVisivel).map(l => ({l, cls:DEST.cam ? "caminho" : null})) : []);
  desenhaTrilha(); desenhaRegioes();
  const vivos = nos.filter(jaNasceu).length;
  $("#ano").textContent = anoTxt(Math.round(E.ano));
  $("#anoInfo").textContent = `${vivos} de ${nos.length} pensadores${E.layout === "tempo" ? " · arraste para o lado" : ""}`;
  pedeRotulos();
}

/* ====================== rótulos sem sobreposição ====================== */
let pedido = 0;
function pedeRotulos(){ if(!pedido) pedido = requestAnimationFrame(() => { pedido = 0; arrumaRotulos(); }); }
function arrumaRotulos(){
  const t = d3.zoomTransform(svg.node()), w = W(), h = H();
  const fs = 11.5 / K;
  selRot.style("font-size", fs + "px").attr("stroke-width", 3 / K);
  selCluRot.style("font-size", 12 / K + "px").attr("stroke-width", 3 / K);
  posicionaRotulos();
  const mapaLonge = E.layout === "mapa" && K < LIMIAR;
  const foco = DEST && DEST.foco;
  const itens = [];
  nos.forEach(n => {
    if(!jaNasceu(n) || n.x == null) return;
    if(mapaLonge && grupoDe(n)) return;
    const destacado = DEST && DEST.nos.has(n.id);
    if(DEST && !destacado) return;
    if(!passaFiltro(n) && !destacado) return;
    const prio = (n.id === foco ? 1e6 : 0) + (destacado ? 1e4 : 0) + n.grau * 10 + (E.layout === "mapa" ? 0 : n.r);
    const sx = t.applyX(n.x), sy = t.applyY(n.y) - raioAtual(n) * K - 4;
    itens.push({n, prio, x:sx, y:sy, w:curto(n).length * 6.9 + 6, h:14, foco:n.id === foco});
  });
  if(mapaLonge) grupos.forEach(g => { const vivos = g.ids.filter(id => jaNasceu(porId[id])); if(!vivos.length) return;
    const p = projecao([g.lon, g.lat]); const r = 6 + Math.sqrt(vivos.length) * 2.6;
    itens.push({g, prio:5000 + vivos.length * 100, x:t.applyX(p[0]), y:t.applyY(p[1]) + r + 13, w:g.nome.length * 6.6 + 6, h:14}); });
  itens.sort((a, b) => b.prio - a.prio);
  const caixas = [], mostra = new Set();
  /* círculos dos agrupamentos ocupam espaço */
  if(mapaLonge) grupos.forEach(g => { const p = projecao([g.lon, g.lat]); const r = 6 + Math.sqrt(g.ids.length) * 2.6; caixas.push([t.applyX(p[0]) - r, t.applyY(p[1]) - r, t.applyX(p[0]) + r, t.applyY(p[1]) + r]); });
  for(const it of itens){
    const b = [it.x - it.w / 2, it.y - it.h + 3, it.x + it.w / 2, it.y + 3];
    if(!it.foco && (b[0] < 0 || b[2] > w || b[1] < 0 || b[3] > h)) continue;
    if(!it.foco && caixas.some(c => b[0] < c[2] && b[2] > c[0] && b[1] < c[3] && b[3] > c[1])) continue;
    caixas.push(b); mostra.add(it.n || it.g);
  }
  selRot.classed("mostra", d => mostra.has(d)).classed("foco", d => d.id === foco);
  selCluRot.classed("mostra", d => mapaLonge && mostra.has(d)).attr("y", d => projecao([d.lon, d.lat])[1] + (6 + Math.sqrt(d.ids.length) * 2.6 + 13) / K);
  selClu.select("circle").attr("r", d => (6 + Math.sqrt(d.ids.filter(id => jaNasceu(porId[id])).length || 1) * 2.6) / K).attr("stroke-width", null);
  selClu.select("text").style("font-size", 11 / K + "px");
}

function ajustaCaixa(x0, y0, x1, y1, anim = true, max = 2){
  const w = W(), h = H(), k = Math.min(max, w / Math.max(1, x1 - x0) * .92, (h - 90) / Math.max(1, y1 - y0) * .92);
  const t = d3.zoomIdentity.translate(w / 2 - k * (x0 + x1) / 2, (h - 40) / 2 - k * (y0 + y1) / 2).scale(k);

}
const REGIOES = {mundo:[-130, -50, 150, 70, "Mundo"], europa:[-11, 36, 31, 59, "Europa"], medit:[-10, 27, 40, 46, "Mediterrâneo"], americas:[-125, -45, -30, 50, "Américas"], africa:[-20, -36, 52, 38, "África"], asia:[25, 5, 130, 55, "Ásia"]};
function regiao(nome, anim = true){
  const [a, b, c, d] = REGIOES[nome];
  const pts = []; for(let lo = a; lo <= c; lo += (c - a) / 6) for(let la = b; la <= d; la += (d - b) / 6) pts.push(projecao([lo, la]));
  ajustaCaixa(d3.min(pts, p => p[0]), d3.min(pts, p => p[1]), d3.max(pts, p => p[0]), d3.max(pts, p => p[1]), anim, 12);
}

function bfs(a, b){
  const prev = {[a]:null}, fila = [a];
  while(fila.length){ const u = fila.shift(); if(u === b) break;
    for(const x of viz[u]){ if(!E.tipos.has(x.l.tp) || x.o in prev) continue; prev[x.o] = {u, l:x.l}; fila.push(x.o); } }
  if(!(b in prev)) return {a, b, nos:[], ligs:[]};
  const ns = [b], ls = []; let c = b; while(prev[c]){ ls.unshift(prev[c].l); c = prev[c].u; ns.unshift(c); }
  return {a, b, nos:ns, ligs:ls};
}

let placar = guarda.get("placar", {certas:0, total:0, seq:0, rec:0}), pergunta = null;
function novaPergunta(){
  const tipo = sorteia(["inf", "inf", "mest", "cit", "obra", "cor", "conc", "antes"]);
  const nomes = arr => arr.map(x => x.n);
  if(tipo === "cit" || tipo === "obra"){ const n = sorteia(nos.filter(x => x.q && x.o && !/formulação|relato|citado|paráfrase/.test(x.o)));
    if(tipo === "cit"){ const err = embaralha(nos.filter(x => x.id !== n.id && x.q)).slice(0, 3); return {p:`De quem é esta frase?<br><i>“${esc(n.q)}”</i>`, ans:n.n, ops:embaralha(nomes([n, ...err])), go:n.id, extra:`Está em <i>${esc(n.o)}</i>.`}; }
    const err = embaralha(nos.filter(x => x.id !== n.id && x.o && !/formulação|relato|citado|paráfrase|resenha|carta/.test(x.o))).slice(0, 3);
    return {p:`Qual destas obras é de <b>${esc(n.n)}</b>?`, ans:n.o, ops:embaralha([n.o, ...err.map(x => x.o)]), go:n.id, extra:`“${esc(n.q)}”`}; }
  if(tipo === "cor"){ const n = sorteia(nos); const err = embaralha(CUR.filter(c => c[0] !== n.c)).slice(0, 3).map(c => c[1]); return {p:`A que corrente pertence <b>${esc(n.n)}</b>?`, ans:curInfo[n.c].nome, ops:embaralha([curInfo[n.c].nome, ...err]), go:n.id}; }
  if(tipo === "conc"){ const n = sorteia(nos), k = sorteia(n.k); const err = embaralha(nos.filter(x => !x.k.includes(k))).slice(0, 3); return {p:`Qual destes pensadores trabalha o conceito de <b>${esc(k)}</b>?`, ans:n.n, ops:embaralha(nomes([n, ...err])), go:n.id}; }
  if(tipo === "antes"){ let qs; do{ qs = embaralha(nos).slice(0, 4); } while(new Set(qs.map(x => x.a)).size < 4); const n = qs.reduce((m, x) => x.a < m.a ? x : m);
    return {p:`Quem destes nasceu primeiro?`, ans:n.n, ops:embaralha(nomes(qs)), go:n.id, extra:qs.sort((x, y) => x.a - y.a).map(x => `${esc(curto(x))} (${anoTxt(x.a)})`).join(" · ")}; }
  const t = tipo === "mest" ? "mest" : "inf", l = sorteia(ligs.filter(x => x.tp === t)), sim_ = new Set(viz[l.t].filter(x => x.dir === "entra" && x.l.tp === t).map(x => x.o));
  const err = embaralha(nos.filter(x => !sim_.has(x.id) && x.id !== l.t)).slice(0, 3);
  return {p:t === "mest" ? `Quem foi mestre de <b>${esc(porId[l.t].n)}</b>?` : `Quem influenciou <b>${esc(porId[l.t].n)}</b>?`, ans:porId[l.s].n, ops:embaralha(nomes([porId[l.s], ...err])), go:l.t};
}
function abaDesafio(){

/* análise */
function intermediacao(){
  const C = {}; nos.forEach(n => C[n.id] = 0);
  nos.forEach(s => { const pilha = [], P = {}, sg = {}, d = {}; nos.forEach(n => { P[n.id] = []; sg[n.id] = 0; d[n.id] = -1; }); sg[s.id] = 1; d[s.id] = 0; const f = [s.id];
    while(f.length){ const v = f.shift(); pilha.push(v); viz[v].forEach(({o}) => { if(d[o] < 0){ f.push(o); d[o] = d[v] + 1; } if(d[o] === d[v] + 1){ sg[o] += sg[v]; P[o].push(v); } }); }
    const dl = {}; nos.forEach(n => dl[n.id] = 0);
    while(pilha.length){ const w = pilha.pop(); P[w].forEach(v => dl[v] += sg[v] / sg[w] * (1 + dl[w])); if(w !== s.id) C[w] += dl[w]; } });
  return C;
}
const BT = intermediacao();
nos.forEach(n => { n.bt = BT[n.id] / 2;
  n.saida = viz[n.id].filter(x => x.dir === "sai" && (x.l.tp === "inf" || x.l.tp === "mest")).length;
  n.entrada = viz[n.id].filter(x => x.dir === "entra" && (x.l.tp === "inf" || x.l.tp === "mest")).length;
  n.crit = viz[n.id].filter(x => x.l.tp === "crit").length; });
function ranking(titulo, dica, chave, fmt){
  const top = [...nos].sort((a, b) => b[chave] - a[chave]).slice(0, 8), mx = top[0][chave] || 1;

}
function barras(titulo, linhas){
  const mx = d3.max(linhas, l => l[1]) || 1;
  return `<h4>${titulo}</h4><div class="lista">${linhas.map(([nome, v, cor, acao]) => `<button class="item" ${acao || ""}><div style="flex:1;min-width:0"><span>${esc(nome)}</span><div class="barra" style="--c:${cor || "var(--destaque)"}"><i style="width:${v / mx * 100}%"></i></div></div><span class="dir">${v}</span></button>`).join("")}</div>`;
}

/* ====================== linha do tempo ====================== */
const slider = $("#slider");
slider.oninput = () => { E.ano = +slider.value; atualiza(); if(E.layout === "rede"){ sim.alpha(.25).restart(); } };
let tocando = null;
$("#play").onclick = () => {
  if(tocando){ cancelAnimationFrame(tocando); tocando = null; $("#play").textContent = "▶"; return; }
  if(E.ano >= 2026) E.ano = -650;
  $("#play").textContent = "❚❚"; let ult = performance.now();
  const passo = agora => { const dt = (agora - ult) / 1000; ult = agora;
    E.ano = Math.min(2026, E.ano + dt * (E.ano < 1400 ? 110 : 38)); slider.value = Math.round(E.ano); E.ano = Math.round(E.ano * 10) / 10;
    atualiza(); if(E.layout === "rede") sim.alpha(.12).restart();
    if(E.ano >= 2026){ E.ano = 2026; tocando = null; $("#play").textContent = "▶"; atualiza(); return; }
    tocando = requestAnimationFrame(passo); };
  tocando = requestAnimationFrame(passo);
};
$("#ano").textContent = "2026";

/* ====================== busca ====================== */
const busca = $("#busca"), sug = $("#sugestoes");
let achados = [], ativo = -1;
busca.addEventListener("input", () => {
  const q = fold(busca.value.trim()); if(!q){ sug.hidden = true; return; }
  const r = [];
  nos.forEach(n => { if(fold(n.n).includes(q)) r.push({t:"n", v:n.id, nome:n.n, sub:anoTxt(n.a), c:n.c, p:fold(n.n).startsWith(q) ? 0 : 1}); });
  conceitos.forEach(k => { if(fold(k).includes(q)) r.push({t:"k", v:k, nome:k, sub:"conceito", p:2}); });
  CUR.forEach(([c, nome]) => { if(fold(nome).includes(q)) r.push({t:"c", v:c, nome, sub:"corrente", c, p:3}); });
  [...new Set(nos.map(n => n.pais).filter(Boolean))].forEach(p => { if(fold(p).includes(q)) r.push({t:"p", v:p, nome:p, sub:"país", p:4}); });
  achados = r.sort((a, b) => a.p - b.p).slice(0, 10); ativo = achados.length ? 0 : -1;
  sug.innerHTML = achados.length ? achados.map((x, i) => `<button type="button" data-i="${i}" class="${i === ativo ? "ativo" : ""}">${x.c ? `<i class="bola" style="width:9px;height:9px;border-radius:50%;background:${corC(x.c)}"></i>` : ""}${esc(x.nome)}<small>${esc(x.sub)}</small></button>`).join("") : `<button type="button" disabled>Nada encontrado</button>`;
  sug.hidden = false;
});
function usa(x){ sug.hidden = true; busca.value = ""; busca.blur();
  if(x.t === "n") escolhe(x.v); else if(x.t === "k") escolheConceito(x.v); else if(x.t === "c") escolheCorrente(x.v); else { if(E.layout !== "mapa") mudaLayout("mapa"); escolhePais(x.v); } }
busca.addEventListener("keydown", e => {
  if(sug.hidden) return;
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); ativo = (ativo + (e.key === "ArrowDown" ? 1 : -1) + achados.length) % achados.length; sug.querySelectorAll("button").forEach((b, i) => b.classList.toggle("ativo", i === ativo)); }
  if(e.key === "Enter" && achados[ativo]){ e.preventDefault(); usa(achados[ativo]); }
  if(e.key === "Escape") sug.hidden = true;
});
sug.addEventListener("mousedown", e => { const b = e.target.closest("[data-i]"); if(b){ e.preventDefault(); usa(achados[+b.dataset.i]); } });
busca.addEventListener("blur", () => setTimeout(() => sug.hidden = true, 150));

/* ====================== painel no celular ====================== */
const painel = $("#painel");
function abrePainel(){ painel.classList.remove("recolhido"); }
$("#puxador").onclick = () => painel.classList.toggle("recolhido");
if(innerWidth < 860) painel.classList.add("recolhido");

/* ====================== início ====================== */
let tr;
addEventListener("resize", () => { clearTimeout(tr); tr = setTimeout(() => { configura(); if(E.layout !== "rede") ajusta(false); else pendeAjuste = true; }, 200); });
addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if(porId[h] && h !== E.sel) escolhe(h); });
nos.forEach(n => { n.x = W() / 2 + (Math.random() - .5) * 600; n.y = H() / 2 + (Math.random() - .5) * 500; });
(function inicia(){
  const lay = ["rede", "tempo", "mapa"].includes(E.layout) ? E.layout : "rede";
  E.layout = "rede"; configura(true);
  for(let i = 0; i < 320; i++) sim.tick();
  tick();
  if(lay !== "rede") mudaLayout(lay, true);
  else { document.querySelectorAll(".layouts button").forEach(b => b.setAttribute("aria-pressed", b.dataset.layout === "rede")); camadas(); legenda(); atualiza(); ajusta(false); }
  if(lay !== "rede") for(let i = 0; i < 200; i++) sim.tick(), tick();
  if(lay !== "rede") ajusta(false);
  render();
  $("#carregando").remove();
  const h = decodeURIComponent(location.hash.slice(1)); if(porId[h]) escolhe(h);
})();

</script>
