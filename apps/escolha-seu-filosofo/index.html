<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filosofia de Vida</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,sans-serif;min-height:100vh;background:linear-gradient(180deg,#b9dff2 0%,#dff0fa 55%,#f4fbff 100%);color:#1f4e6b;overflow-x:hidden}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:260px;height:80px;background:rgba(255,255,255,.88);border-radius:80px;animation:drift linear infinite}
.cloud::before{content:"";position:absolute;width:120px;height:120px;background:inherit;border-radius:50%;top:-50px;left:35px}
.cloud::after{content:"";position:absolute;width:90px;height:90px;background:inherit;border-radius:50%;top:-30px;right:40px}
.c1{top:6%;animation-duration:70s;animation-delay:-10s}
.c2{top:24%;transform:scale(.7);animation-duration:95s;animation-delay:-40s;opacity:.7}
.c3{top:50%;transform:scale(.9);animation-duration:80s;animation-delay:-5s}
.c4{top:72%;transform:scale(.6);animation-duration:110s;animation-delay:-60s;opacity:.6}
.c5{top:13%;transform:scale(.5);animation-duration:120s;animation-delay:-80s;opacity:.5}
@keyframes drift{from{left:-300px}to{left:110%}}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:32px 20px 60px}
header{text-align:center;margin-bottom:22px}
h1{font-size:2.6rem;color:#2a6f96;letter-spacing:-.5px}
header p{color:#4f7b93;font-size:1.02rem;margin-top:6px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.tab{border:none;background:rgba(255,255,255,.7);color:#2a6f96;padding:11px 20px;border-radius:999px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(74,144,184,.15);transition:.25s;font-size:.95rem}
.tab:hover{background:#fff}
.tab.on{background:#7fb8dd;color:#fff}
.pane{display:none}
.pane.on{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sky-label{text-align:center;font-size:.9rem;color:#4f7b93;margin-bottom:8px}
.sky{position:relative;height:580px;border-radius:32px;background:rgba(255,255,255,.28);border:2px dashed rgba(255,255,255,.9);overflow:hidden;margin-bottom:22px}
.item{position:absolute;width:210px;background:rgba(255,255,255,.92);border-radius:18px;padding:11px 13px;box-shadow:0 6px 16px rgba(60,120,160,.18);cursor:grab;user-select:none;transition:transform .25s,opacity .3s,box-shadow .25s;border:2px solid transparent}
.item:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 24px rgba(60,120,160,.25)}
.item.on{opacity:.4;filter:grayscale(.5)}
.item.dragging{opacity:.5}
.chip{display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;margin-bottom:6px}
.txt{font-size:.92rem;line-height:1.3;color:#1f4e6b;font-weight:600}
.aut{font-size:.75rem;color:#6b8ea3;margin-top:4px}
.bench{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:stretch}
.box{background:rgba(255,255,255,.72);border-radius:26px;padding:22px;box-shadow:0 10px 30px rgba(60,120,160,.12)}
.sec{font-size:.92rem;color:#2a6f96;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:700}
.agora{background:linear-gradient(180deg,#eaf6fd,#d6ecf8);border-radius:22px;padding:14px;border:2px dashed #8ec3e3;min-height:260px;transition:.25s}
.agora.over{background:#cfe9f8;border-color:#4fa3d6;box-shadow:0 0 22px rgba(79,163,214,.35)}
.agora svg{width:100%;height:auto;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:90px}
.empty{color:#6b8ea3;font-size:.92rem;width:100%;text-align:center;padding-top:20px}
.chosen{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;color:#fff;font-size:.86rem;font-weight:600;box-shadow:0 4px 10px rgba(0,0,0,.08);animation:pop .35s ease;max-width:100%}
.chosen b{cursor:pointer;opacity:.85;font-size:1.15rem;line-height:1}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.fig{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.avatar{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff,#bfe2f5);display:flex;align-items:center;justify-content:center;font-size:5rem;box-shadow:0 14px 30px rgba(60,120,160,.25);animation:pop .5s ease}
.fig h2{font-size:1.6rem;color:#2a6f96}
.tip{font-size:.95rem;color:#2f5f7a;line-height:1.5;background:rgba(127,184,221,.18);border-radius:14px;padding:12px 14px;min-height:70px}
.bars{width:100%;margin-top:6px}
.bar{margin-bottom:10px;text-align:left}
.row{display:flex;justify-content:space-between;font-size:.88rem;color:#2f5f7a;font-weight:600}
.track{height:10px;background:rgba(127,184,221,.25);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px;transition:width .5s ease}
.reset{margin-top:12px;border:none;background:rgba(127,184,221,.3);color:#2a6f96;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600}
.reset:hover{background:rgba(127,184,221,.5)}
.guides{margin-top:26px}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcard{background:rgba(255,255,255,.93);border-radius:18px;padding:16px;border-left:6px solid;box-shadow:0 6px 16px rgba(60,120,160,.1);font-size:.88rem;line-height:1.45;color:#2f5f7a;animation:fade .4s ease}
.gcard h4{font-size:1rem;color:#1f4e6b;margin-bottom:2px}
.gcard .by{font-size:.78rem;color:#6b8ea3;margin-bottom:8px}
.gcard p{margin-bottom:6px}
.gcard strong{color:#1f4e6b}
.gcard .warn{background:#fff4e1;border-radius:10px;padding:8px 10px;color:#8a5a14}
.note{margin-top:24px;text-align:center;font-size:.86rem;color:#4f7b93;background:rgba(255,255,255,.6);padding:12px 16px;border-radius:14px}
@media(max-width:820px){
  .bench{grid-template-columns:1fr}
  .sky{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
  .item{position:relative!important;left:auto!important;top:auto!important;width:auto!important}
  h1{font-size:2rem}
}
</style>
</head>

</div>

function rnd(x){ return Math.abs(Math.sin(x*12.9898)*43758.5453) % 1; }

function createApp(cfg, pane){
  const p = pane.id;
  const st = { ch: [] };

  pane.innerHTML = `
    <div class="sky-label">Ideias no céu: clique ou arraste para a Ágora. Arraste de volta para o céu para tirar.</div>
    <div class="sky" id="${p}-sky"></div>
    <div class="bench">
      <div class="box">
        <div class="sec">🏛️ Ágora: sua construção</div>
        <div class="agora" id="${p}-agora">
          <svg viewBox="0 0 600 110" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="300" cy="102" rx="290" ry="12" fill="#bfe2f5"/>
            <polygon points="110,42 300,10 490,42" fill="#9fd0ec"/>
            <text x="300" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#2a6f96" letter-spacing="4">ÁGORA</text>
            <rect x="100" y="42" width="400" height="8" fill="#7fb8dd"/>
            <g fill="#eaf6fd" stroke="#7fb8dd" stroke-width="2">
              <rect x="122" y="50" width="20" height="46"/><rect x="186" y="50" width="20" height="46"/>
              <rect x="250" y="50" width="20" height="46"/><rect x="314" y="50" width="20" height="46"/>
              <rect x="378" y="50" width="20" height="46"/><rect x="458" y="50" width="20" height="46"/>
            </g>
            <rect x="100" y="96" width="400" height="8" fill="#7fb8dd"/>
          </svg>
          <div class="chips" id="${p}-chips"></div>
        </div>
        <button class="reset" id="${p}-reset">Limpar tudo</button>
      </div>
      <div class="box fig">
        <div id="${p}-fig" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px"></div>
        <div class="bars" id="${p}-bars"></div>
      </div>
    </div>
    <div class="guides">
      <div class="sec">📘 Guia de estudo da sua construção</div>
      <div class="guide-grid" id="${p}-guides"></div>
    </div>
    <div class="note">${cfg.ressalva}</div>
  `;

  const sky = document.getElementById(p+'-sky');
  const agora = document.getElementById(p+'-agora');
  const cols = 4, rows = Math.ceil(cfg.items.length / cols);

  cfg.items.forEach((it, i) => {
    const g = cfg.groups[it.k];
    const r = Math.floor(i / cols), c = i % cols;
    const jx = (rnd(i*3+1) - .5) * 4;
    const jy = (rnd(i*5+2) - .5) * 3;
    const el = document.createElement('div');
    el.className = 'item';
    el.draggable = true;
    el.dataset.id = i;
    el.style.left = (1.5 + c*24.5 + jx) + '%';
    el.style.top = (2 + r*(96/rows) + jy) + '%';
    el.innerHTML = `<div class="txt">${it.t}</div><div class="aut">${it.w}</div>`;
    el.addEventListener('click', () => toggle(i));
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', String(i));
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    sky.appendChild(el);
  });

  agora.addEventListener('dragover', e => { e.preventDefault(); agora.classList.add('over'); });
  agora.addEventListener('dragleave', () => agora.classList.remove('over'));
  agora.addEventListener('drop', e => {
    e.preventDefault();
    agora.classList.remove('over');
    const i = +e.dataTransfer.getData('text/plain');
    if (!st.ch.includes(i)) add(i);
  });
  sky.addEventListener('dragover', e => e.preventDefault());
  sky.addEventListener('drop', e => {
    e.preventDefault();
    remove(+e.dataTransfer.getData('text/plain'));
  });
  document.getElementById(p+'-reset').addEventListener('click', () => { st.ch = []; render(); });

  function add(i){ st.ch.push(i); render(); }
  function remove(i){ st.ch = st.ch.filter(x => x !== i); render(); }
  function toggle(i){ st.ch.includes(i) ? remove(i) : add(i); }

  function render(){
    sky.querySelectorAll('.item').forEach(el => el.classList.toggle('on', st.ch.includes(+el.dataset.id)));

    const chips = document.getElementById(p+'-chips');
    chips.innerHTML = st.ch.length ? '' : `<div class="empty">Arraste ideias do céu para cá ou clique nelas.</div>`;
    st.ch.forEach(i => {
      const it = cfg.items[i], g = cfg.groups[it.k];
      const c = document.createElement('span');
      c.className = 'chosen';
      c.style.background = '#7fb8dd';
      c.innerHTML = `${it.t} <b title="remover">×</b>`;
      c.querySelector('b').addEventListener('click', e => { e.stopPropagation(); remove(i); });
      chips.appendChild(c);
    });

    const total = st.ch.length;
    const count = {};
    Object.keys(cfg.groups).forEach(k => count[k] = 0);
    st.ch.forEach(i => count[cfg.items[i].k]++);

    document.getElementById(p+'-bars').innerHTML = Object.keys(cfg.groups).map(k => {
      const g = cfg.groups[k];
      const pct = total ? Math.round(count[k] / total * 100) : 0;
      return `<div class="bar"><div class="row"><span>${g.nome}</span><span>${pct}%</span></div>
              <div class="track"><div class="fill" style="width:${pct}%;background:${g.cor}"></div></div></div>`;
    }).join('');

    const fig = document.getElementById(p+'-fig');
    if (!total) {
      fig.innerHTML = `<div class="avatar">❔</div><h2>Seu perfil aparece aqui</h2><div class="tip">${cfg.vazio}</div>`;
    } else {
      const keys = Object.keys(count).sort((a, b) => count[b] - count[a]);
      const top = keys[0];
      const share = count[top] / total;
      const g = cfg.groups[top];
      const idx = share >= .75 ? 3 : share >= .5 ? 2 : share >= .25 ? 1 : 0;
      if (share >= .5) {
        fig.innerHTML = `<div class="avatar">${g.emojis[idx]}</div><h2>${g.perfil}</h2><div class="tip">${g.dica}</div>`;
      } else {
        const presentes = keys.filter(k => count[k] > 0);
        const fraco = keys[keys.length - 1];
        const nomes = presentes.slice(0, 3).map(k => cfg.groups[k].nome.toLowerCase()).join(', ');
        const paragrafo = `Seu perfil é misto: aparecem juntos ${nomes}. Pontos fortes: ${textosMistos[top].forca} Pontos a trabalhar: ${textosMistos[fraco].desafio} Onde trabalhar: explore mais ${cfg.groups[fraco].nome}, lendo os guias abaixo das suas escolhas e discutindo essas ideias com colegas.`;
        fig.innerHTML = `<div class="avatar">🧩</div><h2>Perfil misto</h2><div class="tip">${paragrafo}</div>`;
      }
    }

    const gw = document.getElementById(p+'-guides');
    gw.innerHTML = total
      ? st.ch.map(i => {
          const it = cfg.items[i], g = cfg.groups[it.k], G = it.g;
          return `<div class="gcard" style="border-color:#7fb8dd">
            <h4>${it.t}</h4>
            <div class="by">${it.w}</div>
            <p><strong>📖 Leitura:</strong> ${G.l}</p>
            <p><strong>📑 Capítulo ou trecho:</strong> ${G.c}</p>
            <p><strong>📄 Artigo:</strong> ${G.a}</p>
            <p><strong>🎬 Vídeo:</strong> ${G.v}</p>
            <p><strong>🧭 Orientação:</strong> ${G.o}</p>
            <p class="warn"><strong>⚠️ Ressalva:</strong> ${G.r}</p>
          </div>`;
        }).join('')
      : `<div class="empty">Os guias de leitura aparecem aqui conforme você escolhe as ideias.</div>`;
  }

  render();
}

createApp(cfg1, document.getElementById('pane-0'));
createApp(cfg2, document.getElementById('pane-1'));
createApp(cfg3, document.getElementById('pane-2'));

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('pane-' + btn.dataset.t).classList.add('on');
  });
});
</script>
